 "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, quy định về thử tĩnh thang di động định kỳ được thực hiện như thế nào?", "opts": {"A": "Ba tháng một lần dùng vật nặng 100kg để thử lực chịu tải của chân thang.", "B": "Sáu tháng một lần cần phải dùng một vật nặng 110kg để treo trên từng bậc thang (kiểu thử tĩnh) xem thang có chịu được không, loại bỏ nếu thử không đạt, ghi sổ theo dõi hoặc phần mềm quản lý.", "C": "Mỗi năm một lần dùng vật nặng 225kg để thử tĩnh đối với loại thang bằng kim loại.", "D": "Trước mỗi ca làm việc phải treo vật nặng bằng trọng lượng cơ thể người lao động lên bậc trên cùng để thử."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, đối với công việc không thuộc trường hợp bắt buộc theo kế hoạch và có yếu tố nguy hiểm, ai là người quyết định việc khảo sát hiện trường?", "opts": {"A": "Người trực tiếp làm công tác an toàn các cấp của đơn vị.", "B": "Tổng giám đốc hoặc Phó Tổng giám đốc Công ty cổ phần Nhiệt điện Quảng Ninh.", "C": "Đơn vị quản lý vận hành/đơn vị công tác quyết định việc khảo sát hiện trường.", "D": "Người cấp phiếu công tác phối hợp với Người ra lệnh công tác quyết định."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về phạm vi làm việc của Đơn vị công tác sau khi Đơn vị QLVH căng dây cảnh báo tạo ranh giới an toàn?", "opts": {"A": "Đơn vị công tác được phép mở rộng phạm vi làm việc ra xung quanh nếu thấy rào chắn tạm thời chưa đủ.", "B": "Trong quá trình làm việc, Đơn vị công tác chỉ được phép làm việc trong khu vực này.", "C": "Nhân viên công tác ra khỏi vị trí làm việc được tự ý trở lại nếu dây cảnh báo giữ nguyên trạng thái.", "D": "Đơn vị công tác được tự ý dịch chuyển dây cảnh báo nếu khu vực làm việc gây cản trở thoát nạn."}, "ans": "B", "chuong": "CHƯƠNG VIII. BIỆN PH"}, {"stem": "Theo Quy trình an toàn, những công việc nào sau đây cho phép làm việc khi thiết bị điện có điện áp trên 01 kV đang mang điện (vẫn có điện) nhưng phải đảm bảo khoảng cách an toàn theo quy định?", "opts": {"A": "Thay, kéo dây đường trục; thay, chuyển cột điện, chuyển điểm đấu nối của lưới điện cao áp.", "B": "Đo dòng điện bằng ampe kìm.", "C": "Tháo rời đầu cáp lực của máy phát điện diesel để mang về phòng thí nghiệm hiệu chuẩn.", "D": "Sửa chữa mạch nhị thứ điều khiển và đóng cắt thử bộ truyền động của dao cách ly."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, đối với công tác có kế hoạch, Người cấp phiếu là ai?", "opts": {"A": "Tổng giám đốc/Phó Tổng giám đốc, Trưởng/Phó đơn vị/tổ/đội, Quản đốc/Phó quản đốc phân xưởng vận hành hoặc người được giao nhiệm vụ.", "B": "Trưởng/Phó đơn vị, Quản đốc/Phó quản đốc phân xưởng vận hành, Kỹ thuật viên, Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính hoặc người được giao nhiệm vụ.", "C": "Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính hoặc người được giao nhiệm vụ.", "D": "Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính."}, "ans": "A", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi giàn giáo cao hơn mấy mét thì phải làm ít nhất 2 sàn công tác (sàn làm việc bên trên, sàn bảo vệ bên dưới)?", "opts": {"A": "Khi giàn giáo cao hơn 4m.", "B": "Khi giàn giáo cao hơn 6m.", "C": "Khi giàn giáo cao hơn 8m.", "D": "Khi giàn giáo cao hơn 10m."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Tại sao các tiêu chuẩn an toàn nghiêm cấm đặt bình chữa cháy khí CO2 ở những nơi có nhiệt độ cao?", "opts": {"A": "Nhiệt độ cao làm lớp sơn màu đỏ bên ngoài vỏ bình dễ bị bong tróc, mất thẩm mỹ.", "B": "Nhiệt độ cao làm bột chữa cháy bên trong bị đóng bánh, đóng cục không phun ra được.", "C": "Khí CO2 tiếp xúc nhiệt độ cao sẽ bị biến đổi hóa học thành khí gas độc hại.", "D": "Khí CO2 có độ giãn nở nhiệt rất lớn; khi gặp nhiệt độ cao, áp suất tăng mạnh làm rách màng của van an toàn gây thoát khí hoặc nổ bình."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về việc xếp vật liệu và tải trọng trên giàn giáo?", "opts": {"A": "Được xếp vật liệu ở những vị trí thuận tiện trên lối đi lại của giàn giáo để dễ lấy.", "B": "Tải trọng đặt trên sàn thao tác được phép vượt quá tải trọng tính toán nếu có gia cố sắt.", "C": "Cấm xếp vật liệu ở những vị trí không quy định như trên lối đi lại của giàn giáo, giá đỡ. Tải trọng đặt trên sàn thao tác không được vượt quá tải trọng tính toán.", "D": "Cho phép người, vật liệu, thiết bị tập trung vào một chỗ vượt quá quy định khi cần cẩu chuyển khẩn cấp."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp nếu công việc có liên quan đến thiết bị của từ 02 Đơn vị QLVH trở lên thì khi khảo sát lập biên bản hiện trường phải làm rõ điều gì?", "opts": {"A": "Đơn vị công tác và các Đơn vị QLVH phải thống nhất, làm rõ trách nhiệm của từng bên.", "B": "Phải làm rõ chi phí nhân công và tiến độ thi công của từng đơn vị.", "C": "Phải làm rõ đơn vị nào chịu trách nhiệm bồi thường nếu xảy ra hư hỏng thiết bị.", "D": "Phải làm rõ bậc an toàn điện của tất cả nhân viên thuộc các đơn vị."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, trường hợp nào cần có Người CG?", "opts": {"A": "Đơn vị công tác làm các công việc căng, kéo dây, lấy độ võng ĐDK.", "B": "Biển báo, rào chắn, căng dây hoặc các biện pháp khác chưa đủ đảm bảo an toàn cho cộng đồng.", "C": "Thao tác tại chỗ, kéo ra/đưa vào vị trí vận hành thiết bị đóng cắt.", "D": "Khi người lao động không sử dụng thiết bị phòng tránh tác động của điện trường."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Khi sử dụng bình bột chữa cháy MFZL/ABC, người vận hành cần lưu ý những đặc điểm gì?", "opts": {"A": "Chữa cháy ngoài trời phải đứng xuôi chiều gió; chỉ dập các đám cháy mới phát sinh diện tích nhỏ.", "B": "Đứng đầu hướng gió, dập đám cháy nhỏ mới phát sinh, tránh phun trực tiếp sục chất lỏng và không ưu tiên phun vào mạch điện tử vi chính xác.", "C": "Hạn chế phun vào bảng điện, tủ rơ-le, mạch điều khiển vi mạch tinh vi do bột có tính ăn mòn hóa học cao.", "D": "Đối với đám cháy chất lỏng phải phun bao phủ bề mặt, tránh phun sục trực tiếp làm chất lỏng bắn ra ngoài."}, "ans": "B", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trước khi thao tác tại chỗ thiết bị đóng cắt trên 01 kV phải kiểm tra nội dung nào?", "opts": {"A": "Kiểm tra thiết bị thử điện chuyên dùng đang hoạt động tốt.", "B": "Kiểm tra máy cắt, aptomat liên quan đang ở vị trí mở.", "C": "Kiểm tra mạch khóa liên động của dao tiếp địa đã được thí nghiệm.", "D": "Kiểm tra khoảng cách từ người thao tác đến phần dẫn điện không nhỏ hơn 03 m."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}], "ĐỀ 04": [{"stem": "Theo Quy trình an toàn, Người CHTT phải đạt tiêu chuẩn về bậc ATĐ tối thiểu như thế nào khi thực hiện LCT đối với công việc về điện?", "opts": {"A": "Có bậc 2 ATĐ trở lên.", "B": "Có bậc 3 ATĐ trở lên.", "C": "Có bậc 4 ATĐ trở lên.", "D": "Không yêu cầu bậc ATĐ."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi tiến hành đo nối đất ĐDK đang vận hành, điều kiện thời tiết bắt buộc phải đáp ứng là gì?", "opts": {"A": "Nhiệt độ môi trường không được vượt quá 40 độ C.", "B": "Trời không có mưa, giông, sét.", "C": "Cấm làm việc khi có gió từ cấp 4 trở lên hoặc sương mù dày.", "D": "Chỉ được tiến hành lúc trời nắng nóng gay gắt."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, khi làm việc gần khu vực có điện từ trên 01 kV đến 22 kV, người thực hiện thao tác đặt rào chắn tạm thời (có khả năng chạm vào phần mang điện) bắt buộc phải đạt bậc an toàn điện tối thiểu từ bậc mấy dưới sự giám sát trực tiếp của người có bậc 5 ATĐ?", "opts": {"A": "Bậc 2 ATĐ.", "B": "Bậc 3 ATĐ.", "C": "Bậc 4 ATĐ.", "D": "Không quy định."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đối với công tác có kế hoạch, Người cấp phiếu là ai?", "opts": {"A": "Trưởng ca/Trưởng kíp/Trực chính hoặc người được giao nhiệm vụ.", "B": "Tổng giám đốc/Phó Tổng giám đốc, Trưởng/Phó đơn vị/đội/tổ, Quản đốc/Phó quản đốc phân xưởng vận hành, Kỹ thuật viên hoặc người được giao nhiệm vụ.", "C": "Người chỉ huy trực tiếp hoặc Người lãnh đạo công việc.", "D": "Người được Đơn vị công tác giao nhiệm vụ trong mọi trường hợp."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, trong quá trình kiểm tra chất lượng kết thúc công tác, trường hợp đã ký/xác nhận điện tử kết thúc công tác mà phát hiện thiếu sót phải sửa chữa lại thì xử lý như thế nào?", "opts": {"A": "Người CHTT phải thực hiện theo đúng quy định về “Cho phép làm việc” như đối với một công việc mới.", "B": "Phải cấp PCT/LCT mới.", "C": "Cho phép Nhân viên công tác trở lại vị trí làm việc để sửa chữa ngay mà không cần thủ tục.", "D": "Người cho phép và Người CHTT phối hợp ghi nhận vào sổ nhật ký vận hành để xử lý sau."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, đối với nhân viên đi kiểm tra hoặc ghi chỉ số đồng hồ điện một mình trong trạm điện, hành vi nào sau đây bị nghiêm cấm?", "opts": {"A": "Nghiêm cấm ghi chép nội dung vào sổ lệnh công tác khi đang ở vùng nguy hiểm.", "B": "Cấm sử dụng bộ đàm liên lạc với nhân viên trực vận hành ca trực của phân xưởng.", "C": "Không được vượt qua rào chắn an toàn điện hoặc tự ý sửa chữa, lắp đặt TBĐ.", "D": "Cấm đi giày vải bảo hộ lao động khi di chuyển dọc theo các hầm, mương cáp."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình An toàn quy định về phương tiện bảo vệ cá nhân đối với các tổ chức, cá nhân khi đến làm việc ở công trình và thiết bị thuộc quyền quản lý của QTP như thế nào?", "opts": {"A": "Người chỉ huy trực tiếp, Nhân viên công tác.", "B": "Người lãnh đạo công việc, Người cảnh giới.", "C": "Người giám sát an toàn, Người giám sát an toàn điện.", "D": "Người cấp phiếu công tác, Người ra lệnh công tác."}, "ans": "D", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, thanh cái và thiết bị điện tại nhà máy, trạm điện cho phép không cần nối đất di động nếu thỏa mãn đồng thời điều kiện cách ly nào?", "opts": {"A": "Đã được tháo rã toàn bộ cáp lực nhất thứ hướng về phía máy biến áp lực.", "B": "Đã được cách ly hoàn toàn, đã khóa thiết bị đóng cắt liên quan để tránh thao tác nhầm.", "C": "Cửa ngăn tủ phân phối liên quan đã được khóa niêm phong bằng chì.", "D": "Đứng tại trung tâm điều khiển nhìn thấy rõ trạng thái mở của dao cách ly."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu đối với việc quản lý chìa khóa trạm điện được quy định như thế nào?", "opts": {"A": "Giao cho trực vận hành trạm quản lý.", "B": "Chìa khoá trạm phải ghi tên rõ ràng và được quản lý theo nội quy riêng. Mỗi khi rời khỏi trạm đều phải khoá và kiểm tra xem cửa đã khoá chặt chưa.", "C": "Treo tại phòng Điều khiển trung tâm để các nhân viên sử dụng khi vào ca.", "D": "Giao cho Trưởng ca để quản lý."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, phải ngừng hoạt động của cầu trục, cần trục khi phát hiện khuyết tật nào ở kết cấu kim loại?", "opts": {"A": "Khi lớp sơn bảo vệ bên ngoài kết cấu kim loại bị bong tróc, rỉ sét nhẹ.", "B": "Khi kết cấu kim loại bị bám dính than, bụi bẩn bốc lên từ hệ thống nghiền.", "C": "Phát hiện những chỗ quan trọng của kết cấu kim loại; Phát hiện biến dạng dư của kết cấu kim loại.", "D": "Phát hiện các vết nứt ở những chỗ quan trọng của kết cấu kim loại; Phát hiện biến dạng dư của kết cấu kim loại."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi làm việc trên những mái nhà trơn, dốc phải thực hiện điều gì?", "opts": {"A": "Phải dùng dây xích pa lăng quàng vào người để neo giữ chắc chắn.", "B": "Làm việc trên những mái nhà trơn, dốc phải có biện pháp an toàn để tránh trượt ngã.", "C": "Phải dùng tay bám chặt vào bề mặt mái nhà và di chuyển thật nhanh.", "D": "Chỉ cần đi giầy bảo hộ lao động bình thường là đủ điều kiện an toàn."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp nào sau đây phải cử Người GSATĐ riêng cho Đơn vị công tác?", "opts": {"A": "Công việc thực hiện theo PCT đối với công việc về điện.", "B": "Đơn vị công tác làm việc ở những nơi đặc biệt nguy hiểm về điện (công việc có mức độ rủi ro từ cấp 4 trở lên theo Danh mục công việc).", "C": "Đơn vị công tác thực hiện công việc sửa chữa hotline và Đơn vị công tác không thuộc Đơn vị QLVH.", "D": "Công việc thực hiện có thể gây nguy hiểm cho cộng đồng."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Khi xảy ra sự cố cháy tại các tủ điện, bảng điện điều khiển, loại bình chữa cháy nào được \"ưu tiên\" sử dụng trước?", "opts": {"A": "Bình chữa cháy khí CO2.", "B": "Bình bột khô hệ MFZL.", "C": "Bình chữa cháy dạng bọt Foam.", "D": "Bình nước áp lực có pha phụ gia."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Loại bình chữa cháy nào được khuyến cáo sử dụng hiệu quả và an toàn nhất cho các đám cháy thiết bị điện, điện tử phòng điều khiển trung tâm (DCS) của nhà máy nhiệt điện?", "opts": {"A": "Bình chữa cháy dạng bọt (Foam).", "B": "Bình chữa cháy bột khô (ABC).", "C": "Bình chữa cháy khí CO2 hoặc khí sạch (FM-200).", "D": "Bình chữa cháy nước áp lực."}, "ans": "C", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, biện pháp an toàn bắt buộc phải thực hiện khi sửa chữa động cơ điện có đặt chung điểm trung tính với hệ thống là gì?", "opts": {"A": "Phải dùng dây nối đất mềm nhiều sợi bọc vỏ nhựa màu vàng để khử tĩnh điện.", "B": "Phải tách điểm trung tính ra khỏi hệ thống.", "C": "Phải treo biển \"Làm việc tại đây\" ngay tại điểm trung tính.", "D": "Phải dùng kìm cách điện để bọc kín đầu dây trung tính."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, trường hợp nào cho phép thực hiện bước Đăng ký công tác theo quy định nội bộ của đơn vị (có thể không cần đăng ký)?", "opts": {"A": "Nếu công việc có mức độ rủi ro đến cấp 3 theo Danh mục công việc.", "B": "Nếu Đơn vị công tác là đơn vị trực thuộc Đơn vị QLVH.", "C": "Nếu công việc thực hiện không gây nguy hiểm cho cộng đồng.", "D": "Nếu lệnh công tác bằng lời nói đã được ghi âm theo trang bị của Đơn vị."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Khi nhận được lệnh huy động tham gia cứu chữa đám cháy tại cơ sở, anh (chị) thực hiện thế nào?", "opts": {"A": "Nhanh chóng tự ý lao vào đám cháy để cứu người theo bản năng.", "B": "Nhanh chóng nhận lệnh, sử dụng phương tiện dụng cụ chữa cháy và thực hiện nghiêm theo chỉ dẫn của lực lượng chuyên nghiệp.", "C": "Tự tìm các dụng cụ chữa cháy xung quanh và phun vào bất kỳ vị trí nào thấy khói.", "D": "Từ chối nhận lệnh nếu vị trí cháy không thuộc phạm vi quản lý của tổ đội mình."}, "ans": "B", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, khi có rào chắn tạm thời, khoảng cách ATĐ từ rào chắn đến phần có điện từ trên 35 đến 110 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "0,60 m", "B": "1,00 m", "C": "1,50 m", "D": "2,00 m"}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đối với Phiếu công tác (PCT) giấy, số lượng bản cần lập và quy định ký lưu giữ của các bên như thế nào?", "opts": {"A": "Lập thành 01 bản duy nhất do Người chỉ huy trực tiếp lưu giữ tại hiện trường.", "B": "Lập thành 03 bản chuyển cho Người cấp phiếu, Người cho phép và Người CHTT mỗi người giữ 01 bản.", "C": "Lập thành 02 bản: Người cấp phiếu ký 02 bản, chuyển đến Người cho phép, Người CHTT mỗi người 01 bản. Người tham gia thực hiện công tác phải ký vào 02 bản, mỗi đơn vị lưu giữ 01 bản theo quy định.", "D": "Lập thành 04 bản chuyển cho Người cấp phiếu, Người cho phép, Người CHTT, Phòng Kỹ thuật và an toàn mỗi người giữ 01 bản."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, đối với tủ máy cắt hợp bộ, sau khi kéo máy cắt ra ngoài để vào làm việc trong khoang ngăn, nhân viên vận hành phải thực hiện biện pháp an toàn bắt buộc nào?", "opts": {"A": "Tách mạch điện nguồn điều khiển và treo biển \"Cấm đóng điện! Có người đang làm việc\".", "B": "Dùng dây thừng vô tận buộc chặt cánh cửa tủ ngăn máy cắt.", "C": "Phải đóng và khóa cánh cửa tủ ngăn máy cắt đó, treo biển “Cấm vào! Điện áp cao nguy hiểm chết người” cả phía trước và phía sau tủ.", "D": "Đặt dây nối đất mềm có tiết diện không bé hơn 10 mm² tại miệng ngăn tủ."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Nghị định 62/2025/NĐ-CP thì thời gian để huấn luyện an toàn điện định kỳ hàng năm ít nhất là bao nhiêu?", "opts": {"A": "Thời gian huấn luyện ít nhất 8 giờ.", "B": "Thời gian huấn luyện ít nhất 12 giờ.", "C": "Thời gian huấn luyện ít nhất 16 giờ.", "D": "Thời gian huấn luyện ít nhất 24 giờ."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Trình bày ý nghĩa hiển thị của các vùng màu Đỏ, Xanh, Vàng trên mặt đồng hồ áp lực bình bột MFZL/ABC?", "opts": {"A": "Vùng Đỏ là bình tốt; vùng Vàng là hết khí đẩy; vùng Xanh là sắp hết khí đẩy.", "B": "Vùng Đỏ là áp lực giảm phải nạp lại; vùng Xanh là áp lực đạt tiêu chuẩn; vùng Vàng là áp lực tăng cao cần kiểm tra theo dõi.", "C": "Vùng Đỏ là tụt áp lực; vùng Xanh là sắp hết khí; vùng Vàng là bình đạt chuẩn.", "D": "Vùng Vàng là hết khí; vùng Xanh là bình tốt; vùng Đỏ là áp lực quá lớn."}, "ans": "B", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Trong quá trình cứu nạn nhân bị điện giật chỉ được phép cho là nạn nhân đã chết trong trường hợp nào?", "opts": {"A": "Tắt thở.", "B": "Bị vỡ sọ hoặc bị cháy toàn thân.", "C": "Mất tri giác.", "D": "Gãy xương."}, "ans": "B", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, các thiết bị chắn điện trường hay Phương tiện bảo vệ cá nhân (PTBVCN) bắt buộc phải sử dụng để phòng tránh ảnh hưởng của điện trường đối với ĐDK và trạm thuộc cấp điện áp nào?", "opts": {"A": "ĐDK và trạm từ 110 kV trở lên có cường độ điện trường lớn hơn 5 kV/m.", "B": "ĐDK và trạm từ 220 kV trở lên có cường độ điện trường lớn hơn 5 kV/m.", "C": "ĐDK và trạm 500 kV có cường độ điện trường lớn hơn 5 kV/m.", "D": "Được phép sử dụng cho mọi cấp điện áp nếu ampe kìm đo có màn hình số."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, trong quá trình làm việc Đơn vị công tác “nghiêm cấm” thực hiện hành vi nào sau đây tại hiện trường?", "opts": {"A": "Thực hiện dừng làm việc và nghỉ giải lao khi thấy mệt mỏi.", "B": "Vượt qua ranh giới vùng làm việc an toàn do Đơn vị QLVH lập và bàn giao cho Đơn vị công tác.", "C": "Yêu cầu Người chỉ huy trực tiếp giải thích về nội dung, trình tự công việc.", "D": "Thực hiện đặt thêm nối đất di động tại vị trí công tác thuộc trách nhiệm của mình."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, biện pháp nào sau đây bắt buộc phải thực hiện ở lối vào, ra của thiết bị điện có điện áp trên 01 kV lắp đặt ngoài trời để ngăn người không có nhiệm vụ?", "opts": {"A": "Biển báo, tín hiệu cảnh báo an toàn điện được đặt ở lối vào, ra.", "B": "Bố trí đèn xoay cảnh báo nguy hiểm kết hợp còi hú tự động.", "C": "Treo các tấm pano áp phích tuyên truyền hành lang bảo vệ an toàn lưới điện.", "D": "Cử nhân viên bảo vệ chuyên trách túc trực liên tục trong suốt ca làm việc."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về giới hạn khối lượng nâng tải của thiết bị nâng?", "opts": {"A": "Cho phép nâng tải vượt quá tải trọng cho phép nếu có người đẩy hoặc kéo tải hỗ trợ.", "B": "Không được phép nâng tải có khối lượng vượt quá tải trọng cho phép của thiết bị.", "C": "Được nâng quá tải trọng thiết kế khi thực hiện chạy thử hoặc cân chỉnh thiết bị quay.", "D": "Khối lượng nâng tải có thể vượt tải trọng cho phép của nhà chế tạo trong trường hợp cứu người khẩn cấp."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp các Đơn vị công tác không cùng một tổ chức hoạt động điện lực thì đơn vị nào phải cử Người LĐCV?", "opts": {"A": "Đơn vị công tác có khối lượng công việc lớn nhất.", "B": "Cấp có thẩm quyền của Đơn vị điều độ phân phối cử.", "C": "Đơn vị QLVH phải cử Người LĐCV.", "D": "Các đơn vị tự thỏa thuận cử người có bậc 4 ATĐ trở lên."}, "ans": "C", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi làm việc với ĐDK điện trên 01 kV, khoảng cách cho phép nhỏ nhất từ người (kể cả thiết bị, dụng cụ khi mang, cầm để làm việc) đến phần có điện từ trên 35 đến 110 kV xoay chiều phải bảo đảm là bao nhiêu?", "opts": {"A": "0,35 m", "B": "0,6 m", "C": "0,7 m", "D": "1,0 m"}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu đối với phần cách điện của ampe kìm khi sử dụng đo ở thiết bị điện trung áp là gì?", "opts": {"A": "Phải được bọc bằng băng dính cách điện màu vàng và không sử dụng đo ampe kìm đo nếu phần cách điện ở phía miệng kìm bị nứt, vỡ.", "B": "Phần cách điện khi sử dụng ampe kìm đo ở TBĐ trung áp phải trong thời hạn kiểm định. Không sử dụng ampe kìm đo nếu phần cách điện ở phía miệng kìm bị nứt, vỡ.", "C": "Phải thực hiện theo PCT.", "D": "Phải thực hiện theo LCT."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, nhân viên vận hành phải sử dụng phương tiện bảo vệ cá nhân chống hồ quang trong trường hợp nào khi thao tác tại chỗ?", "opts": {"A": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 1 kV trở lên.", "B": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 35 kV trở lên.", "C": "Nếu có khả năng xuất hiện hồ quang nguy hiểm cho Nhân viên vận hành khi thao tác tại chỗ.", "D": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 110 kV trở lên."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, những dây đeo an toàn như thế nào mới được phép đưa vào sử dụng tại hiện trường?", "opts": {"A": "ất cả các dây đeo an toàn do Đơn vị công tác tự trang bị mà không cần dán tem.", "B": "Những dây đeo an toàn có đường chỉ bị sờn rách nhẹ nhưng khóa móc chưa bị rỉ.", "C": "Dây đeo an toàn được người lao động tự kiểm tra bằng mắt thấy bình thường.", "D": "Chỉ dây nào đánh dấu (dán tem) chứng nhận thử nghiệm định kỳ còn đạt tiêu chuẩn mới được sử dụng."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, các phương tiện, dụng cụ an toàn chuyên dùng trước khi cấp phát phải được xử lý như thế nào để ghi nhận đạt chất lượng, quy cách?", "opts": {"A": "Phải được Hội đồng bảo hộ lao động của Công ty tự kiểm tra và ký biên bản giao nhận.", "B": "Phải được kiểm định theo quy định của pháp luật hoặc hướng dẫn của nhà chế tạo và phải được ghi nhận hoặc dán tem kiểm định.", "C": "Chỉ cần người lao động trực tiếp sử dụng ký xác nhận vào sổ cấp phát vật tư của phân xưởng.", "D": "Phải được lưu kho tối thiểu 30 ngày để theo dõi độ ổn định của vật liệu trước khi đưa ra sử dụng."}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, trong thời gian đơn vị công tác đang tiến hành làm việc tại hiện trường, hành vi nào sau đây bị nghiêm cấm tuyệt đối?", "opts": {"A": "Thu dọn vệ sinh công nghiệp xung quanh phạm vi ranh giới vùng an toàn.", "B": "Cấm tự ý di chuyển hoặc tháo các rào chắn tạm thời và biển báo, tín hiệu.", "C": "Sử dụng bộ đàm để liên lạc trao đổi thông tin kỹ thuật với điều độ viên.", "D": "Ghi chép nhật ký công tác vào sổ biên bản dưới sự chứng kiến của người giám sát."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, những công việc nào sau đây cho phép làm việc khi thiết bị điện có điện áp trên 01 kV đang mang điện (vẫn có điện) nhưng phải đảm bảo khoảng cách an toàn theo quy định?", "opts": {"A": "Thay, kéo dây đường trục; thay, chuyển cột điện, chuyển điểm đấu nối của lưới điện cao áp.", "B": "Tháo rời đầu cáp lực của máy phát điện diesel để mang về phòng thí nghiệm hiệu chuẩn.", "C": "Sửa chữa mạch nhị thứ điều khiển và đóng cắt thử bộ truyền động của dao cách ly.", "D": "Tiến hành lọc dầu ở những máy biến áp đang vận hành."}, "ans": "D", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, Nhân viên công tác có trách nhiệm như thế nào khi đến nơi làm việc?", "opts": {"A": "Khi đến nơi làm việc, sau khi nghe phổ biến nhiệm vụ công việc, phạm vi được phép làm việc, các yếu tố nguy hiểm cần phòng tránh, có thể hỏi lại Người CHTT về những nội dung chưa rõ.", "B": "Phải có mặt liên tục tại nơi làm việc, giám sát an toàn và có biện pháp để Nhân viên công tác không thực hiện những hành vi có thể gây tai nạn.", "C": "Phải chỉ dẫn những điều có liên quan đến công việc và các yếu tố nguy hiểm tại hiện trường cho Người CHTT.", "D": "Chỉ dẫn nơi làm việc, phạm vi được phép làm việc, những yếu tố nguy hiểm xung quanh."}, "ans": "A", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, vị trí đặt giàn giáo nào sau đây bị nghiêm cấm?", "opts": {"A": "Không bố trí giàn giáo bên dưới ĐDK có điện, không bố trí người làm việc ở các cao độ khác nhau trên một phương thẳng đứng.", "B": "Không bố trí giàn giáo trên một địa hình tương đối vững chắc của công trường.", "C": "Không bố trí giàn giáo cách xa ngọn lửa hoặc các nguồn phát nhiệt từ 10 mét trở lên.", "D": "Không bố trí giàn giáo ở các khu vực có rào chắn tạm thời hoặc dây cảnh báo."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp người làm việc trên cao không tự xuống được thì xử lý như thế nào?", "opts": {"A": "Người làm việc phải sử dụng dây cứu nạn tự đu bám vào kết cấu để xuống.", "B": "Người dưới đất phải dùng phương pháp tung, ném dây cứu hộ lên phía trên.", "C": "Trường hợp người làm việc trên cao không tự xuống được thì Người CHTT phải có phương án trợ giúp.", "D": "Phải lập tức gọi ngay cho lực lượng cảnh sát phòng cháy chữa cháy chuyên nghiệp theo số 114."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trình tự kiểm tra thiết bị thử điện (bút thử điện, còi thử điện) được thực hiện như thế nào trước khi thử ở nơi không còn điện?", "opts": {"A": "Phải kiểm tra ngoại quan xem thiết bị có bị nứt vỡ ranh giới bọc vỏ nhựa không.", "B": "Tiến hành thử trực tiếp ngay tại vị trí nơi làm việc mà không cần kiểm tra trước.", "C": "Phải mang thiết bị về phòng thí nghiệm để hiệu chuẩn lại thông số kỹ thuật.", "D": "Phải kiểm tra thiết bị thử điện ở nơi có điện trước, sau đó mới thử ở nơi không còn điện."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, giàn giáo di động khi đã đưa vào đúng vị trí cần thiết phải có biện pháp kỹ thuật gì?", "opts": {"A": "Phải được neo, giằng chắc chắn vào lan can hoặc mái đua của công trình.", "B": "Giàn giáo di động phải có cơ cấu khóa bánh xe hoặc phải chêm bánh xe khi đã đưa nó vào đúng vị trí cần thiết.", "C": "Phải dùng dây thép buộc néo xoắn thật chặt ở hai đầu và giữa giàn giáo.", "D": "Phải cắt nguồn điện bọc kín bồn chứa xung quanh vị trí đặt giàn giáo."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, người làm việc trên cao chỉ được mang theo người những dụng cụ nhẹ nào đựng trong túi đựng đồ chuyên dùng?", "opts": {"A": "Các dụng cụ, vật liệu nặng chịu lực lớn phục vụ cho việc lắp máy.", "B": "Chỉ được mang theo người những dụng cụ nhẹ như kìm, tuốc-nơ-vít, cờ-lê, mỏ-lết, búa con nhưng phải đựng trong túi đựng đồ chuyên dùng.", "C": "Các thiết bị cầm tay truyền động bằng động cơ như máy khoan, máy mài cắt.", "D": "Các bình chứa dung dịch điện phân, bình axít, nước cất chuyên dùng."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trong trình tự thực hiện thao tác xa, Người giám sát đọc lệnh như thế nào và Người thao tác thực hiện ra sao?", "opts": {"A": "Người giám sát đọc phiếu thao tác, người thao tác kiểm tra trạng thái trên màn hình và bấm nút thực hiện.", "B": "Người giám sát đọc phiếu thao tác bằng bộ đàm, người thao tác ghi vào sổ nhật ký rồi tiến hành thao tác.", "C": "Người giám sát đọc lệnh (tên PTT hoặc tên ĐD, TBĐ cần thao tác), người thao tác nhắc lại lệnh và thực hiện thao tác ĐD, TBĐ trên màn hình HMI/SCADA.", "D": "Người giám sát đọc phiếu thao tác và chỉ tay vào sơ đồ hiển thị, người thao tác kiểm tra mạch khóa liên động rồi bấm nút."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, điều kiện sức khỏe đối với người đang ốm đau hoặc đã sử dụng các chất kích thích, đồ uống có cồn khi làm việc trên cao là gì?", "opts": {"A": "Được phép làm việc nếu thời gian làm việc rất ngắn dưới sự giám sát của Người CHTT.", "B": "Chỉ được phép làm việc trên mặt bằng, sàn thao tác có lan can bảo vệ chắc chắn.", "C": "Không được phép làm việc trên cao.", "D": "Phải báo cho Người CHTT biết để được bố trí người theo dõi, hỗ trợ trực tiếp."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi đặt và tháo nối đất di động tại lưới hạ áp, Nhân viên đơn vị công tác phải sử dụng trang bị gì?", "opts": {"A": "Phải sử dụng găng tay cách điện hạ áp và ủng cách điện hạ áp.", "B": "Phải đeo găng tay cách điện hạ áp.", "C": "Phải đi ủng cách điện hạ áp.", "D": "Không bắt buộc sử dụng trang bị bảo hộ nếu lưới điện đã cắt."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, những công việc nào được trừ ra, không bắt buộc phải thực hiện theo phiếu công tác hoặc lệnh công tác?", "opts": {"A": "Các công việc sửa chữa đột xuất, xử lý sự cố khẩn cấp trên hệ thống.", "B": "Các công việc do đơn vị bên ngoài (nhà thầu) đến thực hiện.", "C": "Các công việc thường xuyên, hàng ngày ở nơi cố định như vận chuyển, bốc dỡ, gia công cơ khí.", "D": "Các công việc thí nghiệm, hiệu chuẩn thiết bị đo lường trong phòng thí nghiệm"}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Trong ký hiệu của bình chữa cháy khí CO2 \"MT5\", các chữ cái M, T và số 5 có ý nghĩa gì?", "opts": {"A": "M là kiểu dáng bình; T là khí chữa cháy; số 5 thể hiện áp lực khí nén đạt 5 Mpa.", "B": "M là kiểu dáng bình; T là khí chữa cháy; số 5 thể hiện trọng lượng toàn bộ bình là 5 kg.", "C": "M là kiểu dáng chung; T thể hiện bình chuyên dùng cho đám cháy chất rắn; số 5 là thời gian phun.", "D": "Chữ M chỉ kiểu dáng bình xách tay; chữ T chỉ loại bình chữa cháy là khí CO2; số 5 chỉ trọng lượng khí CO2 được nạp trong bình là 5 kg."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, khi không có rào chắn tạm thời, khoảng cách ATĐ từ người (kể cả thiết bị, dụng cụ khi mang, cầm làm việc) đến phần có điện từ trên 15 đến 35 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "0,70 m", "B": "1,00 m", "C": "1,50 m", "D": "2,50 m"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị cấm khi đưa dụng cụ, vật liệu lên cao hoặc từ trên cao xuống?", "opts": {"A": "Đặt dụng cụ làm việc vào chỗ chắc chắn hoặc làm móc treo vào vị trí cố định.", "B": "Đưa dụng cụ, vật liệu lên cao hoặc từ trên cao xuống bằng cách tung, ném.", "C": "Dùng dây trực tiếp hoặc qua puly để kéo lên, hạ xuống từ từ.", "D": "Đựng dụng cụ trong túi đựng đồ chuyên dùng mang theo người."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi sử dụng PCT/LCT mẫu tương ứng với công việc đã được đánh giá rủi ro thì phải làm gì?", "opts": {"A": "Phải báo cáo trực tiếp cho Trưởng ca phê duyệt lại.", "B": "Phải kiểm tra sự phù hợp với hiện trường chuẩn bị thực hiện công tác.", "C": "Không cần kiểm tra hiện trường, được tiến hành công việc ngay lập tức.", "D": "Phải tổ chức khảo sát lại hiện trường và lập biên bản mới theo quy định."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "“Ngày toàn dân Phòng cháy và chữa cháy” được quy định là ngày bao nhiêu hàng năm?", "opts": {"A": "Ngày 02 tháng 10.", "B": "Ngày 04 tháng 10.", "C": "Ngày 05 tháng 10.", "D": "Ngày 06 tháng 10."}, "ans": "B", "chuong": "PHẦN 11. PHÒNG CHÁY "}], "ĐỀ 05": [{"stem": "Theo Quy trình an toàn, khi không có rào chắn tạm thời, khoảng cách ATĐ từ người (kể cả thiết bị, dụng cụ khi mang, cầm làm việc) đến phần có điện từ trên 35 đến 110 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "0,70 m", "B": "1,00 m", "C": "1,50 m", "D": "2,50 m"}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, việc khảo sát hiện trường công tác được áp dụng bắt buộc đối với những công việc bao gồm hai yếu tố nào?", "opts": {"A": "Được thực hiện ngoài kế hoạch và có sự tham gia của từ hai đơn vị quản lý vận hành trở lên.", "B": "Được thực hiện theo kế hoạch và hiện trường công tác có yếu tố nguy hiểm, có thể gây tai nạn cho người tham gia thực hiện công việc hoặc cho cộng đồng.", "C": "Công việc sửa chữa lớn, đại tu và công việc xử lý sự cố khẩn cấp trên lưới điện cao áp.", "D": "Công việc làm việc với mạch nhị thứ và công việc làm việc xa nơi có điện."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, hằng ngày Nhân viên công tác trước khi làm việc trên cao phải tự kiểm tra dây đeo an toàn của mình bằng cách nào?", "opts": {"A": "Dùng vật nặng 110kg treo vào dây đeo an toàn xem dây có bị nứt, đứt không.", "B": "Đeo vào người rồi buộc dây vào vật chắc chắn ở dưới đất và chụm chân lại ngả người ra phía sau xem dây có hiện tượng bất thường gì không.", "C": "Thử tải trọng kéo căng dây bằng cơ cấu đóng mở ly hợp ma sát của thiết bị nâng.", "D": "Mang dây đến phòng thí nghiệm hóa chất để kiểm tra đường chỉ và khóa móc."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi làm việc với xe cẩu, cầu trục, cần trục bánh lốp, chỉ được phép chuyển tải qua nhà xưởng hoặc chỗ có người khi nào?", "opts": {"A": "Khi người điều khiển thiết bị đã bật còi hú liên tục cảnh báo trước 15 phút.", "B": "Khi người điều khiển thiết bị đã bật còi hú liên tục cảnh báo trước 10 phút.", "C": "Chỉ được phép chuyển tải qua nhà xưởng hoặc chỗ có người khi đã có biện pháp bảo đảm an toàn (lắp rào chắn, giăng dây cảnh báo).", "D": "Khi khối lượng tải nâng nhỏ hơn 1/3 độ dài quy định của thiết bị mang tải."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trong trường hợp làm việc với đường cáp điện ngầm, đơn vị công tác phải thực hiện biện pháp thích hợp nào để đảm bảo an toàn cho cộng đồng?", "opts": {"A": "Bố trí nhân viên trực gác liên tục 24/24 giờ tại tất cả các vị trí dọc theo tuyến cáp ngầm.", "B": "Ngắt toàn bộ hệ thống chiếu sáng công cộng xung quanh khu vực thi công cáp ngầm.", "C": "Phát tờ rơi cảnh báo đến từng hộ dân cư nằm trong phạm vi ảnh hưởng của công trình.", "D": "Thực hiện các biện pháp nhằm tránh cho người, phương tiện có thể bị rơi xuống hố."}, "ans": "D", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, tốc độ giới hạn của xe nâng hàng khi chạy trên đường thẳng trong kho quy định là bao nhiêu?", "opts": {"A": "Chạy với tốc độ ≤ 10km/h.", "B": "Chạy với tốc độ ≤ 6km/h.", "C": "Chạy với tốc độ ≤ 5km/h.", "D": "Chạy với tốc độ ≤ 15km/h."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi chuyển các dụng cụ hoặc chi tiết bằng kim loại lên cột trong công tác làm việc có điện trên 01 kV, yêu cầu bắt buộc là gì?", "opts": {"A": "Phải đựng dụng cụ trong các túi vải bạt có dây kéo khóa bảo vệ chắc chắn.", "B": "Bảo đảm không vi phạm khoảng cách cho phép nhỏ nhất đối với các phần có điện xung quanh khác.", "C": "Phải thực hiện bọc cách điện toàn bộ bề mặt dụng cụ bằng màng co nhiệt.", "D": "Chỉ được phép chuyển lên bằng dây thừng cách điện khi có lệnh của Người CHTT."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nội dung nào sau đây là trách nhiệm đầu tiên của Đơn vị công tác?", "opts": {"A": "Thống nhất với Đơn vị QLVH có liên quan về tiến độ và tổ chức công tác phù hợp với công việc, điều kiện thực tế của hiện trường công tác. Cử Người CHTT, Nhân viên công tác theo quy định của Quy trình này.", "B": "Phối hợp với các Đơn vị QLVH có liên quan về tiến độ và tổ chức các Đơn vị công tác phù hợp với kế hoạch, điều kiện thực tế của hiện trường sửa chữa.", "C": "Thống nhất với các Đơn vị QLVH có liên quan về tiến độ và tổ chức các Đơn vị công tác phù hợp với công việc, điều kiện thực tế của hiện trường công tác.", "D": "Phối hợp với các Đơn vị điều độ có liên quan về tiến độ và tổ chức các Đơn vị công tác phù hợp với kế hoạch, điều kiện thực tế của hiện trường sửa chữa."}, "ans": "A", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, quá trình chủ động nhằm nhận ra sự tồn tại và tiềm ẩn của một hoặc nhiều mối nguy và xác định những đặc tính của nó được gọi là gì?", "opts": {"A": "Đánh giá rủi ro.", "B": "Khảo sát hiện trường.", "C": "Lập biện pháp an toàn.", "D": "Nhận diện mối nguy."}, "ans": "D", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, chìa khóa khởi động xe nâng hàng quy định ai giữ?", "opts": {"A": "Người lái xe nâng hàng được giữ toàn bộ cả 2 chìa khóa trong suốt ca làm việc.", "B": "Chìa khóa khởi động xe nâng hàng do người chịu trách nhiệm quản lý về sự hoạt động an toàn của xe nâng hàng giữ, chìa thứ hai được bàn giao luân phiên cho người vận hành.", "C": "Chìa khóa khởi động xe nâng hàng do Quản đốc giữ, chìa thứ hai được bàn giao luân phiên cho người vận hành.", "D": "Chìa khóa phải được cắm sẵn trên ổ cắm điện của cabin và cấm rút ra khỏi xe."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, các biện pháp kỹ thuật chuẩn bị nơi làm việc phải cắt điện gồm mấy bước?", "opts": {"A": "03 bước.", "B": "04 bước.", "C": "05 bước.", "D": "06 bước."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, quy định như thế nào về việc căn cứ vào tín hiệu đèn, rơ le, đồng hồ để xác nhận thiết bị điện không còn điện?", "opts": {"A": "Được phép.", "B": "Không được phép.", "C": "Bắt buộc phải căn cứ vào đồng hồ để xác nhận.", "D": "Không có quy định."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đối với đường dây bọc hạ áp hoặc cáp vặn xoắn, vị trí thực hiện đặt nối đất di động được quy định tại các điểm hở nào dưới đây?", "opts": {"A": "Mặt ngoài lớp vỏ bọc cách điện PVC của đường dây dẫn chính.", "B": "Hộp aptomat đầu nguồn, hộp phân dây, ghíp nối, đầu chờ nối đất.", "C": "Thanh cái đồng nhất thứ đặt bên trong phòng máy biến áp lực.", "D": "Tại vị trí mương cáp ngầm đi xuyên qua khu vực dân cư."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, việc chiếu sáng để làm việc trong không gian hạn chế được quy định sử dụng nguồn điện như thế nào?", "opts": {"A": "Sử dụng nguồn điện lưới trực tiếp 220 VAC luồn qua các cửa chui mà không cần ống bảo vệ.", "B": "Chiếu sáng để làm việc trong không gian hạn chế phải dùng đèn pin, đèn ắc quy hoặc đèn điện có cấp điện áp an toàn có máy biến áp cách ly đặt ở bên ngoài, dây dẫn cách điện phải tốt.", "C": "Chỉ dùng đèn thắp sáng có điện áp 110 VDC lấy từ hệ thống tủ nguồn ắc quy axít.", "D": "Không có quy định."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, tại bước kết thúc công tác, Đơn vị công tác phải thực hiện những công việc gì trước khi bàn giao hiện trường, thiết bị cho Đơn vị QLVH?", "opts": {"A": "Thu hồi hết các biện pháp an toàn, khóa PCT/LCT.", "B": "Thực hiện thao tác đưa thiết bị vào vận hành.", "C": "Kiểm tra thiết bị đủ điều kiện đưa trở lại vận hành.", "D": "Rút hết các biện pháp an toàn mà đơn vị tự làm, rút hết người phương tiện ra khỏi hiện trường, bàn giao hiện trường, thiết bị cho Đơn vị QLVH."}, "ans": "D", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, sau khi đóng cắt thử hiệu chỉnh xong, nếu cần tiếp tục công việc ở thiết bị đóng cắt thì ai được phép thực hiện lại các biện pháp an toàn ban đầu?", "opts": {"A": "Nhân viên vận hành thực hiện lại các biện pháp an toàn ban đầu.", "B": "Nhân viên vận hành hoặc Người chỉ huy trực tiếp (khi được nhân viên vận hành đồng ý) thực hiện lại các biện pháp an toàn ban đầu.", "C": "Trưởng ca vận hành đồng ý.", "D": "Người CHTT thực hiện lại các biện pháp an toàn ban đầu."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Các biện pháp kỹ thuật điện nào giúp phòng chống cháy điện hiệu quả tại đơn vị?", "opts": {"A": "Lắp đặt rơ-le chống ngắn mạch và chọn dây dẫn phù hợp với phụ tải.", "B": "Thực hiện mối nối đúng quy định, kiểm tra nhiệt độ mối nối tiếp xúc thường xuyên.", "C": "Cách nhiệt thiết bị đốt nóng bằng điện và cắt nguồn điện hoàn toàn khi không sử dụng.", "D": "Chọn tiết diện dây phù hợp tải, kiểm tra cách điện, lắp rơ-le bảo vệ, nối đất chống sét, thực hiện đúng quy định mối nối và cắt điện khi không dùng."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng đối với các hành vi của người lao động khi làm việc trên giàn giáo?", "opts": {"A": "Được tự ý dỡ lan can, tay vịn nếu thấy cản trở lối di chuyển vật tư.", "B": "Được tự ý di chuyển tấm ván lót sàn giàn giáo cho phù hợp với tầm với.", "C": "Không tự ý dỡ lan can, tay vịn. Không tự ý di chuyển tấm ván lót sàn giàn giáo.", "D": "Leo lên giàn giáo bằng cách đu bám vào các thanh giằng, móc neo kém ổn định."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, tuỳ theo nhiệt độ môi trường bên ngoài phải để lại trong chai chứa khí axetylen một lượng khí có áp suất tối thiểu là bao nhiêu?", "opts": {"A": "2,0 Kgf/cm2 đến 3,0 Kgf/cm2", "B": "2,0 Kgf/cm2 đến 4,0 Kgf/cm2", "C": "2,0 Kgf/cm2 đến 5,0 Kgf/cm2", "D": "2,0 Kgf/cm2 đến 6,0 Kgf/cm2"}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi không có rào chắn tạm thời, khoảng cách ATĐ từ người (kể cả thiết bị, dụng cụ khi mang, cầm làm việc) đến phần có điện 500 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "2,50 m", "B": "4,00 m", "C": "4,50 m", "D": "6,00 m"}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, ai là người quyết định và chịu trách nhiệm về việc cho phép tháo dỡ tạm thời nối đất di động do Đơn vị công tác làm để thực hiện các công việc cần thiết?", "opts": {"A": "Người CHTT quyết định và chịu trách nhiệm về việc cho phép tháo dỡ tạm thời nối đất di động do Đơn vị công tác làm.", "B": "Người cho phép thực hiện PCT.", "C": "Quản đốc, phó Quảng đốc đơn vị công tác.", "D": "Người giám sát an toàn điện."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp nào sau đây phải cử Người GSATĐ riêng cho Đơn vị công tác?", "opts": {"A": "Đơn vị công tác làm các công việc căng, kéo dây, lấy độ võng ĐDK giao chéo ở phía dưới hoặc gần ĐDK đang vận hành.", "B": "Đơn vị công tác và Đơn vị QLVH không cùng một tổ chức hoạt động điện lực.", "C": "Biển báo, rào chắn, căng dây hoặc các biện pháp khác chưa đủ đảm bảo an toàn cho cộng đồng.", "D": "Công việc gần thiết bị điện, có thể vi phạm khoảng cách."}, "ans": "A", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, đối với công tác xử lý sự cố, Người cấp phiếu là ai?", "opts": {"A": "Tổng giám đốc/Phó Tổng giám đốc, Trưởng/Phó đơn vị/tổ/đội, Quản đốc/Phó quản đốc phân xưởng vận hành hoặc người được giao nhiệm vụ.", "B": "Kỹ thuật viên hoặc người được giao nhiệm vụ, Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính.", "C": "Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính hoặc người được giao nhiệm vụ.", "D": "Người được Đơn vị QLVH giao nhiệm vụ giao nhận hiện trường với Đơn vị công tác."}, "ans": "C", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, những nguồn điện nào sau đây khi hoạt động phải tách khỏi lưới điện, vận hành độc lập (kể cả phần trung tính) với phần lưới điện, TBĐ đang có người làm việc?", "opts": {"A": "Hệ thống điện mặt trời mái nhà có chức năng tự động hòa lưới.", "B": "Những máy phát điện diesel hoặc những nguồn điện bằng nguồn năng lượng sơ cấp khác.", "C": "Các máy biến áp đo lường kiểu kín lắp đặt trong trạm phân phối phối.", "D": "Mạch nguồn nhị thứ xoay chiều cấp cho hệ thống chiếu sáng sự cố."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, người lao động luôn phải chú ý lau chùi chất bám dính nào trên bậc thang di động?", "opts": {"A": "Sơn phản xạ nhiệt bám dính sau khi bảo dưỡng đường ống.", "B": "Lớp vữa amiăng, xi măng vôi dùng đắp lớp cách nhiệt.", "C": "Luôn chú ý lau chùi bùn, dầu mỡ bám dính trên bậc thang.", "D": "Chất trung hòa bắn ra từ bình chứa hệ thống ắc quy."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi ra lệnh công tác bằng lời nói, Người cấp lệnh phải thực hiện nội dung nào sau đây?", "opts": {"A": "Phổ biến và giải thích cho Nhân viên công tác về nội dung, trình tự để thực hiện công việc và các biện pháp an toàn.", "B": "Ghi vào sổ LCT họ và tên Người cấp lệnh, Người CHTT, Nhân viên công tác, địa điểm làm việc, nội dung công việc, điều kiện tiến hành công việc, thời gian bắt đầu và kết thúc công việc.", "C": "Chuẩn bị đầy đủ các nội dung LCT, trực tiếp ký và giao LCT cho Người CHTT.", "D": "Ghi thời gian bàn giao hiện trường làm việc, ký tên vào phần Cho phép công tác của PCT."}, "ans": "B", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, mọi công việc sửa chữa, bảo dưỡng trên hệ thống áp lực, nhiệt độ cao chỉ được tiến hành khi nào?", "opts": {"A": "Khi thiết bị đang vận hành bình thường dưới áp lực không quá 0,5 MPa.", "B": "Mọi công việc sửa chữa, bảo dưỡng trên hệ thống nhiệt độ chỉ được tiến hành khi tách hệ thống, thiết bị (đóng van chặn từ các phía đến vị trí cần sửa chữa, bảo đảm kín), kiểm tra nhiệt độ giảm về nhiệt độ môi trường.", "C": "Mọi công việc sửa chữa, bảo dưỡng trên hệ thống áp lực chỉ được tiến hành khi tách hệ thống, thiết bị (đóng van chặn từ các phía đến vị trí cần sửa chữa, bảo đảm kín), mở các van xả áp lực.", "D": "Mọi công việc sửa chữa, bảo dưỡng trên hệ thống áp lực, nhiệt độ cao chỉ được tiến hành khi tách hệ thống, thiết bị (đóng van chặn từ các phía đến vị trí cần sửa chữa, bảo đảm kín), mở các van xả áp lực, kiểm tra nhiệt độ giảm về nhiệt độ môi trường."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, Người cho phép có trách nhiệm gì khi Đơn vị công tác làm xong công việc?", "opts": {"A": "Tiếp nhận báo cáo kết quả, thời gian hoàn thành sau khi thực hiện xong công việc từ Người CHTT.", "B": "Tiếp nhận thiết bị, hiện trường do Người CHTT bàn giao khi Đơn vị công tác làm xong công việc; kiểm tra nội dung công việc, nơi làm việc, viết, ký khóa PCT, giao trả lại PCT cho Người cấp phiếu.", "C": "Ghi vào sổ LCT họ và tên Người cấp lệnh, Người CHTT, Nhân viên công tác, địa điểm làm việc.", "D": "Kiểm tra hoàn thành PCT (thời hạn do Đơn vị quy định)."}, "ans": "B", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, ngoại trừ trường hợp xử lý sự cố khẩn cấp, mọi thao tác xa đều phải có bao nhiêu người phối hợp thực hiện và vai trò như thế nào?", "opts": {"A": "Có ít nhất 03 người: 01 người chỉ huy thao tác, 01 người giám sát và 01 người thao tác trực tiếp.", "B": "Phải có 02 (hai) người phối hợp thực hiện: 01 (một) người giám sát và 01 (một) người thao tác trực tiếp.", "C": "Cho phép 01 người thực hiện nếu thao tác trên màn hình điều khiển HMI/SCADA trung tâm.", "D": "Không quy định."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Về mặt nguyên lý, các phương pháp cơ bản để dập tắt một đám cháy gồm những gì?", "opts": {"A": "Ngăn cách oxy với chất cháy (cách ly), làm loãng nồng độ oxy/chất cháy (làm ngạt) và làm lạnh đám cháy (thu nhiệt).", "B": "Phun nước, phun bọt Foam và dùng chăn ướt trùm lên.", "C": "Cách ly oxy, dùng quạt công suất lớn thổi bạt khói và phun sương.", "D": "Sử dụng cát khô, dùng bình xách tay bóp cò và gọi 114."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, việc tổ chức cho 01 Đơn vị công tác khi làm việc theo 01 PCT (hoặc LCT) thì giám sát trong thời gian làm việc như thế nào để đảm bảo an toàn?", "opts": {"A": "Người CHTT và Người GSAT (nếu có) phải giám sát được tất cả Nhân viên đơn vị công tác trong thời gian làm việc để đảm bảo an toàn.", "B": "Người CHTT và Người GSATĐ (nếu có) phải giám sát được tất cả Nhân viên đơn vị công tác trong thời gian làm việc để đảm bảo an toàn.", "C": "Người CHTT và Người LĐCV (nếu có) phải giám sát được tất cả Nhân viên đơn vị công tác trong thời gian làm việc để đảm bảo an toàn.", "D": "Người CHTT và Người CG (nếu có) phải giám sát được tất cả Nhân viên đơn vị công tác trong thời gian làm việc để đảm bảo an toàn."}, "ans": "A", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, điều kiện thời tiết nào bị nghiêm cấm việc kiểm tra các trạm điện ngoài trời?", "opts": {"A": "Khi trời nắng nóng gay gắt có nhiệt độ môi trường trên 40 độ C.", "B": "Khi có giông sét không được kiểm tra các trạm ngoài trời.", "C": "Khi trời có mưa nhỏ kèm theo sương mù làm hạn chế tầm nhìn trực quan.", "D": "Khi có gió lốc từ cấp 5 trở lên."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, khi đấu dây nối đất vào nối đất của cột hoặc hệ thống nối đất chung thì phương pháp đấu nối quy định như thế nào?", "opts": {"A": "Cho phép vặn xoắn chặt nhiều vòng quanh thân kết cấu kim loại của hệ thống nối đất.", "B": "Phải cạo sạch rỉ chỗ đấu nối đất và phải bắt bằng bu lông, cấm vặn xoắn.", "C": "Phải dùng kẹp nối dây chuyên dùng kết hợp với bọc băng dính cách điện kín mối nối.", "D": "Phải hàn trực tiếp dây nối đất vào điểm nối đất cố định ngoài hiện trường công tác."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, danh mục công việc nào sau đây cho phép thực hiện khi thiết bị điện trên 01 kV vẫn có điện nhưng phải đảm bảo khoảng cách an toàn?", "opts": {"A": "Thao tác thử đóng cắt cơ khí tại chỗ 03 lần để kiểm tra mạch khóa liên động.", "B": "Cắt điện và có biện pháp để tránh đóng nhầm điện trở lại như khoá bộ phận truyền động.", "C": "Vệ sinh cách điện bằng dụng cụ chuyên dùng đã được kiểm tra và thí nghiệm định kỳ theo đúng quy định hiện hành.", "D": "háo rời đầu cáp lực của máy phát điện diesel để mang về phòng thí nghiệm."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị nghiêm cấm trên các thiết bị đang mang áp lực của hệ thống khí nén?", "opts": {"A": "Cấm xiết bu lông hoặc gõ hoặc hàn, treo vật nặng lên các thiết bị đang mang áp lực.", "B": "Mở các van xả đọng và xả khí để xả hết áp lực môi chất thoát ra ngoài.", "C": "Kiểm tra xác định thiết bị không còn áp lực bằng thiết bị cầm tay chuyên dụng.", "D": "Cấm tháo bu lông hoặc gõ hoặc hàn, treo vật nặng lên các thiết bị áp lực."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, yêu cầu kỹ thuật đối với cấu tạo của dao cách ly phía hạ áp dùng để cấp điện phục vụ thí nghiệm điện là gì?", "opts": {"A": "Phải sử dụng dao 2 cực, phần cắt mạch điện phải được trông thấy rõ và ở vị trí cắt phải có đệm lót cách điện đặt ở giữa lưỡi dao và hàm tĩnh.", "B": "Phải sử dụng dao cách ly có cơ cấu khởi động tự động và điều khiển từ xa.", "C": "Cho phép sử dụng dao vặn xoắn chặt nhiều vòng quanh thân kết cấu kim loại.", "D": "Phải là dao cách ly kiểu kín có rơ le bảo vệ hiển thị màu đỏ báo hiệu mang tải."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, cấm làm việc trên cao ngoài trời trong điều kiện thời tiết nào sau đây?", "opts": {"A": "Khi trời mưa nhỏ hoặc có gió nhẹ dưới cấp 3.", "B": "Giông bão có gió từ cấp 5 trở lên hay trời mưa to tạo thành dòng hoặc có giông sét.", "C": "Trời nắng nóng với nhiệt độ từ 35 độ C đến 37 độ C.", "D": "Khi có gió tới cấp 4 trở lên tại các khu vực bạt ngàn không có phương tiện che chắn."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Luật phòng cháy và chữa cháy được áp dụng cho những đối tượng nào sau đây?", "opts": {"A": "Cơ quan, tổ chức, hộ gia đình và cá nhân hoạt động, sinh sống trên lãnh thổ Nước Cộng hòa xã hội chủ nghĩa Việt Nam.", "B": "Cơ quan, tổ chức và cá nhân hoạt động, sinh sống trên lãnh thổ Nước Cộng hòa xã hội chủ nghĩa Việt Nam.", "C": "Cơ quan, tổ chức, hộ gia đình và cá nhân hoạt động, sinh sống trên lãnh thổ nước ngoài.", "D": "Cơ quan, tổ chức và cá nhân nước ngoài không sinh sống tại Việt Nam."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trình tự các bước thực hiện khi THÁO nối đất được quy định cụ thể như thế nào?", "opts": {"A": "Tháo đầu dây nối với đất trước, sau đó tháo đầu dây nối với đường dây, thiết bị điện.", "B": "Tháo đầu dây nối với đất trước, sau đó tháo đầu dây nối với đường dây, thiết bị điện (làm theo trình tự ngược lại với khi đặt nối đất).", "C": "Tiến hành tháo đồng thời cả hai đầu dây nối đất cùng một lúc để đẩy nhanh tiến độ.", "D": "Tháo đầu dây nối với đường dây, thiết bị điện trước, sau đó tháo đầu dây nối với đất (làm theo trình tự ngược lại với khi đặt nối đất)."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp nào sau đây cần có Người LĐCV?", "opts": {"A": "Thí nghiệm ĐD, TBĐ khi có Đơn vị công tác khác thực hiện công việc trên ĐD, TBĐ đó.", "B": "Đơn vị công tác làm các công việc căng, kéo dây, lấy độ võng ĐDK giao chéo.", "C": "Biển báo, rào chắn, căng dây hoặc các biện pháp khác chưa đủ đảm bảo an toàn.", "D": "Thí nghiệm ĐD, TBĐ"}, "ans": "A", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, giữa giàn giáo và thang di động, thiết bị nào được ưu tiên sử dụng hơn?", "opts": {"A": "Ưu tiên sử dụng thang di động hơn sử dụng giàn giáo.", "B": "Ưu tiên sử dụng giàn giáo hơn sử dụng thang.", "C": "Tùy thuộc vào sự phân công của Người CHTT tại hiện trường mà chọn thiết bị.", "D": "Sử dụng đồng thời cả giàn giáo và thang di động trên cùng một phương thẳng đứng."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi nào phải cử một người giữ chân thang di động?", "opts": {"A": "Khi làm việc ngoài trời dưới điều kiện thời tiết tối không đủ ánh sáng.", "B": "Khi chiều dài của thang vượt quá tầm với của Nhân viên công tác.", "C": "Phải cử một người giữ chân thang nếu không có biện pháp chống trượt.", "D": "Khi trèo lên thang cùng một lúc hai người để dịch chuyển vị trí."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp nào bắt buộc phải dừng hệ thống mới được phép tiến hành sửa chữa?", "opts": {"A": "Khi công việc thực hiện trên thiết bị đang vận hành có quy trình riêng và thực hiện theo PCT.", "B": "Trong trường hợp đã cách ly hoàn toàn thiết bị cần sửa chữa mà vẫn không bảo đảm an toàn như rò rỉ môi chất có nhiệt độ cao, áp suất cao hoặc độc hại để tiến hành công việc.", "C": "Khi có nhiều vị trí công tác với nhiều Đơn vị công tác cùng thực hiện và cần phối hợp về an toàn.", "D": "Khi thiết bị tiến hành công việc có ranh giới làm việc ảnh hưởng đến vận hành của các vật mang điện."}, "ans": "B", "chuong": "CHƯƠNG VIII. BIỆN PH"}, {"stem": "Theo Quy trình an toàn, đơn vị nào chịu trách nhiệm thực hiện nối đất di động (tiếp địa ngắn mạch) tạo vùng làm việc an toàn trước khi bàn giao hiện trường?", "opts": {"A": "Đơn vị QLVH tổ chức thực hiện nối đất di động (tiếp địa ngắn mạch) tại tất cả các đầu có nguồn điện đến để tạo vùng làm việc an toàn trước khi bàn giao hiện trường.", "B": "Đơn vị công tác chịu trách nhiệm thực hiện đặt nối đất ngắn mạch di động.", "C": "Đơn vị vận hành tổ chức thực hiện nối đất di động (tiếp địa ngắn mạch) để tạo vùng làm việc an toàn trước khi bàn giao hiện trường.", "D": "Đơn vị QLVH tổ chức thực hiện nối đất di động (tiếp địa ngắn mạch) để tạo vùng làm việc an toàn trước khi bàn giao hiện trường."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu về phạm vi bảo vệ của nối đất đối với Đơn vị công tác tại hiện trường là gì?", "opts": {"A": "Đảm bảo cho toàn bộ khu vực sửa chữa nằm trọn trong vùng bảo vệ của nối đất.", "B": "Đảm bảo cho toàn bộ Nhân viên đơn vị công tác nằm trọn trong vùng bảo vệ của nối đất.", "C": "Phải bao phủ toàn bộ hệ thống đường cáp điện ngầm và mương cáp trong trạm.", "D": "Đảm bảo cho toàn bộ Đơn vị công tác nằm trọn trong vùng bảo vệ của nối đất."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi không có rào chắn tạm thời, khoảng cách ATĐ từ người (kể cả thiết bị, dụng cụ khi mang, cầm làm việc) đến phần có điện 220 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "1,50 m", "B": "2,00 m", "C": "2,50 m", "D": "4,00 m"}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trước khi hạ tải xuống khoang, hầm... bằng cầu trục, cần trục phải thực hiện việc kiểm tra cáp như thế nào?", "opts": {"A": "Phải hạ móc nâng tải từ từ để xem dây cáp có bị xoắn hay thắt nút hay không.", "B": "Phải dùng mỡ bôi trơn bôi đều lên tang và kiểm tra xem xích có bị đứt gẫy móc không.", "C": "Phải hạ móc không tải xuống vị trí thấp nhất để kiểm tra số vòng cáp còn lại trên tang. Nếu số vòng cáp còn lại trên tang lớn hơn 1,0 vòng thì mới được phép nâng, hạ tải.", "D": "Phải hạ móc không tải xuống vị trí thấp nhất để kiểm tra số vòng cáp còn lại trên tang. Nếu số vòng cáp còn lại trên tang lớn hơn 1,5 vòng thì mới được phép nâng, hạ tải."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, giàn giáo khi lắp dựng xong phải thực hiện thủ tục gì trước khi đưa vào sử dụng?", "opts": {"A": "Phải có xác nhận của Nhân viên vận hành đương ca.", "B": "Giàn giáo khi lắp dựng xong phải lập biên bản nghiệm thu.", "C": "Phải được dán tem thử nghiệm định kỳ 6 tháng một lần với tải trọng 110kg.", "D": "Phải được dán tem thử nghiệm định kỳ 12 tháng một lần với tải trọng 110kg."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, sau khi hết ca làm việc, trạng thái của xe nâng hàng yêu cầu điều gì?", "opts": {"A": "Xe nâng hàng phải được đưa về đúng vị trí theo quy định của đơn vị sử dụng và trên xe không còn mang tải.", "B": "Xe nâng hàng được phép để lơ lửng kiện hàng trên càng nâng tại bất kỳ vị trí nào trong kho.", "C": "Phải xả hết dầu DO trong bể chứa của xe.", "D": "Xe nâng hàng phải được đưa về kho theo quy định của đơn vị sử dụng và trên xe không còn mang tải."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời gian Đơn vị QLVH giải quyết đăng ký công tác đối với công tác có kế hoạch là bao lâu?", "opts": {"A": "Chậm nhất 12 giờ sau thời điểm nhận được đăng ký công tác.", "B": "Chậm nhất 24 giờ sau thời điểm nhận được đăng ký công tác.", "C": "Chậm nhất 3 ngày sau thời điểm nhận được đăng ký công tác.", "D": "Thực hiện ngay và không quá 01 giờ sau khi nhận được đăng ký."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}], "ĐỀ 06": [{"stem": "Theo Quy trình an toàn, rào chắn tạm thời khi thiết lập gần phần có điện không được gây ra trở ngại nào dưới đây đối với nhân viên công tác?", "opts": {"A": "Không cản trở người tham gia thực hiện công việc rời khỏi vị trí làm việc khi xảy ra tai nạn, sự cố.", "B": "Không cản trở tầm nhìn hướng về phía phòng điều khiển trung tâm trạm.", "C": "Không gây khó khăn cho việc di chuyển các xe cẩu nâng chuyên dụng.", "D": "Không được làm che khuất các hệ thống đèn chiếu sáng sự cố trong nhà."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đối với PCT giấy, sau khi hoàn thành công việc phải thực hiện lưu giữ trong thời gian ít nhất là bao lâu?", "opts": {"A": "Sau khi hoàn thành công việc, PCT phải lưu giữ ít nhất 01 tháng (kể cả những phiếu đã cấp nhưng không thực hiện).", "B": "Sau khi hoàn thành công việc, PCT phải lưu giữ ít nhất 02 tháng (kể cả những phiếu đã cấp nhưng không thực hiện).", "C": "Sau khi hoàn thành công việc, PCT phải lưu giữ ít nhất 03 tháng (kể cả những phiếu đã cấp nhưng không thực hiện).", "D": "Lưu giữ ít nhất 06 tháng (kể cả những phiếu đã cấp nhưng không thực hiện)."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Khi sử dụng bình chữa cháy khí CO2, khoảng cách an toàn tối thiểu từ loa phun đến đám cháy thiết bị điện hạ thế là bao nhiêu?", "opts": {"A": "Từ 0,5 mét đến 1,5 mét.", "B": "Từ 1,5 mét đến 2 mét.", "C": "Tối thiểu là 5 mét.", "D": "Tối thiểu là 10 mét."}, "ans": "B", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị cấm trong quá trình sử dụng xe cẩu, cầu trục, cần trục bánh lốp?", "opts": {"A": "Người lên, xuống cầu trục, cần trục khi thiết bị đang hoạt động; Nâng tải vùi dưới đất, bị các vật khác đè lên; Cẩu với, kéo lê tải trọng; Để tải treo lơ lửng mà không có người điều khiển.", "B": "Hạ móc không tải xuống vị trí thấp nhất để kiểm tra số vòng cáp còn lại trên tang.", "C": "Hạ tải xuống vị trí đã định và những nơi đã được loại trừ khả năng rơi, đổ hoặc trượt.", "D": "Ngừng hoạt động của cầu trục khi phát hiện phanh của bất kỳ một cơ cấu nào bị hỏng."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, yêu cầu đối với vị trí nối đất (cố định, di động) tại hiện trường là gì?", "opts": {"A": "Vị trí nối đất (cố định, di động) phải được xác nhận trong PCT.", "B": "Vị trí nối đất (cố định, di động) phải được yêu cầu, đánh dấu xác nhận đã được thực hiện trong PCT.", "C": "Phải do Người cấp phiếu trực tiếp đến hiện trường kiểm tra và xác nhận.", "D": "Phải được đặt ở tất cả các pha của mạch nhị thứ và hệ nguồn điều khiển."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi làm việc với ĐDK điện trên 01 kV, khoảng cách cho phép nhỏ nhất từ người (kể cả thiết bị, dụng cụ khi mang, cầm để làm việc) đến phần có điện 500 kV xoay chiều phải bảo đảm là bao nhiêu?", "opts": {"A": "2,5 m", "B": "4,0 m", "C": "4,5 m", "D": "6,0 m"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình An toàn thì định kỳ việc huấn luyện và kiểm tra QTAT cho các đối tượng trong diện phải huấn luyện QTAT được quy định như thế nào?", "opts": {"A": "02 lần/ 1 năm", "B": "01 lần/ 2 năm", "C": "01 lần/ 1 năm", "D": "01 lần/ 3 năm"}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Điền từ vào chỗ trống theo Quy trình an toàn: “Khi làm việc gần TBĐ không bọc cách điện hoặc điểm hở trên lưới điện nếu không đảm bảo khoảng cách an toàn này thì phải sử dụng các ........”", "opts": {"A": "Rào chắn tạm thời bằng vật liệu chắc chắn.", "B": "Thiết bị thử điện chuyên dùng.", "C": "Biện pháp cách điện.", "D": "Phương tiện bảo vệ các nhân phù hợp."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, những công việc làm việc có điện áp trên 01 kV (công tác hotline) bắt buộc phải do đối tượng nào phê duyệt trước khi triển khai?", "opts": {"A": "Người cấp phiếu công tác phê duyệt.", "B": "Thủ trưởng đơn vị phê duyệt.", "C": "Trưởng phòng Kỹ thuật và An toàn của đơn vị quản lý vận hành.", "D": "Người lãnh đạo công việc của đơn vị trực tiếp tiến hành thi công."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, tại chỗ thiết bị đóng cắt của ĐD, TBĐ có bố trí công tác cắt điện, phải treo biển báo gì?", "opts": {"A": "“Dừng lại! Có điện nguy hiểm chết người”", "B": "“Cấm đóng điện! Có người đang làm việc”", "C": "“Cấm thao tác! Có người đang làm việc”", "D": "“Làm việc tại đây”"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi nâng tải bằng pa lăng kéo tay lên vị trí khoảng bao nhiêu cm thì phải dừng lại để kiểm tra an toàn mới được nâng tiếp?", "opts": {"A": "Khi nâng tải trọng lên vị trí khoảng 10cm phải dừng lại để kiểm tra an toàn mới được nâng tiếp.", "B": "Khi nâng tải trọng lên vị trí khoảng 20cm phải dừng lại để kiểm tra an toàn mới được nâng tiếp.", "C": "Khi nâng tải trọng lên vị trí khoảng 30cm phải dừng lại để kiểm tra an toàn mới được nâng tiếp.", "D": "Khi nâng tải trọng lên vị trí khoảng 50cm phải dừng lại để kiểm tra an toàn mới được nâng tiếp."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, chức danh nào sau đây được Đơn vị QLVH giao nhiệm vụ làm Người cho phép?", "opts": {"A": "Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp hoặc người được giao nhiệm vụ.", "B": "Nhân viên vận hành ca trực có chức danh Trưởng ca hoặc người được giao nhiệm vụ.", "C": "Nhân viên vận hành ca trực có chức danh Trưởng ca/Trưởng kíp/Trực chính hoặc người được giao nhiệm vụ.", "D": "Nhân viên vận hành ca trực."}, "ans": "C", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi Nhân viên vận hành tiến hành thao tác tại chỗ TBĐ, thiết bị chữa cháy trong trường hợp khẩn cấp 01 người dưới sự hỗ trợ giám sát từ xa qua camera thì yêu cầu đối với Người giám sát từ xa là gì?", "opts": {"A": "Người giám sát phải ghi âm toàn bộ cuộc gọi và chép đầy đủ nội dung vào sổ phiếu thao tác.", "B": "Người giám sát phải quan sát được toàn bộ thiết bị và người thao tác, giữ liên lạc liên tục với người thao tác trong quá trình thực hiện tại khoản 2 Điều này.", "C": "Người giám sát phải trực tiếp kiểm tra lại khóa chọn chế độ điều khiển trên màn hình SCADA.", "D": "Người giám sát phải đồng thời điều khiển mạch nhị thứ để hỗ trợ khôi phục thiết bị phụ trợ."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu về bậc ATĐ đối với chức danh Người CHTT khi thực hiện công việc không có chuyên môn về điện được quy định như thế nào?", "opts": {"A": "Phải có bậc 3 ATĐ trở lên.", "B": "Phải có bậc 4 ATĐ trở lên.", "C": "Không yêu cầu bậc ATĐ đối với công việc không có chuyên môn về điện.", "D": "Chỉ cần được huấn luyện về an toàn phù hợp với công việc được giao."}, "ans": "C", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, người đăng ký công tác đối với công tác có kế hoạch là ai?", "opts": {"A": "Quản đốc/Phó quản đốc phân xưởng sửa chữa, Trưởng/Phó tổ/đội sửa chữa hoặc người được giao nhiệm vụ.", "B": "Trưởng/Phó đơn vị/tổ/đội, Quản đốc/Phó quản đốc phân xưởng sửa chữa hoặc người được giao nhiệm vụ.", "C": "Tổng giám đốc/Phó Tổng giám đốc, Trưởng/Phó đơn vị/tổ/đội, Quản đốc/Phó quản đốc phân xưởng sửa chữa hoặc người được giao nhiệm vụ.", "D": "Người chỉ huy trực tiếp hoặc Người lãnh đạo công việc của đơn vị thi công."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, quá trình tìm hiểu, xác định những mối nguy hiểm có thể xảy ra liên quan tới công việc chuẩn bị thực hiện và đưa ra biện pháp phòng ngừa hợp lý được gọi là gì?", "opts": {"A": "Nhận diện mối nguy.", "B": "Đánh giá rủi ro.", "C": "Khảo sát hiện trường.", "D": "Lập phương án thi công."}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, trách nhiệm của Người GSATĐ là gì?", "opts": {"A": "Phải luôn có mặt tại nơi làm việc để giám sát an toàn về điện cho nhân viên đơn vị công tác và không được làm thêm nhiệm vụ khác.", "B": "Phải có mặt liên tục tại nơi làm việc, giám sát và có biện pháp để nhân viên đơn vị công tác không thực hiện những hành vi có thể gây tai nạn.", "C": "Thường xuyên kiểm tra, đôn đốc tiến độ thực hiện công việc của Đơn vị công tác.", "D": "Ký/xác nhận điện tử khi nhận, trả hiện trường công tác với Người cho phép."}, "ans": "A", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, dây nối đất phòng tránh nguy hiểm cảm ứng điện từ trường yêu cầu phải sử dụng loại dây gì và tiết diện tối thiểu là bao nhiêu?", "opts": {"A": "Phải là dây nhôm trần đơn sợi có tiết diện không nhỏ hơn 16 mm².", "B": "Dây nối đất phải là dây đồng mềm có tiết diện không bé hơn 10 mm2.", "C": "Phải là dây hợp kim đồng nhiều sợi có tiết diện không bé hơn 35 mm².", "D": "Không quy định tiết diện dây, tùy thuộc vào cường độ điện trường tại hiện trường."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, trong thời gian nghỉ giải lao, Nhân viên công tác ra khỏi vị trí làm việc được quy định như thế nào?", "opts": {"A": "Nhân viên công tác ra khỏi vị trí làm việc không được tự ý trở lại làm việc khi chưa có lệnh của Người CHTT.", "B": "Nhân viên công tác được tự ý trở lại làm việc nếu các biện pháp an toàn vẫn được giữ nguyên.", "C": "Nhân viên công tác phải báo cáo trực tiếp với Người cho phép để được vào lại vị trí làm việc.", "D": "Nhân viên công tác chỉ cần tự kiểm tra và bảo đảm đầy đủ PTBVCN là có thể trở lại làm việc."}, "ans": "A", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, việc xác định ranh giới làm việc của Đơn vị công tác khi thiết lập vùng làm việc an toàn bao gồm những nội dung nào?", "opts": {"A": "Xác định các van cách ly, tủ điều khiển tại chỗ và các vị trí thao tác thiết bị để tránh nhầm lẫn.", "B": "Xác định ranh giới an toàn do đơn vị QLVH thực hiện và ranh giới do Đơn vị công tác tự làm.", "C": "Việc xác định ranh giới làm việc của Đơn vị công tác bao gồm: xác định lối vào/ra; lối trèo lên/xuống và khu vực làm việc.", "D": "Xác định khoảng cách đến các vật mang điện và lối đi lại của người tham gia giao thông xung quanh."}, "ans": "C", "chuong": "CHƯƠNG VIII. BIỆN PH"}, {"stem": "Theo Quy trình an toàn, Đơn vị công tác chịu trách nhiệm thực hiện loại nối đất nào tại nơi làm việc để bảo vệ nhân viên của mình?", "opts": {"A": "Thực hiện nối đất cố định tại các ngăn tủ xuất tuyến phân phối.", "B": "Đơn vị công tác chịu trách nhiệm thực hiện nối đất di động (tiếp địa cảm ứng) tại nơi làm việc sao cho Đơn vị công tác nằm trọn trong vùng bảo vệ của nối đất.", "C": "Đơn vị công tác chịu trách nhiệm thực hiện nối đất ngắn mạch tại tất cả các đầu có nguồn điện dẫn đến vị trí làm việc.", "D": "Đơn vị QLVH tổ chức thực hiện nối đất di động (tiếp địa ngắn mạch) tại tất cả các đầu có nguồn điện đến để tạo vùng làm việc an toàn trước khi bàn giao hiện trường."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nội dung nào sau đây là đúng quy định về kiểm tra đánh giá rủi ro ATVSLĐ trước khi thực hiện công tác?", "opts": {"A": "Đơn vị công tác và Đơn vị QLVH kiểm tra sự phù hợp của đánh giá rủi ro ATVSLĐ đã thực hiện theo Danh mục công việc đối với công tác chuẩn bị thực hiện.", "B": "Người cho phép và Người CHTT kiểm tra sự phù hợp của đánh giá rủi ro ATVSLĐ đã thực hiện theo Danh mục công việc đối với công tác chuẩn bị thực hiện.", "C": "Người cấp phiếu và Người cho phép kiểm tra sự phù hợp của đánh giá rủi ro ATVSLĐ đã thực hiện theo Danh mục công việc đối với công tác chuẩn bị thực hiện.", "D": "Cán bộ an toàn và Người CHTT kiểm tra sự phù hợp của đánh giá rủi ro ATVSLĐ đã thực hiện theo Danh mục công việc đối với công tác chuẩn bị thực hiện."}, "ans": "A", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị NGHIÊM CẤM khi thực hiện kiểm tra chổi than của máy phát điện hoặc máy bù đồng bộ đang chạy?", "opts": {"A": "Phải mang găng cách điện và cài chặt vào cổ tay.", "B": "Phải sử dụng các công cụ bảo vệ mặt và mắt khỏi các tác động cơ khí.", "C": "Cấm dùng tay tiếp xúc đồng thời với hai cực tính khác nhau của máy.", "D": "Cấm xả các chất cách điện của máy ra môi trường xung quanh."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, yêu cầu bảo mật và tính toàn vẹn đối với PCT điện tử quy định nội dung nào sau đây?", "opts": {"A": "Được phép chỉnh sửa nội dung sau khi Người chỉ huy trực tiếp đã ký tiếp nhận hiện trường.", "B": "Không xóa được sau khi đã có chữ ký điện tử của Người cấp phiếu trong thời hạn theo quy định.", "C": "Có thể hủy hoặc hoãn công tác sau khi đã có chữ ký hoặc xác nhận điện tử của Người CHTT.", "D": "Cho phép tự ý thay đổi nội dung hoặc mở rộng phạm vi làm việc trên phần mềm quản lý."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, trường hợp trên đường dây hạ áp không thể thực hiện được biện pháp đặt nối đất theo quy định thì công tác này được xem là loại công tác nào?", "opts": {"A": "Công tác sửa chữa nhỏ lẻ theo Lệnh công tác bằng lời nói.", "B": "Công tác xử lý sự cố khẩn cấp một người theo lệnh điều độ.", "C": "Công tác chuẩn bị hiện trường của đơn vị quản lý vận hành.", "D": "Công tác sửa chữa có điện (Đơn vị công tác phải thực hiện theo quy trình được Cấp có thẩm quyền phê duyệt)."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, Người GSATĐ phải đạt tiêu chuẩn nào?", "opts": {"A": "Có bậc 3 ATĐ trở lên, được Đơn vị công tác hoặc Đơn vị QLVH cử.", "B": "Có bậc 3 ATĐ trở lên, được Đơn vị công tác hoặc Đơn vị QLVH cử để làm nhiệm vụ GSATĐ cho Đơn vị công tác.", "C": "Có bậc 4 ATĐ trở lên, được Đơn vị công tác hoặc Đơn vị QLVH cử để làm nhiệm vụ GSATĐ cho Đơn vị công tác.", "D": "Không yêu cầu bậc ATĐ đối với công việc không có chuyên môn về điện."}, "ans": "C", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi làm việc với ĐDK điện trên 01 kV, khoảng cách cho phép nhỏ nhất từ người (kể cả thiết bị, dụng cụ khi mang, cầm để làm việc) đến phần có điện từ trên 01 đến 35 kV xoay chiều phải bảo đảm là bao nhiêu?", "opts": {"A": "0,35 m", "B": "0,6 m", "C": "0,7 m", "D": "1,0 m"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu bắt buộc nào sau đây phải được dán hoặc ghi rõ ở phía ngoài cửa phòng ắc-quy sử dụng dung dịch điện môi?", "opts": {"A": "Biển cảnh báo \"Dừng lại! Có điện nguy hiểm chết người\".", "B": "Biển chỉ dẫn \"Làm việc tại đây\".", "C": "Cảnh báo “Phòng ắc quy - cấm lửa”.", "D": "Biển cảnh báo “Cấm vào. Điện áp cao nguy hiểm chết người”."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Khi sử dụng bình chữa cháy khí CO2 để dập lửa, người vận hành cần tuân thủ những lưu ý nguy hiểm nào?", "opts": {"A": "Không phun vào than cốc/kim loại nóng chảy (sinh khí CO độc), không phun vào người (gây bỏng lạnh) và hạn chế dùng nơi gió mạnh.", "B": "Tuyệt đối không phun vào đám cháy có than cốc, kim loại nóng chảy vì sẽ sinh ra khí độc CO rất mạnh.", "C": "Tuyệt đối không phun trực tiếp vào cơ thể người vì khí CO2 nhiệt độ âm sâu sẽ gây bỏng lạnh nghiêm trọng.", "D": "Hạn chế phun chữa cháy tại các khu vực ngoài trời có gió thổi mạnh vì khí dễ bị tán lạc, giảm hiệu quả."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Khi phun bình chữa cháy khí CO2 vào đám cháy trong phòng kín, người phun cần đặc biệt lưu ý nguy cơ nguy hiểm nào?", "opts": {"A": "Nguy cơ gây ngạt thở cấp tính do khí CO2 nồng độ cao thay thế hoàn toàn oxy trong phòng.", "B": "Nguy cơ cháy nổ ngược do áp suất phòng tăng.", "C": "Khí CO2 làm tăng nhiệt độ trong phòng lên mức quá cao gây bỏng.", "D": "Khí CO2 sẽ làm hư hỏng vĩnh viễn hệ thống điện xung quanh."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, yêu cầu bảo mật và tính toàn vẹn đối với PCT điện tử quy định nội dung nào sau đây?", "opts": {"A": "Được phép chỉnh sửa nội dung sau khi Người chỉ huy trực tiếp đã ký tiếp nhận hiện trường.", "B": "Không xóa được sau khi đã có chữ ký điện tử của Người cấp phiếu trong thời hạn theo quy định.", "C": "Có thể hủy hoặc hoãn công tác sau khi đã có chữ ký hoặc xác nhận điện tử của Người CHTT.", "D": "Cho phép tự ý thay đổi nội dung hoặc mở rộng phạm vi làm việc trên phần mềm quản lý."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, vì sao cấm dùng thang kim loại để làm việc gần đường dây (ĐD) hoặc các nguồn điện?", "opts": {"A": "Để tránh làm cho thang bị oằn, cong khi làm việc trên đó.", "B": "Để tránh bị điện giật.", "C": "Để bảo đảm khoảng cách an toàn hành lang thiết bị không bị va chạm cơ học.", "D": "Để không gây ảnh hưởng đến hệ thống tự động điều khiển của tổ máy."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, quy định như thế nào về việc cấp Phiếu công tác (PCT) theo công việc?", "opts": {"A": "Mỗi PCT chỉ được cấp cho 01 Đơn vị công tác cho 01 công việc.", "B": "Mỗi PCT có thể cấp cho nhiều Đơn vị công tác cùng thực hiện một công việc.", "C": "Mỗi PCT được cấp cho nhiều vị trí công tác với nhiều Đơn vị công tác thực hiện.", "D": "Mỗi PCT được phép mở rộng phạm vi làm việc khi có sự đồng ý của Người cấp phiếu."}, "ans": "A", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, Người tham gia thực hiện công tác phải được huấn luyện, kiểm tra nội dung phù hợp với công việc được giao định kỳ bao lâu một lần?", "opts": {"A": "Ít nhất 01 lần trong 02 năm.", "B": "Ít nhất 02 lần trong 01 năm.", "C": "Ít nhất 01 lần trong 03 năm.", "D": "Ít nhất 01 lần trong 01 năm."}, "ans": "D", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, các nhân viên làm việc, kiểm tra trong trạm phải chú ý những thiết bị điện nào và quy định hành vi đối với các thiết bị đó ra sao?", "opts": {"A": "Chú ý những TBĐ đang vận hành bị mất điện, hoặc đã cắt điện nhưng chưa nối đất, hoặc TBĐ dự phòng đặt trong trạm có thể được khôi phục lại điện bất cứ lúc nào; cấm làm việc ở các TBĐ đó.", "B": "Chú ý các thiết bị đóng cắt kiểu kín có rơ le bảo vệ hiển thị màu đỏ báo hiệu đang mang tải lớn.", "C": "Chú ý hệ thống ắc-quy nguồn điều khiển mạch nhị thứ; cấm tự ý lau chùi, vệ sinh thiết bị.", "D": "Chú ý các điểm tiếp xúc đấu lèo dây dẫn ngoài trời; cấm dùng sào thao tác để kiểm tra độ rung."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Câu 39: Theo Quy trình an toàn, khi thực hiện bước thao tác theo lệnh trong thao tác giám sát từ xa, người giám sát và người thao tác phối hợp như thế nào sau khi đã khẳng định đúng thiết bị?", "opts": {"A": "Người giám sát phát lệnh bằng lời nói, người thao tác tiến hành thao tác.", "B": "Người thao tác trực tiếp báo cáo mã số thiết bị, người giám sát bấm nút kích hoạt trên màn hình.", "C": "Khi đã khẳng định thiết bị phải thao tác là đúng, người giám sát đọc lệnh, người thao tác trực tiếp nhắc lại lệnh và thực hiện bước thao tác theo lệnh.", "D": "Hai bên cùng lúc kích hoạt hệ thống điều khiển tại chỗ và điều khiển từ xa để đồng bộ."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp nối đất cột bị hỏng, khó bắt bu lông thì phải xử lý biện pháp nối đất như thế nào?", "opts": {"A": "Phải thực hiện biện pháp nối đất khác đảm bảo yêu cầu kỹ thuật (chọn điểm nối đất khác hoặc sử dụng cọc nối đất).", "B": "Cho phép tạm thời tháo gỡ dây nối đất của cột đó và tiếp tục tiến hành các công việc.", "C": "Tiếp tục thực hiện công việc nếu chứng minh không có điện cảm ứng.", "D": "Cho phép chập cả 3 pha với dây trung tính."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp ra lệnh bằng lời nói và chưa trang bị phần mềm quản lý LCT, trước khi ra LCT, Người ra lệnh phải ghi vào sổ LCT những nội dung gì?", "opts": {"A": "Chỉ cần ghi Người ra lệnh, họ tên của Người CHTT và địa điểm làm việc.", "B": "Người ra lệnh, họ tên của Người CHTT (hoặc Người thi hành lệnh), Người GSATĐ (nếu có), nhân viên của Đơn vị công tác, địa điểm làm việc, nội dung công tác, điều kiện tiến hành công việc, thời gian bắt đầu và kết thúc công việc, đồng thời dành một mục để ghi việc kết thúc công việc.", "C": "Tên các thiết bị đã được cắt điện, những phần thiết bị còn điện và các biện pháp chú ý.", "D": "Ghi đầy đủ các nội dung theo mẫu quy định và ký/xác nhận điện tử cấp lệnh công tác."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, điều kiện để Đơn vị công tác di chuyển vị trí làm việc trong cùng một PCT quy định nội dung nào sau đây?", "opts": {"A": "Người CHTT và toàn bộ nhân viên đơn vị công tác chỉ được phép làm việc ở một vị trí xác định tại một thời điểm.", "B": "Việc di chuyển nơi làm việc do nhân viên vận hành cho phép.", "C": "Khi di chuyển vị trí làm việc phải ghi vào PCT, Người CHTT và Người cho phép cùng ký/ xác nhận vào mục 5 của PCT.", "D": "Tất cả các đáp án."}, "ans": "D", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, đơn vị quản lý vận hành phải làm gì để đơn vị công tác xác định được ranh giới vùng làm việc an toàn tại hiện trường?", "opts": {"A": "Vẽ các đường kẻ vạch vôi màu trắng trực ti
