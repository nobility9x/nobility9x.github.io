ếp dưới nền nhà trạm.", "B": "Phổ biến chi tiết tọa độ vùng làm việc trên bản vẽ sơ đồ mặt bằng giấy.", "C": "Cử một nhân viên vận hành đứng chỉ tay hướng dẫn liên tục tại ranh giới.", "D": "Lập rào chắn tạm thời hoặc áp dụng biện pháp phù hợp để đơn vị công tác xác định được ranh giới vùng làm việc an toàn bằng trực quan."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp nào Đơn vị công tác và Đơn vị QLVH phải trao đổi để thống nhất biện pháp an toàn trước khi thực hiện công tác?", "opts": {"A": "Khi thực hiện công việc có mức rủi ro từ cấp 3 trở lên theo Danh mục công việc.", "B": "Trước thời điểm Đơn vị công tác bắt đầu công việc ngày tiếp theo ít nhất 30 phút.", "C": "Nếu có yêu cầu từ Đơn vị công tác hoặc Đơn vị QLVH.", "D": "Khi có sự thay đổi Người CHTT hoặc Nhân viên công tác."}, "ans": "C", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, đơn vị nào có trách nhiệm chủ trì tổ chức khảo sát, lập biên bản hiện trường?", "opts": {"A": "Đơn vị quản lý vận hành phải chủ trì và phối hợp với Đơn vị công tác.", "B": "Đơn vị công tác phải chủ trì và phối hợp với Đơn vị QLVH để tổ chức khảo sát, lập biên bản hiện trường với sự tham gia đầy đủ của các Đơn vị có liên quan.", "C": "Đơn vị điều độ phân phối phải chủ trì tổ chức khảo sát hiện trường.", "D": "Phòng Kỹ thuật và An toàn của Công ty chịu trách nhiệm chủ trì khảo sát."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, nhân viên vận hành phải sử dụng phương tiện bảo vệ cá nhân chống hồ quang trong trường hợp nào khi thao tác tại chỗ?", "opts": {"A": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 1 kV trở lên.", "B": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 35 kV trở lên.", "C": "Nếu có khả năng xuất hiện hồ quang nguy hiểm cho Nhân viên vận hành khi thao tác tại chỗ.", "D": "Khi thao tác thiết bị đóng cắt trên cột với cấp điện áp từ 110 kV trở lên."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi đo dòng điện bằng ampe kìm ở thiết bị điện trung áp, người đo phải sử dụng các trang bị an toàn nào?", "opts": {"A": "Người đo phải sử dụng găng tay cách điện, ủng cách điện hoặc ghế cách điện tương ứng với cấp điện áp của TBĐ, vị trí đo phải thuận tiện.", "B": "Phải sử dụng sào cách điện chuyên dùng bọc nhựa PVC cứng kết hợp với đi giày vải bảo hộ.", "C": "Phải mang phương tiện bảo vệ cá nhân chống hồ quang và đứng cách xa thiết bị tối thiểu 3 m.", "D": "Người đo phải sử dụng găng tay cách điện tương ứng với cấp điện áp của TBĐ, vị trí đo phải thuận tiện."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, người lao động mới tuyển dụng phải trải qua những bước kiểm tra nào sau khi được đào tạo, huấn luyện, kèm cặp để đạt yêu cầu mới được giao nhiệm vụ?", "opts": {"A": "Chỉ cần kiểm tra bằng hình thức thực hành tại công trường.", "B": "Chỉ cần làm bài kiểm tra lý thuyết trắc nghiệm trên máy tính.", "C": "Được kiểm tra bằng cả hai hình thức lý thuyết và thực hành.", "D": "Do Quản đốc phân xưởng trực tiếp phỏng vấn vấn đáp."}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, quy định đối với người ở trên sàn thao tác của xe nâng người khi đang ở vị trí nâng là gì?", "opts": {"A": "Được phép rời khỏi sàn thao tác trèo qua lan can an toàn nếu đeo dây an toàn đầy đủ.", "B": "Không được phép rời khỏi sàn thao tác, tuân thủ quy định làm việc trên cao khi đang ở vị trí nâng.", "C": "Được dùng tay đẩy hoặc kéo tải trọng bám vào các đường ống bên cạnh.", "D": "Có thể sử dụng điện thoại di động để liên lạc giữ liên tục với người bên ngoài."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, các phương tiện, dụng cụ an toàn chuyên dùng trong trường hợp không có quy định pháp luật thì phải được thực hiện kiểm định theo hướng dẫn của ai?", "opts": {"A": "Nhà chế tạo.", "B": "Phòng Kỹ thuật và An toàn của Công ty.", "C": "Sở Công Thương tỉnh Quảng Ninh.", "D": "Đơn vị quản lý vận hành trực tiếp."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, công việc tiến hành trong không gian hạn chế (như bình, bồn, bể kín, hầm sâu, buồng xoắn...) bắt buộc phải kiểm soát bằng hình thức nào?", "opts": {"A": "Công việc tiến hành trong không gian hạn chế như bình, bồn, bể kín, bể ngầm, hầm sâu, buồng xoắn, bao hơi, máy nghiền than, bình ngưng, bình gia nhiệt, bình khử khí, lò hơi, lọc bụi, khử SOx/NOx phải theo PCT.", "B": "Công việc tiến hành trong không gian hạn chế như bình, bồn, bể kín, bể ngầm, hầm sâu, buồng xoắn, bao hơi, máy nghiền than, bình ngưng, bình gia nhiệt, bình khử khí, lò hơi, lọc bụi, khử SOx/NOx phải theo LCT.", "C": "Công việc tiến hành trong không gian hạn chế như bình, bồn, bể kín, bể ngầm, hầm sâu, buồng xoắn, bao hơi, máy nghiền than, bình ngưng, bình gia nhiệt, bình khử khí, lò hơi, lọc bụi, khử SOx/NOx phải lập PTT.", "D": "Không có quy định."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trường hợp nào các bên có thể không khảo sát hiện trường và sử dụng kết quả đánh giá rủi ro?", "opts": {"A": "Trường hợp công việc đã được khảo sát hiện trường đánh giá rủi ro từ trước, hiện trường không thay đổi, các yếu tố nguy hiểm của khu vực cần làm việc đã được Đơn vị công tác và Đơn vị QLVH đều biết rõ.", "B": "Khi công việc được thực hiện ngoài kế hoạch hoặc trường hợp xử lý sự cố khẩn cấp.", "C": "Khi công việc được thực hiện trên đường dây hoặc thiết bị điện hạ áp dưới 1 kV.", "D": "Khi có sự đồng ý bằng văn bản điện tử của Người ra lệnh hoặc Người cấp phiếu."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi lên xuống thang di động, người lao động phải thực hiện động tác nào?", "opts": {"A": "Quay lưng vào thang, khi leo phải nắm hai tay vào các bậc lên xuống.", "B": "Khi lên xuống thang phải quay mặt vào thang, khi leo phải nắm hai tay vào thanh dọc, tuyệt đối không nắm vào các bậc lên xuống. Không đứng dựa lưng vào thang.", "C": "Đứng ở ba bậc trên cùng của thang và dùng một tay để vịnh vào kết cấu tựa.", "D": "Vừa leo thang vừa dịch chuyển thang từ vị trí này sang vị trí khác."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}], "ĐỀ 07": [{"stem": "Sau khi đã sử dụng bình chữa cháy (dù chỉ phun ra một lượng nhỏ), quy trình quản lý yêu cầu xử lý bình đó như thế nào?", "opts": {"A": "Cắm lại chốt an toàn thật chặt và đặt lại vị trí cũ để tiết kiệm cho lần sau.", "B": "Tiến hành vứt bỏ toàn bộ vỏ bình vào thùng chứa rác thải công nghiệp nguy hại.", "C": "Không cắm lại chốt an toàn nhưng vẫn đặt lại vị trí cũ để làm ký hiệu đã dùng.", "D": "Ghi nhãn \"Bình đã qua sử dụng\", di dời khỏi vị trí sẵn sàng và bàn giao cho bộ phận chức năng mang đi nạp sạc lại."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, đối với thiết bị điện kiểu kín hoặc tủ hợp bộ, hệ thống GIS tại nhà máy điện, trạm điện, cho phép kiểm tra không còn điện thông qua hình thức nào?", "opts": {"A": "Căn cứ vào trạng thái khóa chọn chế độ điều khiển đã chuyển về vị trí tại chỗ (Local).", "B": "Cho phép kiểm tra không còn điện thông qua chỉ thị tại chỗ thiết bị đóng cắt (3 pha, tất cả các phía) và thông số điện áp (nếu có).", "C": "Cho phép kiểm tra không còn điện thông qua chỉ thị tại chỗ thiết bị đóng cắt (3 pha, tất cả các phía) và thông số dòng điện (nếu có).", "D": "Cho phép kiểm tra không còn điện thông qua chỉ thị tại chỗ của máy cắt (3 pha, tất cả các phía) và thông số điện áp (nếu có)."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi công tác trên chuỗi sứ của ĐDK đã cắt điện, người làm việc được phép di chuyển dọc chuỗi sứ khi nào?", "opts": {"A": "Khi chuỗi sứ đã được bọc một lớp vỏ nhựa cách điện kín.", "B": "Khi có sự giám sát trực tiếp của người có bậc 5 an toàn điện và không cần mang găng tay.", "C": "Sau khi đã xem xét kỹ chuỗi sứ không có vết nứt ở đầu sứ/phụ kiện, các móc nối/khóa/chốt còn tốt; và phải sử dụng dây an toàn phụ cài chặt vào xà hoặc đầu cột.", "D": "Khi đã tháo dây nối đất ở hai phía cột của ĐDK giao chéo."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, sau khi thay thế, sửa chữa các bộ phận, chi tiết quan trọng như kết cấu kim loại, cáp, móc, phanh... của cần trục phải làm gì trước khi đưa vào sử dụng?", "opts": {"A": "Phải lập biên bản nghiệm thu xe cẩu, cầu trục, cần trục trước khi đưa vào sử dụng.", "B": "Phải tiến hành thử tải xe cẩu, cầu trục, cần trục trước khi đưa vào sử dụng.", "C": "Phải thông báo bằng lời nói cho Người cấp lệnh ghi nhận vào sổ nhật ký vận hành.", "D": "Phải ghi rõ xe cẩu, cầu trục, cần trục trước khi đưa vào sử dụng."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời gian Đơn vị QLVH giải quyết đăng ký công tác đối với trường hợp xử lý sự cố quy định như thế nào?", "opts": {"A": "Chậm nhất 12 giờ sau thời điểm nhận được đăng ký từ Đơn vị công tác.", "B": "Thực hiện ngay và không quá 01 giờ sau khi nhận được đăng ký từ Đơn vị công tác.", "C": "Thực hiện trong vòng 24 giờ kể từ khi nhận được thông báo bằng lời nói.", "D": "Tùy thuộc vào mức độ hư hỏng của thiết bị để quyết định thời gian giải quyết."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, thời gian Đơn vị QLVH giải quyết đăng ký công tác đối với công tác ngoài kế hoạch là bao lâu?", "opts": {"A": "Chậm nhất 12 giờ sau thời điểm nhận được đăng ký công tác.", "B": "Chậm nhất 24 giờ sau thời điểm nhận được đăng ký công tác.", "C": "Chậm nhất 48 giờ sau thời điểm nhận được đăng ký công tác.", "D": "Chậm nhất 03 ngày sau thời điểm nhận được đăng ký công tác."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, trong quá trình vận hành xe nâng hàng, tại những vị trí mà người lái không thể quan sát thấy thì phải xử lý như thế nào?", "opts": {"A": "Người lái xe phải dừng xe lại, tự xuống xe kiểm tra ranh giới làm việc rồi mới chạy tiếp.", "B": "Phải bố trí thêm 01 người bên ngoài để đưa ra các cảnh báo kịp thời cho người điều khiển xe nâng biết.", "C": "Phải bố trí thêm 02 người bên ngoài để đưa ra các cảnh báo kịp thời cho người điều khiển xe nâng biết.", "D": "Không có quy định."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Phương pháp thực hành cấp cứu hồi sinh tổng hợp gồm mấy bước?", "opts": {"A": "2 bước", "B": "4 bước", "C": "5 bước", "D": "3 bước"}, "ans": "C", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, thời gian đăng ký công tác đối với trường hợp xử lý sự cố quy định như thế nào?", "opts": {"A": "Ngay sau khi nhận được thông báo từ Đơn vị QLVH.", "B": "Chậm nhất 01 giờ sau khi sự cố thiết bị xảy ra tại hiện trường.", "C": "Muộn nhất 12 giờ trước khi tiến hành cô lập thiết bị sự cố.", "D": "Sau khi đã hoàn thành việc tháo dỡ và khắc phục xong thiết bị."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, sau khi hoàn thành công việc, Phiếu công tác (PCT) phải được lưu giữ trong thời gian ít nhất là bao lâu?", "opts": {"A": "Ít nhất 01 tháng.", "B": "Ít nhất 03 tháng.", "C": "Ít nhất 06 tháng.", "D": "Ít nhất 12 tháng."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, cấm làm việc đồng thời trên giàn giáo trong trường hợp nào?", "opts": {"A": "Cấm làm việc đồng thời trên hai tầng sàn cùng một khoang mà không có biện pháp bảo đảm an toàn.", "B": "Cấm làm việc đồng thời trên sàn công tác bên trên và sàn bảo vệ bên dưới khi có lưới bảo vệ.", "C": "Cấm làm việc đồng thời khi giàn giáo có chiều cao tổng thể nhỏ hơn 6m.", "D": "Cấm làm việc đồng thời giữa Đơn vị công tác và Đơn vị QLVH khi có sự phối hợp an toàn chung."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, vị trí móc dây đeo an toàn khi làm việc trên cao được quy định như thế nào?", "opts": {"A": "Dây đeo an toàn phải móc vào vị trí chắc chắn ngay phía trên vị trí làm việc sao cho chiều cao rơi là nhỏ nhất (để giảm động năng rơi).", "B": "Dây đeo an toàn phải móc vào thang di động hoặc các bộ phận kết cấu kém ổn định như lan can.", "C": "Dây đeo an toàn phải móc vào sườn ta luy phía trong của bờ kênh.", "D": "Dây đeo an toàn phải móc trực tiếp vào các gối đỡ hoặc thiết bị đang vận hành."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, giàn giáo khi lắp dựng xong phải thực hiện thủ tục gì trước khi đưa vào sử dụng?", "opts": {"A": "Phải có xác nhận của Nhân viên vận hành đương ca.", "B": "Giàn giáo khi lắp dựng xong phải lập biên bản nghiệm thu.", "C": "Phải được dán tem thử nghiệm định kỳ 6 tháng một lần với tải trọng 110kg.", "D": "Phải được dán tem thử nghiệm định kỳ 12 tháng một lần với tải trọng 110kg."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời gian đăng ký công tác đối với công tác có kế hoạch quy định như thế nào?", "opts": {"A": "Muộn nhất 24 giờ trước thời điểm bắt đầu thực hiện công tác.", "B": "Muộn nhất 03 ngày trước thời điểm bắt đầu thực hiện công tác.", "C": "Muộn nhất 07 ngày trước thời điểm bắt đầu thực hiện công tác.", "D": "Chậm nhất 12 giờ sau thời điểm nhận được kế hoạch của Công ty."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi làm việc với thiết bị nâng phải tuân thủ quy định cốt lõi nào?", "opts": {"A": "Tuân thủ quy trình riêng do thợ lặn chuyên nghiệp lập và phê duyệt.", "B": "Khi làm việc với thiết bị nâng phải tuân thủ QCVN về an toàn lao động tương ứng với thiết bị làm việc.", "C": "Khi làm việc với thiết bị nâng phải tuân thủ QCVN về an toàn điện tương ứng với thiết bị làm việc.", "D": "Tuân thủ các quy tắc thao tác thiết bị điện cầm tay truyền động bằng động cơ đốt trong."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, những công việc nào sau đây cho phép làm việc khi thiết bị điện có điện áp trên 01 kV đang mang điện (vẫn có điện) nhưng phải đảm bảo khoảng cách an toàn theo quy định?", "opts": {"A": "Lấy mẫu dầu máy biến áp (chú ý kiểm tra nối đất vỏ máy trước).", "B": "Thay, kéo dây đường trục; thay, chuyển cột điện, chuyển điểm đấu nối của lưới điện cao áp.", "C": "Tháo rời đầu cáp lực của máy phát điện diesel để mang về phòng thí nghiệm hiệu chuẩn.", "D": "Sửa chữa mạch nhị thứ điều khiển và đóng cắt thử bộ truyền động của dao cách ly."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, yêu cầu về thủ tục hành chính đối với những công việc được phép không cần nối đất di động sau khi cắt điện là gì?", "opts": {"A": "Phải được Người chỉ huy trực tiếp phổ biến bằng lời nói tại hiện trường.", "B": "Phải có biên bản nghiệm thu kỹ thuật của phòng an toàn đơn vị.", "C": "Cho phép không cần nối đất di động được ghi rõ trong PCT/LCT.", "D": "Được ký phê duyệt trực tiếp trên sơ đồ vận hành của nhân viên trực ban."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị NGHIÊM CẤM khi làm việc với tụ điện cao áp đang vận hành?", "opts": {"A": "Cấm dùng dao cách ly để đóng, cắt các tụ điện cao áp khi tụ điện đang vận hành.", "B": "Cấm dùng điện trở hạn chế khi phóng điện tích dư của tụ điện.", "C": "Cấm phóng điện tích dư trực tiếp xuống đất sau khi qua điện trở hạn chế.", "D": "Cấm đặt tụ điện ở những nơi có không gian nhỏ, khó thực hiện."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, những công việc nào thuộc danh mục thực hiện theo LCT?", "opts": {"A": "Làm việc với ĐD/TBĐ hạ áp: Đại tu, sửa chữa lớn; thay, kéo dây đường trục.", "B": "Làm việc ở xa nơi có điện (không vi phạm khoảng cách ATĐ theo Điều 37, Điều 38 Quy trình này).", "C": "Làm việc với ĐD/TBĐ trên 01 kV khi gần phần có điện và vi phạm khoảng cách an toàn.", "D": "Công việc thay, chuyển cột điện hoặc chuyển điểm đấu nối của lưới hạ áp."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi làm việc với nồi hơi, thiết bị áp lực phải tuân thủ quy chuẩn nào?", "opts": {"A": "Khi làm việc với nồi hơi, thiết bị áp lực phải tuân thủ QCVN về an toàn trong sản xuất.", "B": "Khi làm việc với nồi hơi, thiết bị áp lực phải tuân thủ QCVN về an toàn lao động nồi hơi và bình chịu áp lực.", "C": "Tuân thủ tiêu chuẩn kỹ thuật quốc gia về an toàn thi công xây dựng công trình trên nước.", "D": "Tuân thủ quy trình vận hành hệ thống máy phát điện."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, trách nhiệm của Đơn vị QLVH đối với công tác kiểm tra là gì?", "opts": {"A": "Kiểm tra việc thao tác cách ly thiết bị ra khỏi vận hành và kiểm tra đầy đủ, đúng các biện pháp an toàn.", "B": "Kiểm tra sự tuân thủ quy định an toàn của Đơn vị công tác.", "C": "Kiểm tra hoàn thành PCT (thời hạn do Đơn vị quy định).", "D": "Kiểm tra thời hạn thử nghiệm cho phép sử dụng của máy, thiết bị, vật tư."}, "ans": "B", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị nghiêm cấm đối với các trang bị về công nghệ, thiết bị, kỹ thuật an toàn, vệ sinh lao động?", "opts": {"A": "Vận hành liên tục quá 8 tiếng trong một ca trực.", "B": "Thực hiện công việc khi các trang bị này bị hư hỏng và không bảo đảm điều kiện an toàn.", "C": "Tự ý lau chùi, bảo dưỡng thiết bị khi không có thợ chuyên môn.", "D": "Sử dụng thiết bị vượt quá thời hạn nhà sản xuất khuyến cáo nhưng đã được kiểm định lại."}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, hình thức cấp LCT bằng lời nói yêu cầu phải thực hiện biện pháp quản lý nào?", "opts": {"A": "Lệnh bằng lời nói phải được ghi vào sổ hoặc phần mềm quản lý LCT và phải được ghi âm theo trang bị của Đơn vị.", "B": "Lệnh bằng lời nói phải được ghi vào sổ Nhật ký vận hành.", "C": "Người chỉ huy trực tiếp phải viết lại thành văn bản giấy và gửi cho Người ra lệnh sau ca trực.", "D": "Phải có sự chứng kiến và ký xác nhận của Người giám sát an toàn điện tại hiện trường."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, người làm công tác an toàn các cấp có quyền hạn gì khi phát hiện vi phạm có thể dẫn đến tai nạn hoặc hư hỏng thiết bị?", "opts": {"A": "Phạt tiền trực tiếp người vi phạm tại hiện trường.", "B": "Cách chức ngay lập tức Người chỉ huy trực tiếp của đơn vị công tác.", "C": "Đình chỉ công việc để thực hiện đủ, đúng các biện pháp an toàn, đồng thời phải chịu hoàn toàn trách nhiệm về quyết định của mình.", "D": "Tịch thu toàn bộ dụng cụ, trang thiết bị của đơn vị vi phạm."}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, quy định về hình thức kiêm nhiệm khi thực hiện Lệnh công tác (LCT) là gì?", "opts": {"A": "Cho phép Người cấp phiếu kiêm nhiệm Người cho phép.", "B": "Không cho phép kiêm nhiệm đối với mọi cấp rủi ro.", "C": "Cho phép Người cấp lệnh kiêm nhiệm Người CHTT nếu Đơn vị QLVH và Đơn vị công tác là một đơn vị.", "D": "Cho phép Người CHTT kiêm nhiệm vai trò Người GSAT nếu cần."}, "ans": "C", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi làm việc trên đường cáp, quy định về vị trí đặt nối đất như thế nào?", "opts": {"A": "Đối với đường cáp chỉ cần đặt nối đất tại một đầu cáp tiến hành công việc.", "B": "Đối với đường cáp phải đặt nối đất hai đầu của đường cáp tiến hành công việc.", "C": "Đối với đường cáp không phải đặt nối đất hai đầu của đường cáp tiến hành công việc.", "D": "Không cần đặt nối đất nếu đường cáp đã được cắt điện hoàn toàn."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi thao tác tại chỗ, kéo ra/đưa vào vị trí vận hành thiết bị đóng cắt trên 01 kV, người thao tác phải sử dụng trang bị an toàn nào?", "opts": {"A": "Sử dụng đầy đủ PTBVCN theo quy định.", "B": "Phải mang găng tay cách điện và đi ủng cách điện hoặc đứng trên ghế/thảm cách điện phù hợp với cấp điện áp.", "C": "Phải mang găng tay cách điện hoặc đứng trên ghế/thảm cách điện phù hợp với cấp điện áp.", "D": "Phải mang găng tay cách điện và đi giầy hoặc đứng trên ghế/thảm cách điện phù hợp với cấp điện áp."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi các mặt bích của các đường ống thiết bị gia nhiệt được tháo rời ra, các bu lông phải được tháo như thế nào?", "opts": {"A": "Khi các bu lông phải được tháo lỏng cẩn thận và các êcu phải được tháo lỏng từ từ để tránh trường hợp hỗn hợp hơi nước hoặc nước phun ra nếu như ống đó chưa được xả hết.", "B": "Khi các mặt bích của các đường ống được tháo rời ra, các bu lông phải được tháo lỏng cẩn thận và các êcu phải được tháo lỏng từ từ để tránh trường hợp hỗn hợp hơi nước hoặc nước phun ra nếu như ống đó chưa được xả hết.", "C": "Khi các mặt bích phải được tháo lỏng cẩn thận và các êcu phải được tháo lỏng từng cái một để tránh trường hợp hỗn hợp hơi nước hoặc nước phun ra nếu như ống đó chưa được xả hết.", "D": "Việc tháo bu lông mặt bích phải do Người CHTT thực hiện."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, yêu cầu bảo hộ lao động đối với nữ giới khi thực hiện các công việc ở máy phát điện và máy bù đồng bộ là gì?", "opts": {"A": "Người làm việc phải mặc gọn gàng, phải đội mũ và tóc cuốn gọn.", "B": "Phải sử dụng sào cách điện chuyên dùng bọc nhựa PVC cứng.", "C": "Phải mang phương tiện bảo vệ cá nhân chống hồ quang và đứng cách xa 3 m.", "D": "Phải đeo găng tay cao su hạ thế và cài chặt vào cổ tay."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, yêu cầu đối với phần cách điện của ampe kìm khi sử dụng đo ở thiết bị điện trung áp là gì?", "opts": {"A": "Phải được bọc bằng băng dính cách điện màu vàng và không sử dụng đo ampe kìm đo nếu phần cách điện ở phía miệng kìm bị nứt, vỡ.", "B": "Phần cách điện khi sử dụng ampe kìm đo ở TBĐ trung áp phải trong thời hạn kiểm định. Không sử dụng ampe kìm đo nếu phần cách điện ở phía miệng kìm bị nứt, vỡ.", "C": "Phải thực hiện theo PCT.", "D": "Phải thực hiện theo LCT."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình An toàn khái niệm \"Cấp có thẩm quyền\" được hiểu như thế nào?", "opts": {"A": "Là Tổng giám đốc, Phó Tổng giám đốc Công ty hoặc người được ủy quyền/giao nhiệm vụ (theo phân cấp quản lý vận hành hoặc phân công công việc).", "B": "Là Giám đốc, Phó Giám đốc Công ty QLVH thiết bị.", "C": "Là Giám đốc, Phó Giám đốc của đơn vị thao tác thiết bị.", "D": "Là Giám đốc, Phó Giám đốc của đơn vị điều độ lưới điện."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, thời gian đăng ký công tác đối với công tác ngoài kế hoạch quy định như thế nào?", "opts": {"A": "Muộn nhất 12 giờ trước thời điểm bắt đầu thực hiện công tác.", "B": "Muộn nhất 24 giờ trước thời điểm bắt đầu thực hiện công tác.", "C": "Muộn nhất 48 giờ trước thời điểm bắt đầu thực hiện công tác.", "D": "Thực hiện ngay sau khi xuất hiện nhu cầu sửa chữa đột xuất."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, trường hợp nào sau đây cần có Người LĐCV?", "opts": {"A": "Đơn vị công tác làm các công việc không có chuyên môn về điện như nề, mộc, cơ khí.", "B": "Nhiều Đơn vị công tác thực hiện trên cùng ĐD, TBĐ và có phối hợp về biện pháp ATĐ.", "C": "Công việc thực hiện có thể gây nguy hiểm cho cộng đồng.", "D": "Người CHTT không đủ khả năng kiêm nhiệm vai trò Người CG."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, Lệnh công tác giấy được lập thành 02 phần A và B. Quy trình luân chuyển và ký phần B tại hiện trường thực hiện như thế nào?", "opts": {"A": "Người ra lệnh giữ phần B, Người chỉ huy trực tiếp giữ phần A để thi công.", "B": "Tại hiện trường, sau khi kiểm tra đủ, đúng các biện pháp an toàn theo LCT, Người CHTT và các Nhân viên đơn vị công tác phải ký vào phần B. Khi kết thúc công tác, Người CHTT chuyển lại phần B đến Người ra lệnh để lưu giữ theo quy định.", "C": "Nhân viên đơn vị công tác ký vào phần B và nộp lại cho Người cho phép khóa phiếu.", "D": "Phần B do Người giám sát an toàn điện giữ và ký xác nhận sau mỗi ngày HƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi nhiệt độ trong buồng đốt, đường khói trên bao nhiêu độ thì không được vào trong vệ sinh và kiểm tra?", "opts": {"A": "30OC", "B": "40OC", "C": "50OC", "D": "60OC"}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, nội dung nào sau đây là trách nhiệm của Người cho phép?", "opts": {"A": "Giao phiếu công tác/lệnh công tác, chỉ dẫn những yêu cầu cụ thể và những yếu tố nguy hiểm để thực hiện công việc.", "B": "Chỉ dẫn cho đơn vị công tác các thiết bị đã được cắt điện, những phần thiết bị còn điện và các biện pháp đặc biệt chú ý.", "C": "Kiểm tra sơ bộ sức khỏe nhân viên đơn vị công tác, phương tiện sơ cứu thiết yếu.", "D": "Giải thích cho nhân viên đơn vị công tác về nội dung, trình tự để thực hiện công việc và các biện pháp an toàn."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, thời gian công tác tối đa của Phiếu công tác (PCT) là bao lâu?", "opts": {"A": "Không quá 30 ngày.", "B": "Không quá 45 ngày.", "C": "Không quá 60 ngày.", "D": "Không quá 90 ngày."}, "ans": "C", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Quy trình an toàn quy định như thế nào về việc ứng dụng công nghệ hiện đại trong công tác bảo đảm an toàn lao động?", "opts": {"A": "Cấm tuyệt đối việc sử dụng công nghệ vì dễ gây phân tâm cho người lao động.", "B": "Chỉ cho phép sử dụng công nghệ để báo cáo, không dùng trong biện pháp tổ chức.", "C": "Cho phép ứng dụng công nghệ, trí tuệ nhân tạo trong việc thực hiện biện pháp tổ chức theo Quy trình này để tăng năng suất lao động nhưng vẫn bảo đảm an toàn theo quy định.", "D": "Bắt buộc phải thay thế hoàn toàn con người bằng trí tuệ nhân tạo khi lập biện pháp an toàn."}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, điều kiện để xác định trạng thái tại chỗ máy cắt, dao cách ly liên quan đã mở hoàn toàn trước khi thao tác xa dao tiếp địa là gì?", "opts": {"A": "Thông qua hệ thống tín hiệu đèn báo rơ le bảo vệ tại tủ nhị thứ phòng điều khiển.", "B": "Phải xác định được trạng thái tại chỗ máy cắt, dao cách ly liên quan đã mở hoàn toàn thông qua xác nhận của Nhân viên vận hành tại nơi đặt thiết bị đóng cắt hoặc camera giám sát vận hành.", "C": "Phải xác định được máy cắt, dao cách ly liên quan đã mở hoàn toàn thông qua xác nhận của Nhân viên vận hành tại nơi đặt thiết bị đóng cắt hoặc camera giám sát vận hành.", "D": "Phải được Nhân viên vận hành tại nơi đặt thiết bị đóng cắt xác nhận."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trường hợp thời gian công tác thực tế ngoài khoảng thời gian ghi trên phiếu công tác thì phải xử lý như thế nào?", "opts": {"A": "Người CHTT ghi gia hạn thêm thời gian vào phiếu cũ.", "B": "Người CHTT và Người cho phép ký xác nhận đồng ý kéo dài thời gian trên PCT.", "C": "Phải cấp PCT mới.", "D": "Công việc vẫn tiếp tục thực hiện đến khi hoàn thành."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi sửa chữa, vệ sinh thanh cái, quy định về việc đặt nối đất thực hiện như thế nào?", "opts": {"A": "Đặt một bộ nối đất di động duy nhất tại đầu nguồn cấp máy biến áp lực.", "B": "Sửa phân đoạn nào thì phải đặt nối đất cố định trên phân đoạn đó. Nếu sửa toàn bộ các phân đoạn thì mỗi phân đoạn phải có một bộ nối đất.", "C": "Sửa phân đoạn nào thì phải đặt nối đất (cố định hoặc di động) trên phân đoạn đó. Nếu sửa toàn bộ các phân đoạn thì mỗi phân đoạn phải có một bộ nối đất.", "D": "Chỉ cần đặt nối đất tại một phân đoạn bất kỳ để bảo vệ chung cho toàn bộ thanh cái."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, yêu cầu đầu tiên đối với việc tạo vùng làm việc an toàn của đơn vị quản lý vận hành là gì?", "opts": {"A": "Không được làm gián đoạn hệ thống nguồn nhị thứ điều khiển cấp cho toàn trạm.", "B": "Phải đảm bảo bao phủ ranh giới vùng làm việc bằng các lưới thép mắt cáo.", "C": "Không được ảnh hưởng đến vận hành của các phần có điện gần vùng làm việc an toàn.", "D": "Bắt buộc đặt biển chỉ dẫn bằng vật liệu phản quang có đèn LED chớp cảnh báo."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khi có rào chắn tạm thời, khoảng cách ATĐ từ rào chắn đến phần có điện 500 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "4,00 m", "B": "4,50 m", "C": "5,00 m", "D": "6,00 m"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, \"Danh mục công việc\" được hiểu là gì?", "opts": {"A": "Bảng kê tất cả nhân viên vận hành và sửa chữa của các phân xưởng trong Công ty.", "B": "Bảng kê những công việc được đánh giá rủi ro tại từng vị trí, phạm vi công việc do Đơn vị ban hành.", "C": "Kế hoạch sửa chữa lớn và bảo dưỡng thiết bị hàng năm của nhà máy.", "D": "Nhật ký ghi lại các sự cố điện và sự cố cơ nhiệt hóa đã xảy ra trong ca trực."}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Khi kiểm tra bình chữa cháy bột hệ MFZL, nếu phát hiện kim đồng hồ chỉ vào vùng vạch XANH, ta phải làm gì?", "opts": {"A": "Mang bình đi nạp sạc lại áp lực ngay lập tức.", "B": "Để bình ra chỗ thoáng mát và liên tục theo dõi sự cố rò rỉ.", "C": "Tiến hành xả bớt khí đẩy để đưa kim về vị trí an toàn.", "D": "Không cần phải làm gì vì áp suất khí đẩy đạt mức lý tưởng, bình hoạt động tốt và sẵn sàng sử dụng."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, điều kiện để xác định đường dây hoặc thiết bị điện đã mất điện trước khi thao tác xa dao tiếp địa là gì?", "opts": {"A": "Căn cứ vào trạng thái hiển thị vị trí mở hoàn toàn của tất cả các aptomat hạ áp liên quan.", "B": "Phải xác định được ĐD hoặc TBĐ đã mất điện căn cứ thông số điện áp hoặc xác nhận của Nhân viên vận hành có mặt tại trạm điện, nhà máy điện.", "C": "Căn cứ vào thời gian cắt điện ghi trên sơ đồ vận hành trực tuyến của phòng trung tâm.", "D": "Phải dùng bút thử điện chuyên dùng để kiểm tra trực tiếp ở tất cả các pha tại hiện trường."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"} ân viên vận hành hoặc Người chỉ huy trực tiếp (khi được nhân viên vận hành đồng ý) thực hiện lại các biện pháp an toàn ban đầu.", "C": "Trưởng ca vận hành đồng ý.", "D": "Người CHTT thực hiện lại các biện pháp an toàn ban đầu."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, dây nối đất ngắn mạch (tạo ngắn mạch, chống đóng điện nhầm từ nguồn điện đến) yêu cầu tiết diện tối thiểu là bao nhiêu đối với lưới điện cấp điện áp đến 35 kV và từ 110 kV trở lên?", "opts": {"A": "Không nhỏ hơn 10 mm² đối với cấp điện áp đến 35 kV, và 16 mm² đối với cấp 110 kV trở lên.", "B": "Không được nhỏ hơn 16  mm² đối với lưới điện cấp điện áp đến 35 kV, 35  mm² đối với lưới điện cấp điện áp từ 110 kV trở lên.", "C": "Không nhỏ hơn 16 mm² đối với cấp điện áp đến 35 kV, và 50 mm² đối với cấp 110 kV trở lên.", "D": "Không nhỏ hơn 25 mm² đối với cấp điện áp đến 35 kV, và 50 mm² đối với cấp 110 kV trở lên."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, người làm nối đất phải thực hiện hành động gì để đảm bảo đường dây hoặc thiết bị điện không còn điện trước khi lắp dây nối đất vào?", "opts": {"A": "Căn cứ hoàn toàn vào tín hiệu đèn, rơ le báo vị trí mở của aptomat.", "B": "Sử dụng thiết bị thử điện để kiểm tra ĐD hoặc thiết bị điện không còn điện trước khi lắp dây nối đất vào ĐD hoặc thiết bị điện.", "C": "Căn cứ vào phiếu thao tác.", "D": "Căn cứ vào tín hiệu điện áp và dòng điện."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, Người cho phép phải đạt tiêu chuẩn nào?", "opts": {"A": "Là người có bậc 3 ATĐ trở lên.", "B": "Là người có bậc 4 ATĐ trở lên.", "C": "Là người phải có bậc 5 ATĐ.", "D": "Không quy định bậc ATĐ"}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Con số 35 trong ký hiệu của loại bình chữa cháy bột xe đẩy \"MFTZ-35\" thể hiện thông số kỹ thuật nào?", "opts": {"A": "Tổng khối lượng của toàn bộ xe đẩy và bình.", "B": "Khối lượng của riêng vỏ bình chữa cháy.", "C": "Khối lượng chất bột chữa cháy nạp bên trong bình.", "D": "Thời gian phun hiệu quả tối đa là 35 giây."}, "ans": "C", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trọng lượng của hàng phân bố trên xe nâng hàng và phần nhô ra ở phía trước quy định như thế nào?", "opts": {"A": "Trọng lượng hàng phải lệch hẳn về một càng nâng bên trái của xe nâng.", "B": "Phải tập trung toàn bộ trọng lượng hàng ở phần nhô ra phía trước của càng nâng.", "C": "Trọng lượng của hàng phải được phân bố đều trên hai càng nâng và phần nhô ra ở phía trước không được vượt quá 1/3 độ dài của càng nâng.", "D": "Phần nhô ra ở phía trước được phép vượt quá 1/2 độ dài của càng nâng nếu có dây chằng chặt."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về tư thế của càng nâng khi xe nâng hàng di chuyển?", "opts": {"A": "Cho phép giữ càng nâng ở độ cao 0,2 mét tính từ mặt sàn chỗ người móc đứng.", "B": "Cho phép giữ càng nâng ở độ cao 0,3 mét tính từ mặt sàn chỗ người móc đứng.", "C": "Cho phép giữ càng nâng ở độ cao 0,5 mét tính từ mặt sàn chỗ người móc đứng", "D": "Hạ thấp càng nâng khi di chuyển."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi làm việc trên những mái nhà trơn, dốc phải thực hiện điều gì?", "opts": {"A": "Phải dùng dây xích pa lăng quàng vào người để neo giữ chắc chắn.", "B": "Làm việc trên những mái nhà trơn, dốc phải có biện pháp an toàn để tránh trượt ngã.", "C": "Phải dùng tay bám chặt vào bề mặt mái nhà và di chuyển thật nhanh.", "D": "Chỉ cần đi giầy bảo hộ lao động bình thường là đủ điều kiện an toàn."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, quy định như thế nào về việc cấp Phiếu công tác (PCT) theo công việc?", "opts": {"A": "Mỗi PCT chỉ được cấp cho 01 Đơn vị công tác cho 01 công việc.", "B": "Mỗi PCT có thể cấp cho nhiều Đơn vị công tác cùng thực hiện một công việc.", "C": "Mỗi PCT được cấp cho nhiều vị trí công tác với nhiều Đơn vị công tác thực hiện.", "D": "Mỗi PCT được phép mở rộng phạm vi làm việc khi có sự đồng ý của Người cấp phiếu."}, "ans": "A", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khoảng cách an toàn đối với lưới điện hạ áp (dây trần) xoay chiều là bao nhiêu?", "opts": {"A": "0,2 m", "B": "0,3 m", "C": "0,5 m", "D": "0,6 m"}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Cách cứu nạn nhân bị điện giật ở trạng thái mất tri giác?", "opts": {"A": "Để nạn nhân ra chỗ thoáng khí yên tĩnh chăm sóc cho hồi tỉnh. Sau đó mời y, bác sỹ hoặc nhẹ nhàng đưa đến cơ quan y tế gần nhất để theo dõi chăm sóc.", "B": "Đặt nạn nhân nơi thoáng khí, yên tĩnh (trời rét phải đặt ở nơi kín gió), nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm, đặt nạn nhân về tư thế nằm nghiêng, ma sát toàn thân cho nóng lên và mời y, bác sỹ đến để chăm sóc.", "C": "Đưa nạn nhân ra chỗ thoáng khí, nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm nạn nhân ra. Tiến hành hồi sinh tổng hợp ngay, phải làm liên tục, kiên trì cho đến khi nạn nhân tự thở được hoặc có ý kiến của y, bác sỹ mới thôi.", "D": "Đáp án A, B, C đúng."}, "ans": "B", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Điền từ vào chỗ trống theo Quy trình an toàn: “Mối nguy (yếu tố nguy hiểm, yếu tố có hại) là một nguồn gốc, một tình huống hoặc một hành động có khả năng gây ra .... đối với con người, làm hư hỏng tài sản hoặc hủy hoại môi trường”.", "opts": {"A": "Tổn hại (tổn thương hay tác hại sức khoẻ).", "B": "Tai nạn nghiêm trọng.", "C": "Sự cố gián đoạn vận hành.", "D": "Thiệt hại về mặt kinh tế."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, quy định đối với việc cho người vào trạm điện tham quan, nghiên cứu như thế nào?", "opts": {"A": "Đối với những người vào tham quan, nghiên cứu phải do lãnh đạo Đơn vị QLVH (hoặc người được giao nhiệm vụ) hướng dẫn. (p. 41)", "B": "Đối với những người vào tham quan, nghiên cứu phải do Trưởng ca đương nhiệm (hoặc người được giao nhiệm vụ) hướng dẫn.", "C": "Chỉ cần đăng ký thông tin với Phòng Kỹ thuật và an toàn Công ty.", "D": "Chỉ cần đăng ký thông tin với Phân xưởng Vận hành Công ty."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Trong bình bột chữa cháy xách tay MFZL/ABC, loại khí đẩy nào thường được nén trực tiếp bên trong?", "opts": {"A": "Khí Hydro.", "B": "Khí Cacbonic (CO2).", "C": "Khí SF6.", "D": "Khí Nitơ (N2)."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, Người thi hành lệnh (khi thực hiện công việc một mình) phải đạt tiêu chuẩn nào?", "opts": {"A": "Có bậc 3 ATĐ trở lên; Phải nắm vững thời gian, địa điểm, nội dung công việc.", "B": "Người thi hành lệnh có bậc 3 ATĐ trở lên; Phải nắm vững thời gian, địa điểm, nội dung công việc được giao và các biện pháp an toàn phù hợp với yêu cầu của công việc; Được Đơn vị công tác cử để thực hiện công việc.", "C": "Có bậc 4 ATĐ trở lên; Phải hiểu rõ nội dung công việc được giao và các biện pháp an toàn.", "D": "Có bậc 5 ATĐ; Phải hiểu rõ nội dung công việc được giao và các biện pháp an toàn."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình An toàn khái niệm \"đánh giá rủi ro\" được hiểu như thế nào?", "opts": {"A": "Là quá trình tìm hiểu, xác định những mối nguy hiểm có thể xảy ra liên quan tới công việc chuẩn bị thực hiện và đưa ra biện pháp phòng ngừa hợp lý.", "B": "Là quá trình nhận diện trước khi thực hiện công việc và đưa ra các biện pháp phòng ngừa hợp lý.", "C": "Là quá trình tìm hiểu, xác định những rủi ro có thể xảy ra liên quan tới công việc chuẩn bị thực hiện và đưa ra biện pháp phòng ngừa hợp lý.", "D": "Là quá trình tìm hiểu những rủi ro để người lao động phòng ngừa"}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, quy định như thế nào về việc quản lý nhân viên và biện pháp an toàn khi nghỉ giải lao tại hiện trường công tác?", "opts": {"A": "Nhân viên được tự ý di chuyển ra ngoài phạm vi cho phép mà không cần báo cáo.", "B": "Khi nghỉ giải lao, tất cả Nhân viên đơn vị công tác phải dừng làm việc, các biện pháp an toàn phải được giữ nguyên, ký/xác nhận điên tử rút khỏi vị trí làm việc nếu rời khỏi hiện trường công tác. Các Nhân viên đơn vị công tác vẫn phải chịu sự giám sát của Người CHTT nếu nghỉ giải lao tại hiện trường công tác.", "C": "Khi nghỉ giải lao, tất cả Nhân viên đơn vị công tác phải dừng làm việc, các biện pháp an toàn phải được giữ nguyên, ký/xác nhận điên tử rút khỏi vị trí làm việc nếu rời khỏi hiện trường công tác.", "D": "Nhân viên được tự ý trở lại hiện trường công tác làm việc tiếp để đẩy nhanh tiến độ."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, người lao động mới tuyển dụng phải trải qua những bước kiểm tra nào sau khi được đào tạo, huấn luyện, kèm cặp để đạt yêu cầu mới được giao nhiệm vụ?", "opts": {"A": "Chỉ cần kiểm tra bằng hình thức thực hành tại công trường.", "B": "Chỉ cần làm bài kiểm tra lý thuyết trắc nghiệm trên máy tính.", "C": "Được kiểm tra bằng cả hai hình thức lý thuyết và thực hành.", "D": "Do Quản đốc phân xưởng trực tiếp phỏng vấn vấn đáp."}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, khi thay đổi chức danh Người lãnh đạo công việc (LĐCV), Người chỉ huy trực tiếp (CHTT), Người giám sát an toàn điện (GSATĐ) thì quy trình ký xác nhận quy định như thế nào?", "opts": {"A": "Không có quy định.", "B": "Phải cấp Phiếu công tác mới.", "C": "Người rút khỏi vị trí ký/xác nhận điện tử trước, người vào vị trí làm việc ký/xác nhận điện tử sau.", "D": "Người vào vị trí làm việc ký/xác nhận điện tử trước, người rút khỏi vị trí ký/xác nhận điện tử sau."}, "ans": "D", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi làm việc trong ngăn tủ phân phối, quy định bắt buộc về việc đặt nối đất để cho phép làm việc là gì?", "opts": {"A": "Chỉ cần đặt rào chắn tạm thời ngăn cách với các ngăn tủ bên cạnh đang có điện.", "B": "Phải nối đất ở thanh cái và xuất tuyến của ngăn này trước khi thực hiện công việc. Không cho phép làm việc trong ngăn tủ phân phối khi hàm tĩnh trên hoặc dưới ngăn tủ này chưa được nối đất.", "C": "Phải nối đất ở thanh cái và xuất tuyến của ngăn này trước khi thực hiện công việc. Cho phép làm việc trong ngăn tủ phân phối khi hàm tĩnh trên hoặc dưới ngăn tủ này chưa được nối đất.", "D": "Phải nối đất ở ngăn máy cắt này trước khi thực hiện công việc. Không cho phép làm việc trong ngăn tủ phân phối khi hàm tĩnh trên hoặc dưới ngăn tủ này chưa được nối đất."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, khoảng cách giữa các bậc thang di động được quy định như thế nào?", "opts": {"A": "Khoảng cách giữa các bậc thang đều nhau và không lớn hơn 45 cm.", "B": "Khoảng cách giữa các bậc thang tùy thuộc vào chiều dài tổng thể của thang.", "C": "Khoảng cách giữa các bậc thang đều nhau và không được nhỏ hơn 50 cm.", "D": "Khoảng cách giữa các bậc thang phải do nhà chế tạo tự đóng bằng đinh chắc chắn."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Những nguyên nhân phổ biến nào dẫn đến các sự cố cháy nổ do hệ thống hoặc thiết bị điện?", "opts": {"A": "Cháy do dùng điện quá tải hoặc chập mạch điện (ngắn mạch).", "B": "Cháy do hiện tượng tĩnh điện hoặc các mối nối dây không tốt sinh nhiệt lớn.", "C": "Cháy do phóng hồ quang điện, phóng điện sét hoặc truyền nhiệt từ vật tiêu thụ điện.", "D": "Tất cả các nguyên nhân do quá tải, chập mạch, tĩnh điện, mối nối kém, hồ quang điện và phóng điện sét."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về việc đeo dây an toàn khi làm việc với thang di động?", "opts": {"A": "Bắt buộc phải móc chặt dây an toàn vào bậc trên cùng của thang di động.", "B": "Không đeo dây an toàn vào thang di động.", "C": "Có thể móc dây an toàn vào thanh dọc của thang nếu chân thang đã lót cao su chống trượt.", "D": "Giao cho người giữ chân thang đeo dây an toàn nối liền với người đứng trên thang."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời gian công tác do Người cấp phiếu ghi trên Phiếu công tác quy định tối đa là bao nhiêu ngày?", "opts": {"A": "Không quá 30 ngày.", "B": "Không quá 45 ngày.", "C": "Không quá 60 ngày.", "D": "Không quá 90 ngày."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, việc tổ chức Đơn vị công tác phải thực hiện sao cho với 01 Đơn vị công tác khi làm việc theo 01 PCT/LCT, Người CHTT phải làm gì để bảo đảm an toàn?", "opts": {"A": "Phải trực tiếp hoặc phân công Nhân viên công tác đặt, di chuyển, tháo dỡ các biển báo an toàn.", "B": "Phải hợp tác chặt chẽ với Người cấp phiếu/lệnh, Người cho phép.", "C": "Phải giám sát được tất cả nhân viên của Đơn vị công tác trong cùng một thời gian, không gian.", "D": "Phải có mặt liên tục tại nơi làm việc, giám sát an toàn."}, "ans": "D", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, trước thời điểm Đơn vị công tác bắt đầu công việc ngày tiếp theo ít nhất bao lâu thì Đơn vị QLVH phải khẳng định lại các biện pháp an toàn?", "opts": {"A": "Ít nhất 15 phút.", "B": "Ít nhất 30 phút.", "C": "Ít nhất 45 phút.", "D": "Ít nhất 60 phút."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Lực lượng nào tại chỗ có nhiệm vụ ứng phó đầu tiên và sử dụng phương tiện hiện có khi mới xuất hiện đám cháy tại nhà máy?", "opts": {"A": "Đội PCCC cơ sở (hoặc Đội PCCC chuyên ngành được thành lập riêng của nhà máy).", "B": "Lực lượng Cảnh sát PCCC chuyên nghiệp của quận/huyện/thành phố sở tại.", "C": "Lực lượng dân quân tự vệ hoặc công an xã/phường nơi nhà máy đóng quân.", "D": "Đội bảo vệ dân phố hoặc lực lượng thanh niên xung kích địa phương."}, "ans": "A", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trong bước thực hiện các biện pháp an toàn và bàn giao hiện trường, Đơn vị QLVH lưu ý Đơn vị công tác điều gì?", "opts": {"A": "Đơn vị công tác phải tự kiểm tra và bảo đảm đầy đủ PTBVCN.", "B": "Đơn  ra tai nạn.", "D": "Đáp án A, B, C"}, "ans": "D", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, cấu tạo của dây nối đất được quy định như thế nào?", "opts": {"A": "Dây nối đất là dây đồng hoặc hợp kim mềm, nhiều sợi, tiết diện phải chịu được tác dụng lực điện động và nhiệt.", "B": "Dây nối đất phải là dây nhôm trần đơn sợi, bọc cách điện tương ứng với cấp điện áp danh định.", "C": "Dây nối đất là dây đồng nhiều sợi, tiết diện phải chịu được tác dụng lực điện động và nhiệt.", "D": "Dây nối đất là dây hợp kim mềm, nhiều sợi, tiết diện phải chịu được tác dụng lực điện động và nhiệt."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, để phòng tránh ảnh hưởng nguy hiểm của điện trường, đối với ĐDK và trạm 500 kV có cường độ điện trường lớn hơn 5 kV/m, phải sử dụng các trang bị nào?", "opts": {"A": "Phải sử dụng sào cách điện kết hợp với ủng cách điện cao áp.", "B": "Phải sử dụng các thiết bị chắn điện trường hay PTBVCN (quần, áo, mũ, giày, chắn, kính,… ).", "C": "Phải dùng dây nối đất mềm nhiều sợi bọc vỏ nhựa màu vàng để khử tĩnh điện.", "D": "Phải sử dụng rào chắn tạm thời bằng vật liệu chắc chắn, không dẫn điện."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, khi làm việc trong hành lang bảo vệ an toàn lưới điện, khoảng cách an toàn phóng điện theo cấp điện áp đối với thiết bị, dụng cụ, phương tiện (trừ phương tiện phục vụ hotline) của cấp điện áp 220 kV là bao nhiêu?", "opts": {"A": "2,0 m", "B": "3,0 m", "C": "4,0 m", "D": "6,0 m"}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, những công việc nào sau đây cho phép làm việc khi thiết bị điện có điện áp trên 01 kV đang mang điện (vẫn có điện) nhưng phải đảm bảo khoảng cách an toàn theo quy định?", "opts": {"A": "Lấy mẫu dầu máy biến áp (chú ý kiểm tra nối đất vỏ máy trước).", "B": "Thay, kéo dây đường trục; thay, chuyển cột điện, chuyển điểm đấu nối của lưới điện cao áp.", "C": "Tháo rời đầu cáp lực của máy phát điện diesel để mang về phòng thí nghiệm hiệu chuẩn.", "D": "Sửa chữa mạch nhị thứ điều khiển và đóng cắt thử bộ truyền động của dao cách ly."}, "ans": "A", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, đối với công việc để xảy ra sự cố hoặc tai nạn thì các Phiếu công tác có liên quan và các tài liệu khác phải được lưu ở đâu?", "opts": {"A": "Phải được lưu giữ tại văn phòng của Đơn vị công tác bên ngoài.", "B": "Phải được lưu trong hồ sơ điều tra sự cố, tai nạn lao động của đơn vị.", "C": "Phải gửi về Tập đoàn Điện lực Việt Nam để lưu trữ tập trung.", "D": "Phải bàn giao cho cơ sở y tế gần nhất nơi xảy ra tai nạn."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, công việc nào sau đây bắt buộc phải thực hiện theo Phiếu công tác?", "opts": {"A": "Làm việc ở xa nơi có điện (không vi phạm khoảng cách ATĐ theo quy định).", "B": "Làm việc với ĐD/TBĐ hạ áp, trừ công việc đại tu, sửa chữa lớn; thay, kéo dây đường trục; thay, chuyển cột điện, chuyển điểm đấu nối.", "C": "Công việc không cần phải thực hiện các biện pháp kỹ thuật chuẩn bị vị trí làm việc, chỉ cần sử dụng PTBVCN.", "D": "Làm việc với ĐD/TBĐ trên 01 kV: cắt điện, có điện hoặc gần phần có điện trên 01 kV (có thể vi phạm khoảng cách ATĐ theo Điều 37, Điều 38 Quy trình này)."}, "ans": "D", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi làm việc trong hành lang bảo vệ an toàn lưới điện, khoảng cách an toàn phóng điện theo cấp điện áp đối với thiết bị, dụng cụ, phương tiện (trừ phương tiện phục vụ hotline) từ trên 01 đến 35 kV là bao nhiêu?", "opts": {"A": "0,6 m", "B": "0,7 m", "C": "2,0 m", "D": "3,0 m"}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nếu công việc phải kéo dài nhiều ngày thì sau mỗi ngày làm việc, Đơn vị công tác phải thực hiện thủ tục gì tại hiện trường?", "opts": {"A": "Phải tháo dỡ toàn bộ rào chắn, biển báo và hệ thống nối đất cố định.", "B": "Đơn vị công tác phải thu dọn nơi làm việc, rút khỏi hiện trường và giữ nguyên các biện pháp an toàn. Người CHTT phải giao lại PCT giấy hoặc xác nhận điện tử những việc liên quan cho Người cho phép, đồng thời hai bên phải cùng ký/xác nhận điện tử hoặc ghi tên vào PCT.", "C": "Người chỉ huy trực tiếp bàn giao lại Phiếu công tác cho Người cấp phiếu hủy bỏ.", "D": "Bàn giao lại toàn bộ dụng cụ thi công cho Nhân viên trực vận hành ca trực lưu giữ."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, thủ tục đầu tiên khi thực hiện cho phép làm việc tại hiện trường đối với việc làm việc có cắt điện yêu cầu Người cho phép phải làm gì?", "opts": {"A": "Yêu cầu toàn bộ Nhân viên đơn vị công tác ký tên xác nhận vào Phiếu công tác giấy.", "B": "Phải chứng minh là không còn điện ở các phần đã được cắt điện.", "C": "Phải chứng minh là không còn điện ở các phần đã được cắt điện và treo đầy đủ biển báo.", "D": "Đặt tiếp đất và treo biển báo ở các phần đã được cắt điện."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Nghị định 62/2025/NĐ-CP thì thời gian để huấn luyện an toàn điện lần đầu (bậc an toàn điện 1/5) ít nhất là bao nhiêu?", "opts": {"A": "Thời gian huấn luyện ít nhất 8 giờ.", "B": "Thời gian huấn luyện ít nhất 12 giờ.", "C": "Thời gian huấn luyện ít nhất 16 giờ.", "D": "Thời gian huấn luyện ít nhất 24 giờ."}, "ans": "D", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây nằm trong danh mục các hành vi bị cấm leo trèo, đi lại tùy tiện?", "opts": {"A": "Leo lên giàn giáo bằng đường đi, bậc thang đã định sẵn.", "B": "Leo trèo, đi lại tùy tiện (như trên mặt tường, mặt dầm, giàn và các kết cấu lắp ghép khác, leo trèo qua lan can an toàn, leo trèo theo giàn giáo, đu bám vào dây treo để lên và xuống…).", "C": "Di chuyển dưới nước theo đúng đường, cầu nối quy định của phương tiện.", "D": "Đi lại trên mặt bằng, sàn thao tác có lan can bảo vệ chắc chắn."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo thống kê, nếu bị tai nạn điện giật mà được cấp cứu kịp thời và đúng phương pháp trong thời gian 3 phút đầu tiên thì tỉ lệ nạn nhân được cứu sống là bao nhiêu?", "opts": {"A": "0.7", "B": "0.5", "C": "0.25", "D": "0.1"}, "ans": "A", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, điều kiện về điện áp cảm ứng để một thiết bị điện từ 35 kV trở xuống được phép không cần đặt nối đất di động sau khi cắt điện là gì?", "opts": {"A": "Chắc chắn không có hiện tượng cảm ứng điện từ xuất hiện trên thiết bị đó.", "B": "Biên độ dòng điện cảm ứng đo được tại hiện trường nhỏ hơn 0,5 mA.", "C": "Thiết bị được che chắn bảo vệ bởi hệ thống lưới sắt từ tính toàn trạm.", "D": "Đường dây song song bên cạnh có cấp điện áp nhỏ hơn hoặc bằng 22 kV."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, Phiếu công tác (PCT) được định nghĩa như thế nào?", "opts": {"A": "PCT là lệnh cho phép thực hiện công việc có mức rủi ro đến cấp 2 theo Danh mục công việc.", "B": "PCT là phiếu cho phép Đơn vị công tác làm việc với thiết bị hoặc hệ thống, dây chuyền sản xuất, công việc có mức rủi ro từ cấp 3 trở lên theo Danh mục công việc.", "C": "PCT là phiếu do cấp có thẩm quyền ban hành phù hợp với hiện trường, chủng loại và khả năng của xe chuyên dùng.", "D": "PCT là phiếu dùng để ghi các bước thao tác cách ly hoặc đưa thiết bị vào vận hành không quá 5 bước."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Số lượng, tần suất ấn và độ sâu khi ấn tim ngoài nồng ngực trong thực hành cấp cứu hồi sinh tổng hợp thực hiện như thế nào là đúng?", "opts": {"A": "Ấn tim ngoài nồng ngực 30 lần, với tần số ấn tim từ 100 đến 120 lần/phút và ấn sâu từ 5 đến 6 cm.", "B": "Ấn tim ngoài nồng ngực 20 lần, với tần số ấn tim từ 60 đến 80 lần/phút và ấn sâu từ 7 đến 8 cm.", "C": "Ấn tim ngoài nồng ngực 40 lần, với tần số ấn tim từ 130 đến 140 lần/phút và ấn sâu từ 3 đến 4 cm."}, "ans": "A", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, lượng ôxy trong không khí khi đo kiểm tra đối với không gian hạn chế phải chiếm bao nhiêu % theo thể tích?", "opts": {"A": "Lượng oxy trong không khí chiếm từ 15,5% đến 19,5% tính theo thể tích.", "B": "Lượng oxy trong không khí chiếm từ 19,5% đến 23,5% tính theo thể tích.", "C": "Lượng oxy trong không khí chiếm từ 23,5% đến 28,5% tính theo thể tích.", "D": "Không có quy định về tỷ lệ ôxy."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}], "ĐỀ 09": [{"stem": "Theo Quy trình an toàn, ở thiết bị phân phối điện trong nhà, biển cảnh báo “Dừng lại! Có điện nguy hiểm chết người” phải được treo tại những vị trí nào?", "opts": {"A": "Tại cửa chính lối ra vào trạm và trên tường phía sau máy biến áp lực.", "B": "Tại tủ điều khiển nhị thứ trung tâm và bàn làm việc của nhân viên trực ban.", "C": "Trên tất cả các tay gạt điều khiển cơ khí của aptomat hạ áp phân phối.", "D": "Trên rào lưới hoặc cửa sắt của các ngăn bên cạnh và đối diện với chỗ làm việc."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đối với các thiết bị đóng cắt kiểu kín (không nhìn được khoảng hở) thì phải căn cứ vào đâu để xác định đã cách ly khỏi các phần có điện từ mọi phía?", "opts": {"A": "Phải căn cứ hiển thị về cơ khí trạng thái tại chỗ của thiết bị đóng cắt và thông số điện áp (nếu có).", "B": "Phải căn cứ hiển thị về cơ khí trạng thái tại chỗ của thiết bị đóng cắt và thông số dòng điện (nếu có).", "C": "Phải căn cứ hiển thị trạng thái tại chỗ của thiết bị đóng cắt và thông số điện áp (nếu có)", "D": "Phải căn cứ hiển thị trạng thái tại chỗ của thiết bị đóng cắt và thông số dòng điện (nếu có)."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Một sự cháy xảy ra trên thực tế thường bao gồm những dấu hiệu đặc trưng nào?", "opts": {"A": "Có phản ứng hoá học giữa chất cháy với oxy.", "B": "Có sự toả nhiệt ra môi trường xung quanh.", "C": "Bao gồm đầy đủ các dấu hiệu phản ứng hóa học, tỏa nhiệt và phát sáng.", "D": "Có sự phát sáng tạo ra ngọn lửa hoặc ánh hồng."}, "ans": "C", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trình tự các bước thực hiện khi THÁO nối đất được quy định cụ thể như thế nào?", "opts": {"A": "Tháo đầu dây nối với đất trước, sau đó tháo đầu dây nối với đường dây, thiết bị điện.", "B": "Tháo đầu dây nối với đất trước, sau đó tháo đầu dây nối với đường dây, thiết bị điện (làm theo trình tự ngược lại với khi đặt nối đất).", "C": "Tiến hành tháo đồng thời cả hai đầu dây nối đất cùng một lúc để đẩy nhanh tiến độ.", "D": "Tháo đầu dây nối với đường dây, thiết bị điện trước, sau đó tháo đầu dây nối với đất (làm theo trình tự ngược lại với khi đặt nối đất)."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Trình bày nguyên lý làm việc cốt lõi của bình chữa cháy khí CO2 (ví dụ loại MT3, MT5)?", "opts": {"A": "Phun ra một lớp bột hóa học màu trắng làm cách ly bề mặt ngọn lửa.", "B": "Tạo ra lớp màng bọt Foam hóa học để ngăn không cho khí oxy tiếp xúc chất cháy.", "C": "Khi phun ra, khí CO2 bao phủ bề mặt đám cháy, làm loãng nồng độ oxy vùng cháy đồng thời thu nhiệt mạnh (làm lạnh) để dập lửa.", "D": "Dùng áp lực khí cực mạnh để thổi bay các gốc tự do của ngọn lửa ra ngoài."}, "ans": "C", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Cách cứu nạn nhân bị điện giật chưa mất tri giác?", "opts": {"A": "Để nạn nhân ra chỗ thoáng khí, yên tĩnh chăm sóc cho hồi tỉnh. Sau đó mời y, bác sỹ hoặc nhẹ nhàng đưa đến cơ quan y tế gần nhất để theo dõi chăm sóc.", "B": "Đặt nạn nhân nơi thoáng khí, yên tĩnh, nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm nạn nhân ra, cho nạn nhân ngửi amôniắc hoặc nước tiểu, ma sát toàn thân cho nóng lên và cho người đi mời y, bác sỹ đến để chăm sóc.", "C": "Đưa nạn nhân ra chỗ thoáng khí, nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm nạn nhân ra. Tiến hành hồi sinh tổng hợp ngay, phải làm liên tục, kiên trì cho đến khi nạn nhân tự thở được hoặc có ý kiến của y, bác sỹ mới thôi.", "D": "Đáp án A, B đúng."}, "ans": "A", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, yêu cầu kỹ thuật đối với chổi sơn khi sử dụng để sơn xà và phần trên của cột ĐDK trên 01 kV đang vận hành là gì?", "opts": {"A": "Chổi sơn phải được bọc bằng băng dính cách điện màu vàng xung quanh cán.", "B": "Chổi sơn phải làm bằng cán gỗ hoặc vật liệu cách điện không dài quá 10 cm.", "C": "Chổi sơn phải làm bằng hợp kim đồng nhiều sợi có chiều dài tùy chọn.", "D": "Không quy định vật liệu cán chổi, phải tránh để sơn rơi lên dây dẫn và sứ."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, khi dùng hai hoặc nhiều thiết bị nâng để cùng nâng một tải trọng trong trường hợp đặc biệt, tải phân bố trên mỗi thiết bị phải bảo đảm điều gì?", "opts": {"A": "Tổng tải trọng phân bố lớn hơn tổng sức nâng của các thiết bị cộng lại.", "B": "Tải phân bố trên mỗi thiết bị nâng không được lớn hơn sức nâng cho phép của thiết bị nâng đó.", "C": "Thiết bị lớn chịu toàn bộ tải trọng, thiết bị nhỏ làm nhiệm vụ chống hàng lắc lư.", "D": "Tải trọng được phân bố lệch sang một bên của móc kép để thiết bị nâng dễ di chuyển."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng về việc kiểm tra áp lực của thiết bị đã cách ly khỏi vận hành?", "opts": {"A": "Được phép căn cứ vào đồng hồ chỉ thị tại hiện trường để xác nhận thiết bị không còn áp lực.", "B": "Cấm căn cứ đồng hồ chỉ thị để xác nhận thiết bị không còn áp lực nhưng nếu đồng hồ chỉ thị có áp lực phải xem như thiết bị vẫn còn áp lực.", "C": "Người cho phép chỉ cần kiểm tra nhiệt độ bằng súng bắn nhiệt độ là đủ điều kiện xác nhận không còn áp lực.", "D": "Đơn vị công tác chỉ cần mở thử van xả khí thấy không có tiếng động là có thể khẳng định thiết bị hết áp lực."}, "ans": "B", "chuong": "CHƯƠNG VIII. BIỆN PH"}, {"stem": "Cách cứu nạn nhân bị điện giật ở trạng thái tắt thở?", "opts": {"A": "Để nạn nhân ra chỗ thoáng khí yên tĩnh chăm sóc cho hồi tỉnh. Sau đó mời y, bác sỹ hoặc nhẹ nhàng đưa đến cơ quan y tế gần nhất để theo dõi chăm sóc.", "B": "Đặt nạn nhân nơi thoáng khí, yên tĩnh, nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm nạn nhân ra, cho nạn nhân ngửi amôniắc hoặc nước tiểu, ma sát toàn thân cho nóng lên và cho người đi mời y, bác sỹ đến để chăm sóc.", "C": "Đưa nạn nhân ra chỗ thoáng khí, nới rộng quần, áo, thắt lưng, moi rớt rãi trong mồm và kéo lưỡi (nếu lưỡi thụt vào). Tiến hành làm hô hấp nhân tạo, hà hơi thổi ngạt ngay, phải làm liên tục, kiên trì cho đến khi có ý kiến của y, bác sỹ quyết định mới thôi.", "D": "Đáp án A, B đúng."}, "ans": "C", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, khi có rào chắn tạm thời, khoảng cách ATĐ từ rào chắn đến phần có điện từ trên 01 đến 15 kV xoay chiều không nhỏ hơn bao nhiêu?", "opts": {"A": "0,35 m", "B": "0,60 m", "C": "0,70 m", "D": "1,00 m"}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, đơn vị quản lý vận hành và đơn vị công tác phải phối hợp thực hiện hành động nào trước khi tiến hành bàn giao và tiếp nhận hiện trường?", "opts": {"A": "Phối hợp xác định ranh giới vùng làm việc an toàn.", "B": "Tổ chức diễn tập phương án thoát nạn khi xảy ra tai nạn lao động.", "C": "Tiến hành đo kiểm tra hàm lượng khí độc trong các mương cáp ngầm.", "D": "Thống nhất sơ đồ đấu nối nguồn điện thi công tạm thời tại tủ phân phối."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, tại trạm hoặc nhà máy điện, sau khi nhân viên vận hành thực hiện xong thao tác làm nối đất thì bắt buộc phải treo biển báo mang nội dung gì tại vị trí nối đất?", "opts": {"A": "“Đã nối đất”.", "B": "“Cấm đóng điện! Có người đang làm việc”.", "C": "“Làm việc tại đây”.", "D": "“Dừng lại! Có điện nguy hiểm chết người”."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, ai phải đánh giá sơ bộ tình trạng sức khoẻ của người chuẩn bị làm việc trên cao?", "opts": {"A": "Người cấp phiếu hoặc Người cho phép thực hiện việc kiểm tra.", "B": "Cơ quan y tế có thẩm quyền khám và cấp chứng nhận định kỳ.", "C": "Người CHTT phải đánh giá sơ bộ tình trạng sức khoẻ của người chuẩn bị làm việc trên cao, nếu bình thường mới được phép làm việc.", "D": "Cán bộ an toàn của Đơn vị công tác và Đơn vị QLVH."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời điểm thực hiện thao tác nối đất (cố định, di động) tại nơi làm việc có cắt điện được quy định khi nào?", "opts": {"A": "Thực hiện khi tiến hành thao tác cắt điện cách ly thiết bị khỏi nguồn.", "B": "Sau khi Người người giám sát thao tác và người thao tác kết thúc thao tác.", "C": "Phải nối đất (cố định, di động) ngay sau khi kết thúc thao tác.", "D": "Phải nối đất (cố định, di động) ngay sau khi kiểm tra không còn điện."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, quy định về việc kiêm nhiệm khi thực hiện PCT đối với công việc có mức độ rủi ro từ cấp 4 trở lên theo Danh mục công việc là gì?", "opts": {"A": "Cho phép Người cấp phiếu kiêm nhiệm Người cho phép.", "B": "Cho phép Người cấp lệnh kiêm nhiệm Người CHTT.", "C": "Không cho phép kiêm nhiệm.", "D": "Cho phép Người CHTT kiêm nhiệm vai trò Người CG."}, "ans": "C", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi vào trạm điện làm việc, những người vào trạm lần đầu tiên (tham quan, nghiên cứu) bắt buộc phải đáp ứng yêu cầu nào?", "opts": {"A": "Phải có bài viết và vấn đáp trực tiếp kiểm tra đạt yêu cầu.", "B": "Phải tuân thủ nội quy của trạm, những người vào lần đầu phải được hướng dẫn tỉ mỉ.", "C": "Phải mang phương tiện bảo vệ cá nhân chống hồ quang và đứng cách thiết bị 3 m.", "D": "Phải sử dụng dụng cụ cách điện có tay cầm chắc chắn và đi giày."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, biện pháp tổ chức chung để đảm bảo an toàn khi làm việc ở ĐD, TBĐ bao gồm những nội dung nào?", "opts": {"A": "Khảo sát, lập biên bản hiện trường; lập biện pháp an toàn trong phương án thi công; Đăng ký công tác; Làm việc theo PCT hoặc LCT; Cho phép làm việc tại hiện trường; Giám sát an toàn trong thời gian làm việc; Những biện pháp tổ chức khác.", "B": "Chỉ bao gồm Khảo sát, lập biên bản hiện trường và lập biện pháp an toàn trong phương án thi công.", "C": "Chỉ bao gồm Đăng ký công tác và Làm việc theo Phiếu công tác hoặc Lệnh công tác.", "D": "Biện pháp kỹ thuật chung; Kiểm tra không còn điện; Đặt nối đất; Treo biển báo, tín hiệu."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải bảo đảm giới hạn nào?", "opts": {"A": "Hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải ít hơn 10% của giới hạn nổ dưới (Lower Explosive Limit) của khí dễ cháy.", "B": "Hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải ít hơn 15% của giới hạn nổ dưới (Lower Explosive Limit) của khí dễ cháy.", "C": "Hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải ít hơn 20% của giới hạn nổ dưới (Lower Explosive Limit) của khí dễ cháy.", "D": "Hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải ít hơn 25% của giới hạn nổ dưới (Lower Explosive Limit) của khí dễ cháy."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, Người CHTT có trách nhiệm kiểm tra nội dung nào sau đây?", "opts": {"A": "Kiểm tra sơ bộ sức khỏe nhân viên đơn vị công tác, phương tiện sơ cứu thiết yếu.", "B": "Kiểm tra việc thực hiện đầy đủ các biện pháp kỹ thuật an toàn điện thuộc trách nhiệm của Người cho phép.", "C": "Kiểm tra và ký/xác nhận điện tử hoàn thành phiếu công tác/lệnh công tác sau khi nhận lại.", "D": "Kiểm tra việc gán nhãn, treo thẻ đánh dấu trên sơ đồ vận hành của bộ phận trực ca."}, "ans": "A", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị NGHIÊM CẤM trực tiếp trên vỏ máy phát, máy bù, máy điện phân hoặc trên ống dẫn của hệ thống dầu khí có chứa Hydro?", "opts": {"A": "Tiến hành bảo dưỡng chổi than hoặc mài nhẵn vành của rotor khi máy đang quay.", "B": "Tháo tất cả các ống nối giữa thiết bị đang làm việc với đường ống của thiết bị sửa chữa.", "C": "Cấm làm công việc có lửa hoặc phát sinh tia lửa trực tiếp trên vỏ máy hoặc trên ống dẫn có chứa Hydro.", "D": "Đo giá trị của điện áp dư và xác định thứ tự các pha."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, trường hợp nào cần có Người GSAT?", "opts": {"A": "Công việc thực hiện có thể gây nguy hiểm cho cộng đồng.", "B": "Biển báo, rào chắn, căng dây hoặc các biện pháp khác chưa đủ bảo đảm an toàn cho cộng đồng.", "C": "Nhiều vị trí công tác với nhiều Đơn vị công tác cùng thực hiện.", "D": "Người CHTT không đủ khả năng, cần người hỗ trợ giám sát an toàn Đơn vị công tác."}, "ans": "D", "chuong": "CHƯƠNG VI. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, khi xảy ra tai nạn, mọi nhân viên đơn vị công tác phải thực hiện trách nhiệm gì đầu tiên?", "opts": {"A": "Tìm cách sơ cứu, cấp cứu người bị nạn và đồng thời báo ngay cho cơ sở y tế gần nhất.", "B": "Giữ nguyên hiện trường và đợi Người chỉ huy trực tiếp đến lập biên bản.", "C": "Điện thoại báo cáo trực tiếp cho Tổng giám đốc hoặc Phó Tổng giám đốc đơn vị.", "D": "Thu dọn ngay toàn bộ dụng cụ thi công và tháo rào chắn để xe cấp cứu vào."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Ba biện pháp cơ bản về mặt chiến thuật trong công tác chữa cháy là gì?", "opts": {"A": "Huy động phương tiện, làm ngạt đám cháy và dùng hóa chất làm lạnh.", "B": "Ngăn cách oxy, làm loãng nồng độ chất cháy và phun nước áp lực cao.", "C": "Huy động nhanh nhất lực lượng phương tiện; tập trung cứu người, cứu tài sản, chống cháy lan và thống nhất chỉ huy điều hành.", "D": "Di tản người bị nạn, di chuyển tài sản và khóa các van chặn hệ thống."}, "ans": "C", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị cấm đối với việc bốc xếp kiện hàng của xe nâng hàng?", "opts": {"A": "Phân bộ trọng lượng của hàng hóa đều trên hai càng nâng của xe.", "B": "Cấm nâng các kiện hàng phía dưới không có kẽ hở cần thiết để đưa càng nâng vào lấy hàng, xếp hàng lên đống không có tấm kê để rút càng ra.", "C": "Nhấc bổng hàng lên rồi mới di chuyển khi xe nâng hàng có lắp thêm cần.", "D": "Di chuyển xe nâng khi khung xe đã nghiêng hết về phía sau."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, phương pháp nối dây nối đất vào thiết bị, kết cấu kim loại trong vùng điện từ trường cao được quy định như thế nào?", "opts": {"A": "Cho phép vặn xoắn chặt nhiều vòng quanh thân kết cấu kim loại.", "B": "Phải bọc băng dính cách điện kín mối nối sau khi dùng kìm kẹp chặt.", "C": "Phải hàn trực tiếp đầu dây vào điểm hở trên vỏ thiết bị đóng cắt kiểu kín.", "D": "Nối dây nối đất vào thiết bị, kết cấu phải bằng bu lông hàn hay kẹp nối dây."}, "ans": "D", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, trường hợp Đơn vị công tác là đơn vị trực thuộc Đơn vị QLVH thì quy định về thủ tục đăng ký công tác như thế nào?", "opts": {"A": "Bắt buộc phải thực hiện thủ tục đăng ký theo đúng mẫu giấy hoặc điện tử gửi đến Đơn vị QLVH.", "B": "Cho phép thực hiện đăng ký công tác theo quy định nội bộ của đơn vị.", "C": "Phải thông báo bằng lời nói trực tiếp cho Trưởng ca vận hành trước 7 ngày.", "D": "Chỉ cần ghi nội dung công việc vào phần mềm quản lý PCT/LCT trực tuyến."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Khi phát hiện đám cháy tại mặt bằng Công ty, quy trình xử lý nào dưới đây là đúng trình tự kỹ thuật?(Biết quy ước: 1- Chữa cháy tại chỗ; 2- Báo Cảnh sát PCCC; 3- Báo động; 4- Báo đội PCCC Công ty; 5- Cắt điện khu vực cháy)", "opts": {"A": "2 - 4 - 1 - 5 - 3", "B": "1 - 3 - 5 - 4 - 2", "C": "3 - 1 - 2 - 4 - 5", "D": "3 - 5 - 1 - 4 - 2"}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo Quy trình an toàn, trước lúc đóng cửa bình chứa (hệ thống khí nén hoặc dầu áp lực), Người CHTT và Người cho phép phải thực hiện việc kiểm tra gì?", "opts": {"A": "Kiểm tra xem áp lực trong bình chứa đã tăng đột ngột lên đến giá trị 0,5 MPa hay chưa.", "B": "Trước lúc đóng cửa bình chứa, Người cho phép kiểm tra lại không còn vật liệu, dụng cụ, người và các vật lạ khác trong bình chứa.", "C": "Trước lúc đóng cửa bình chứa, Người CHTT kiểm tra lại không còn vật liệu, dụng cụ, người và các vật lạ khác trong bình chứa.", "D": "Trước lúc đóng cửa bình chứa, Người CHTT và Người cho phép kiểm tra lại không còn vật liệu, dụng cụ, người và các vật lạ khác trong bình chứa."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, Lệnh công tác (LCT) là lệnh cho phép thực hiện công việc có mức rủi ro như thế nào theo Danh mục công việc?", "opts": {"A": "Có mức rủi ro từ cấp 3 trở lên theo Danh mục công việc.", "B": "Có mức rủi ro đến cấp 2 theo Danh mục công việc.", "C": "Có mức rủi ro từ cấp 4 trở lên theo Danh mục công việc.", "D": "Không có quy định về mức độ rủi ro theo Danh mục công việc."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, việc kiểm tra không còn điện phải được thực hiện bằng công cụ nào và tại những vị trí nào?", "opts": {"A": "Bằng bút thử điện hạ áp và phải thử ở tất cả các pha và các phía của TBĐ.", "B": "Bằng thiết bị thử điện chuyên dùng phù hợp với điện áp danh định của thiết bị cần thử như bút thử điện, còi thử điện; Phải thử ở tất cả các pha và các phía của TBĐ.", "C": "Bằng bút thử điện cao áp và phải thử ở tất cả các pha và các phía của TBĐ.", "D": "Dùng đồng hồ vạn năng thông thường đo điện áp tại các điểm đấu nối."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, người đăng ký công tác đối với trường hợp xử lý sự cố là ai?", "opts": {"A": "Tổng giám đốc/Phó Tổng giám đốc Công ty hoặc Kỹ thuật viên an toàn.", "B": "Nhân viên vận hành ca trực có chức danh Trưởng ca hoặc Trưởng kíp.", "C": "Quản đốc/Phó quản đốc phân xưởng sửa chữa, Trưởng/Phó tổ/đội sửa chữa hoặc người được giao nhiệm vụ.", "D": "Kỹ thuật viên phân xưởng sửa chữa hoặc người được giao nhiệm vụ."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, hình thức đăng ký công tác đối với công tác ngoài kế hoạch, xử lý sự cố bao gồm những hình thức nào?", "opts": {"A": "Chỉ được đăng ký bằng hình thức văn bản giấy có ký tên đóng dấu.", "B": "Chỉ được đăng ký bằng hình thức điện tử trên phần mềm quản lý của Công ty.", "C": "Giấy hoặc điện tử hoặc lời nói (trực tiếp hoặc qua điện thoại, bộ đàm).", "D": "Bằng văn bản gửi qua fax hoặc thư điện tử chính thức của đơn vị."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, các thiết bị đóng cắt của ĐD, TBĐ có bố trí công tác cắt điện phải được xử lý như thế nào để tránh thao tác nhầm?", "opts": {"A": "Phải được khóa (lock) hoặc kéo ra khỏi vị trí vận hành để tránh thao tác nhầm.", "B": "Phải được ngắt hoàn toàn mạch nguồn nhất thứ, nhị thứ tại trung tâm điều khiển.", "C": "Phải được bố trí cố định 01 Nhân viên vận hành túc trực tại vị trí.", "D": "Phải được cắt điện và tháo mạch nhất thứ."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, việc dỡ bỏ tạm thời nối đất di động cảm ứng để thực hiện các công việc cần thiết của Đơn vị công tác được thực hiện theo lệnh của ai?", "opts": {"A": "Theo lệnh của Người cho phép làm việc tại hiện trường.", "B": "Chỉ được thực hiện theo lệnh của Người cho phép (tiếp địa ngắn mạch) / Người LĐCT (tiếp địa cảm ứng) và phải được thực hiện nối đất lại ngay sau khi kết thúc công việc đó.", "C": "Theo lệnh của Người cấp phiếu công tác.", "D": "Chỉ được thực hiện theo lệnh của Người cho phép (tiếp địa ngắn mạch) / Người CHTT (tiếp địa cảm ứng) và phải được thực hiện nối đất lại ngay sau khi kết thúc công việc đó."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nội dung nào sau đây thuộc việc nhận diện mối nguy khi làm việc trên cao?", "opts": {"A": "Vật nặng rơi, va đập trong a vào PCT/LCT.", "C": "Phải được đưa vào Biên bản bàn giao hiện trường nơi làm việc.", "D": "Phải được đưa vào văn bản đăng ký cắt điện."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, chiều rộng chân thang di động (bằng tre, gỗ, kim loại) ít nhất phải đạt bao nhiêu?", "opts": {"A": "Ít nhất là 30 cm.", "B": "Ít nhất là 45 cm.", "C": "Ít nhất là 50 cm.", "D": "Ít nhất là 60 cm."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, thời gian công tác tối đa của Phiếu công tác (PCT) là bao lâu?", "opts": {"A": "Không quá 30 ngày.", "B": "Không quá 45 ngày.", "C": "Không quá 60 ngày.", "D": "Không quá 90 ngày."}, "ans": "C", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, điều kiện năng lực đối với người thực hiện mở cửa lưới kiểm tra thiết bị điện đang vận hành trong trạm điện là gì?", "opts": {"A": "Do người có bậc 2 ATĐ trở lên và phải quan sát kỹ phần mang điện để đảm bảo khoảng cách an toàn.", "B": "Do người có bậc 3 ATĐ trở lên và phải quan sát kỹ phần mang điện để đảm bảo khoảng cách an toàn.", "C": "Do người có bậc 4 ATĐ trở lên và phải quan sát kỹ phần mang điện để đảm bảo khoảng cách an toàn.", "D": "Do người có bậc 5 ATĐ trở lên và phải quan sát kỹ phần mang điện để đảm bảo khoảng cách an toàn."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, chức danh nào sau đây cho phép kiêm nhiệm khi thực hiện Phiếu công tác?", "opts": {"A": "Người chỉ huy trực tiếp kiêm Người cho phép làm việc tại hiện trường.", "B": "Người cấp phiếu kiêm Người cho phép.", "C": "Người lãnh đạo công việc kiêm Người giám sát an toàn điện của đơn vị công tác.", "D": "Nhân viên đơn vị công tác kiêm Người cảnh giới bảo đảm an toàn cộng đồng."}, "ans": "B", "chuong": "CHƯƠNG III. BIỆN PHÁ"}], "ĐỀ 10": [{"stem": "Nội dung kiểm tra định kỳ đối với cuộn vòi chữa cháy vách tường bao gồm những gì?", "opts": {"A": "Đo chiều dài của vòi; hằng tháng tiến hành sơn lại toàn bộ thân
