 "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nguyên tắc chung đầu tiên về an toàn đối với mọi công việc là gì?", "opts": {"A": "Phải có Phiếu công tác được phê duyệt trước 24 giờ.", "B": "Phải được đánh giá rủi ro về an toàn cho chính công việc đó và đề ra biện pháp phòng ngừa tai nạn", "C": "Phải do người có bậc 4 an toàn điện chỉ huy.", "D": "Phải dừng lại khi thời tiết có giông sét, mưa to"}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, các công việc cho phép làm việc khi thiết bị điện trên 01 kV vẫn có điện chỉ được tiến hành khi đáp ứng điều kiện về vị trí của các bộ phận mang điện như thế nào?", "opts": {"A": "Chỉ được tiến hành khi các bộ phận mang điện ở phía sau lưng hoặc ở dưới chân người làm việc.", "B": "Chỉ được tiến hành khi các bộ phận mang điện ở phía trước mặt hay ở phía trên đầu, người làm việc phải đứng trên nền nhà hoặc giá đỡ chắc chắn, cấm người làm việc đứng lom khom.", "C": "Chỉ được tiến hành khi các bộ phận mang điện đã được bọc một lớp vỏ nhựa cách điện kín.", "D": "Chỉ được tiến hành ngoài ranh giới vùng làm việc an toàn và cách rào chắn tạm thời dưới 0,35 m."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo QCVN thì định kỳ việc huấn luyện và kiểm tra QTATĐ cho các đối tượng trong diện phải huấn luyện QTATĐ được quy định như thế nào?", "opts": {"A": "02 năm/1 lần.", "B": "01 năm/1 lần.", "C": "6 tháng/1 lần.", "D": "3 tháng/1 lần."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, việc bảo quản dây đeo an toàn sau khi làm xong được quy định như thế nào?", "opts": {"A": "Phải cuộn lại và để ở những nơi ẩm thấp dưới đất để tránh nhiệt độ cao gây hỏng dây.", "B": "Phải bảo quản tốt dây đeo an toàn, làm xong phải cuộn lại gọn gàng, không để chỗ ẩm thấp mà phải treo lên hoặc để chỗ cao, khô ráo, sạch sẽ.", "C": "Giao lại trực tiếp cho Nhân viên vận hành đương ca cất giữ trong tủ đồ nghề theo quy định.", "D": "Không có quy định cụ thể."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, yêu cầu đối với người điều khiển, người buộc móc tải và đánh tín hiệu thiết bị nâng là gì?", "opts": {"A": "Được phép bố trí những người biết điều khiển thiết bị nâng; Những người buộc móc tải, đánh tín hiệu cũng phải được đào tạo kỹ năng cần thiết.", "B": "Chỉ được phép bố trí những người điều khiển thiết bị nâng đã được đào tạo và được cấp chứng chỉ. Những người buộc móc tải, đánh tín hiệu cũng phải được đào tạo kỹ năng cần thiết.", "C": "Cho phép bố trí bất kỳ người nào trong nhóm công tác để thực hiện nhiệm vụ.", "D": "Phải là thợ lặn đã qua đào tạo chuyên môn và làm việc theo Phiếu công tác."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, khi nhận thấy nguy hiểm hoặc thiếu an toàn, nhân viên đơn vị công tác được phép thực hiện hành động nào?", "opts": {"A": "Tiếp tục làm việc và tự ý bổ sung thêm các biện pháp an toàn di động tại vị trí.", "B": "Phải cố gắng hoàn thành xong phần việc được giao rồi mới rời hiện trường.", "C": "Được phép ngừng ngay công việc và báo cáo người có trách nhiệm.", "D": "Thảo luận với các nhân viên khác trong đội để tự thay đổi phương án thi công."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Trong thực hành cấp cứu hồi sinh tổng hợp việc phối  hợp giữa ấn tim ngoài nồng ngực và hô hấp nhân tạo thực hiện theo chu kỳ như thế nào là đúng?", "opts": {"A": "Cứ 30 lần ấn tim thì hô hấp nhân tạo 1 lần.", "B": "Cứ 15 lần ấn tim thì hô hấp nhân tạo 1 lần.", "C": "Cứ 30 lần ấn tim thì hô hấp nhân tạo 2 lần.", "D": "Cứ 5 lần ấn tim thì hô hấp nhân tạo 1 lần."}, "ans": "C", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Nghị định 62/2025/NĐ-CP thì thời gian để huấn luyện an toàn điện lại (khi có sự thay đổi vị trí công việc) ít nhất là bao nhiêu?", "opts": {"A": "Thời gian huấn luyện ít nhất 8 giờ.", "B": "Thời gian huấn luyện ít nhất 12 giờ.", "C": "Thời gian huấn luyện ít nhất 16 giờ.", "D": "Thời gian huấn luyện ít nhất 24 giờ."}, "ans": "A", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, sau khi tách ra khỏi vận hành để xử lý sự cố bất thường, máy cắt chân không phải thực hiện các bước kiểm tra, thí nghiệm nào trước khi đưa vào vận hành?", "opts": {"A": "Phải được thí nghiệm đạt tiêu chuẩn và dán tem dán kiểm định chất lượng của nhà chế tạo.", "B": "Phải được thí nghiệm đủ tiêu chuẩn vận hành trước khi đưa vào vận hành, nếu là máy cắt chân không thì phải kiểm tra cách điện của chân không.", "C": "Phải được thí nghiệm đo điện trở cách điện và điện trở tiếp xúc.", "D": "Phải được thí nghiệm theo quy trình vận hành trước khi đưa vào vận hành, nếu là máy cắt chân không thì phải kiểm tra cách điện của chân không."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trách nhiệm đề ra các biện pháp an toàn lao động, tổ chức kiểm tra và giám sát thực hiện các biện pháp an toàn tại các công trường, phân xưởng thuộc về ai?", "opts": {"A": "Người trực tiếp thực hiện công việc và Nhân viên an toàn chuyên trách.", "B": "Tổng Giám đốc, Phó Tổng giám đốc đơn vị trực tiếp sử dụng lao động; Người quản lý, điều hành trực tiếp các công trường, phân xưởng hoặc bộ phận tương đương.", "C": "Phòng Kỹ thuật và An toàn của Công ty.", "D": "Trưởng đoàn kiểm tra an toàn của Tổng công ty Phát điện 1."}, "ans": "B", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, việc đặt và tháo nối đất phải do mấy người thực hiện và yêu cầu về bậc an toàn điện như thế nào?", "opts": {"A": "Do 01 người thực hiện độc lập nếu người đó có bậc an toàn điện từ bậc 4 trở lên.", "B": "Đặt và tháo nối đất do 02 người thực hiện, 01 người giám sát và 01 người thao tác, trong đó người giám sát phải có bậc ATĐ từ bậc 3 trở lên, người thao tác phải có bậc ATĐ từ bậc 3 trở lên.", "C": "Do 02 người thực hiện, trong đó cả hai người đều bắt buộc phải đạt bậc 4 an toàn điện tuyệt đối.", "D": "Đặt và tháo nối đất do 02 người thực hiện, 01 người giám sát và 01 người thao tác, trong đó người giám sát phải có bậc ATĐ từ bậc 4 trở lên, người thao tác phải có bậc ATĐ từ bậc 3 trở lên."}, "ans": "D", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, trình tự các bước thực hiện khi ĐẶT nối đất được quy định cụ thể như thế nào?", "opts": {"A": "Không có quy định.", "B": "Khi đặt nối đất phải lắp một đầu dây nối đất với đất trước, sau đó lắp đầu còn lại vào ĐD, TBĐ.", "C": "Tiến hành lắp đồng thời cả hai đầu dây nối đất vào vị trí hiện trường cùng một lúc.", "D": "Khi đặt nối đất phải lắp một đầu dây nối đất với ĐD, TBĐ trước, sau đó lắp đầu còn lại vào đất."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, nếu xảy ra tai nạn do dây đeo an toàn bị đứt, gẫy móc hoặc do không thử đúng kỳ hạn thì ai phải chịu hoàn toàn trách nhiệm?", "opts": {"A": "Người cho phép và Nhân viên vận hành ca trực có chức danh Trưởng ca.", "B": "Người cấp phiếu thuộc Đơn vị QLVH giao nhiệm vụ cấp PCT.", "C": "Đơn vị công tác phải chịu hoàn toàn trách nhiệm.", "D": "Đơn vị QLVH phải chịu hoàn toàn trách nhiệm."}, "ans": "C", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị cấm liên quan đến dây xích của pa lăng kéo tay?", "opts": {"A": "Thay thế bằng xích mới chính hãng khi dây xích cũ bị mòn quá giá trị cho phép.", "B": "Cuộn dây xích gọn gàng cất giữ trong tủ đồ nghề riêng sau khi kết thúc công việc.", "C": "Sử dụng tay kéo xích điều khiển (xích nhỏ) để pa lăng hoạt động từ từ.", "D": "Không được để dây xích bị xoắn hay thắt nút, không hoạt động pa lăng khi chốt móc bị hỏng. Không hàn dây xích khi bị đứt mà phải thay thế bằng xích mới. Không dùng xích của pa lăng để quàng vào vật cần nâng."}, "ans": "D", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, sau khi PCT đã có chữ ký/xác nhận điện tử của Người cho phép, Người chỉ huy trực tiếp có quyền hạn gì?", "opts": {"A": "Được quyền chỉ huy điều hành Nhân viên đơn vị công tác thực hiện các công việc trong phạm vi cho phép làm việc theo PCT.", "B": "Được quyền yêu cầu Đơn vị điều độ phân phối khôi phục lại đường dây, thiết bị điện.", "C": "Được quyền dịch chuyển, dỡ bỏ rào chắn, biển báo xác định vùng làm việc an toàn của Đơn vị QLVH.", "D": "Được quyền chỉ huy điều hành Nhân viên đơn vị công tác thực hiện các công việc trong phạm vi cho phép làm việc theo PCT, bao gồm việc thực hiện các thủ tục, biện pháp an toàn nơi làm việc thuộc trách nhiệm của Đơn vị công tác."}, "ans": "D", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, khi có Đơn vị công tác đến làm việc tại trạm điện hoặc nhà máy điện không người trực thì biện pháp an toàn được tổ chức như thế nào?", "opts": {"A": "Cho phép thực hiện công việc theo mệnh lệnh mà không cần làm biện pháp an toàn.", "B": "Chỉ cần nhân viên trực thao tác lưu động đến đánh dấu xác nhận đã kiểm tra.", "C": "Phải thực hiện như đối với trường hợp có người trực.", "D": "Nghiêm cấm tuyệt đối việc đóng điện vào mạch thao tác khi chưa khóa phiếu công tác."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Theo Quy trình an toàn, Đơn vị QLVH giải quyết đăng ký công tác thông qua các hình thức nào?", "opts": {"A": "Kiểm tra, thực hiện các biện pháp an toàn theo PCT/LCT và bàn giao hiện trường.", "B": "Cấp PCT/LCT hoặc thông báo hoãn, hủy, thay đổi thời gian công tác.", "C": "Thao tác cách ly thiết bị để bảo đảm an toàn theo yêu cầu của công tác.", "D": "Khẳng định lại các biện pháp an toàn thông qua việc giao lại PCT/LCT giấy, điện thoại."}, "ans": "B", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Ký hiệu bình chữa cháy bột \"MFZL4\" cho biết đây chính xác là loại bình gì?", "opts": {"A": "Bình chữa cháy khí CO2 có trọng lượng khí nén bên trong là 4kg.", "B": "Bình chữa cháy bọt Foam sinh học có dung tích chứa 4 lít.", "C": "Bình chữa cháy tự động bằng khí sạch có tổng trọng lượng nặng 4kg.", "D": "Bình chữa cháy sử dụng bột khô đa năng ABC có trọng lượng bột bên trong là 4kg."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Theo thống kê, nếu bị tai nạn điện giật mà được cấp cứu kịp thời và đúng phương pháp trong thời gian 4 phút đầu tiên thì tỉ lệ nạn nhân được cứu sống là bao nhiêu?", "opts": {"A": "0.7", "B": "0.5", "C": "0.25", "D": "0.1"}, "ans": "B", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, Đơn vị sử dụng thiết bị nâng nghiêm cấm điều gì liên quan đến chứng nhận kiểm định?", "opts": {"A": "Không được sử dụng thiết bị nâng và các bộ phận mang tải khi chưa qua kiểm tra, thử nghiệm và chưa được cấp giấy chứng nhận kiểm định an toàn.", "B": "Không được sử dụng thiết bị nâng khi chưa có biên bản nghiệm thu.", "C": "Cấm sử dụng thiết bị nâng khi chưa có giấy chứng nhận đủ điều kiện phòng cháy chữa cháy.", "D": "Đơn vị sử dụng thiết bị nâng được phép sử dụng những thiết bị nâng của mình."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, đường dây và thiết bị điện chưa được nối đất (tiếp đất hoặc tiếp địa) thì phải coi như thế nào?", "opts": {"A": "Coi như đã được cô lập an toàn hoàn toàn khỏi nguồn điện.", "B": "Coi như không có điện cảm ứng tĩnh điện xuất hiện trên đó.", "C": "ĐD, TBĐ chưa được nối đất (tiếp đất hoặc tiếp địa) coi như đang có điện.", "D": "ĐD, TBĐ chưa được nối đất (tiếp đất hoặc tiếp địa) coi như đang làm việc."}, "ans": "C", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, tỷ lệ thành phần của H2 và không khí dễ gây cháy nổ là?", "opts": {"A": "Hỗn hợp H2 và không khí có chứa H2 từ 3,3% đến 81,5%.", "B": "Hỗn hợp H2 và không khí có chứa H2 từ 2,63% đến 81,5%.", "C": "Hỗn hợp H2 và không khí có chứa H2 từ 3,3% đến 95%.", "D": "Hỗn hợp H2 và không khí có chứa H2 từ 2,63% đến 95%."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, quy định đối với người không phận sự và việc nâng người bằng thiết bị nâng tải là gì?", "opts": {"A": "Cho phép người không phận sự đi lại trong hành lang an toàn nếu có người hướng dẫn.", "B": "Cấm người không phận sự đi trong hành lang an toàn thiết bị đang hoạt động. Cấm sử dụng thiết bị nâng tải để nâng người.", "C": "Cho phép sử dụng thiết bị nâng tải để nâng người lên cao trong trường hợp sửa chữa nóng.", "D": "Người không phận sự được đi vào vùng nguy hiểm nếu đứng cách tâm đường di chuyển ít nhất 5 mét."}, "ans": "B", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, dây nối đất cảm ứng (chống điện áp cảm ứng) phải chịu được dòng điện do điện áp cảm ứng sinh ra và có tiết diện không được nhỏ hơn bao nhiêu?", "opts": {"A": "Tiết diện không được nhỏ hơn 10 mm².", "B": "Tiết diện không được nhỏ hơn 16 mm².", "C": "Tiết diện không được nhỏ hơn 25 mm².", "D": "Tiết diện không được nhỏ hơn 35 mm²."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, mẫu Phương án thi công tham khảo mẫu Phương án/Biện pháp thi công được ban hành theo văn bản quy phạm pháp luật nào?", "opts": {"A": "Văn bản quy phạm pháp luật về an toàn, vệ sinh lao động.", "B": "Văn bản quy phạm pháp luật về điện lực.", "C": "Văn bản quy phạm pháp luật về xây dựng.", "D": "Văn bản quy phạm pháp luật về phòng cháy và chữa cháy."}, "ans": "C", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, sau khi tiếp nhận đăng ký công tác, Đơn vị QLVH phải thực hiện hành động nào tiếp theo?", "opts": {"A": "Lập kế hoạch để kết hợp công tác và đăng ký cắt điện với Cấp điều độ có quyền điều khiển theo quy định; thông báo và gửi lịch cắt điện cho Đơn vị công tác để triển khai công việc khi đăng ký cắt điện đã được phê duyệt.", "B": "Lập kế hoạch và thông báo và gửi lịch cắt điện cho Đơn vị công tác để triển khai công việc khi đăng ký cắt điện đã được phê duyệt.", "C": "Lập kế hoạch và thông báo và gửi lịch cắt điện cho Đơn vị QLVH để triển khai công việc khi đăng ký cắt điện đã được phê duyệt.", "D": "Ra lệnh công tác bằng lời nói cho Người chỉ huy trực tiếp tiến hành khảo sát."}, "ans": "A", "chuong": "CHƯƠNG III. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, tốc độ giới hạn của xe nâng hàng khi chạy trong phạm vi công trường quy định là bao nhiêu?", "opts": {"A": "Chạy với tốc độ ≤ 10km/h.", "B": "Chạy với tốc độ ≤ 6km/h.", "C": "Chạy với tốc độ ≤ 5km/h.", "D": "Chạy với tốc độ ≤ 15km/h."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, chỉ được dùng ampe kìm để đo dòng điện ở những thiết bị điện thuộc cấp điện áp nào?", "opts": {"A": "Chỉ được dùng ampe kìm để đo dòng điện ở TBĐ từ 110 kV trở lên.", "B": "Chỉ được dùng ampe kìm để đo dòng điện ở TBĐ từ 220 kV trở lên.", "C": "Chỉ được dùng ampe kìm để đo dòng điện ở TBĐ trung/hạ áp.", "D": "Được phép đo ở mọi cấp điện áp nếu ampe kìm có màn hình hiển thị số tự động."}, "ans": "C", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Câu 52: Theo Quy trình an toàn, khi đặt và tháo nối đất di động trên lưới điện trên 01 kV, Nhân viên đơn vị công tác bắt buộc phải sử dụng dụng cụ gì?", "opts": {"A": "Phải đeo găng tay vải bảo hộ và đứng trên thảm cách điện cao su.", "B": "Nhân viên đơn vị công tác phải sử dụng sào và găng tay cách điện phù hợp (theo hướng dẫn của nhà chế tạo).", "C": "Nhân viên đơn vị công tác phải sử ủng và găng tay cách điện phù hợp (theo hướng dẫn của nhà chế tạo).", "D": "Phải sử dụng đầy đủ PTBVCN."}, "ans": "B", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, quy định nào sau đây là đúng khi thực hiện công việc trên thiết bị đưa ra sửa chữa?", "opts": {"A": "Thiết bị phải ngừng vận hành và được cách ly khỏi hệ thống trước khi thực hiện công tác trên thiết bị đó. Cấm thực hiện công việc trên thiết bị khi thiết bị này chưa được cách ly khỏi dây chuyền sản xuất.", "B": "Người cho phép và Người CHTT chỉ kiểm tra sự phù hợp bằng cách mở các van xả đọng và xả khí.", "C": "Thiết bị đưa ra sửa chữa chỉ cần được cách ly bằng các van điện, van khí và giữ nguyên nguồn lực điều khiển.", "D": "Thiết bị sửa chữa chỉ cần xả hết môi chất mà không cần hạ nhiệt độ nếu thời gian làm việc rất ngắn."}, "ans": "A", "chuong": "CHƯƠNG VIII. BIỆN PH"}, {"stem": "Theo Quy trình an toàn, hành vi nào sau đây bị nghiêm cấm đối với người xung quanh khu vực thiết bị nâng đang hoạt động?", "opts": {"A": "Cấm người đứng dưới hoặc giữa tải và chướng ngại vật, bao gồm cả độ vươn của cần trục, trong bán kính quay hoặc văng của thiết bị nâng. Cấm nâng hạ tải trên thùng xe khi có người đang đứng trên thùng xe.", "B": "Cấm người đứng phía trước hoặc sườn của thiết bị nâng. Cấm nâng hạ tải trên thùng xe khi có người đang đứng trên thùng xe.", "C": "Cấm người lao động tự ý cuộn dây đeo an toàn gọn gàng treo lên chỗ cao sạch sẽ.", "D": "Cấm người ở gần chướng ngại vật, bao gồm cả độ vươn của cần trục, trong bán kính quay hoặc văng của thiết bị nâng. Cấm nâng hạ tải trên thùng xe khi có người đang đứng trên thùng xe."}, "ans": "A", "chuong": "CHƯƠNG IX. CHỈ DẪN B"}, {"stem": "Theo Quy trình an toàn, Đơn vị QLVH có trách nhiệm treo thẻ, gán nhãn hoặc hình thức phù hợp để đánh dấu từng Đơn vị công tác ở đâu?", "opts": {"A": "Tại bảng tin thông báo của phân xưởng sửa chữa.", "B": "Trên sơ đồ vận hành, phần mềm quản lý của bộ phận trực tiếp vận hành ĐD, TBĐ (nơi) tiến hành công việc.", "C": "Ở lối vào, ra của thiết bị điện lắp đặt ngoài trời.", "D": "Tại tủ/bảng điều khiển thiết bị đóng cắt mà từ đó đóng điện đến nơi làm việc."}, "ans": "B", "chuong": "CHƯƠNG II. TRÁCH NHI"}, {"stem": "Theo Quy trình an toàn, Đơn vị công tác làm gì tại bước thực hiện công tác để bắt đầu thực hiện công việc?", "opts": {"A": "Kiểm tra đầy đủ biện pháp an toàn theo PCT/LCT, bắt đầu thực hiện công việc.", "B": "Thao tác cách ly thiết bị để bảo đảm an toàn theo yêu cầu của công tác.", "C": "Nhận PCT, tiếp nhận sự điều hành, chỉ dẫn của Người cấp phiếu.", "D": "Kiểm tra việc thao tác cách ly thiết bị ra khỏi vận hành và kiểm tra đầy đủ, đúng các biện pháp an toàn."}, "ans": "A", "chuong": "CHƯƠNG VII. BIỆN PHÁ"}, {"stem": "Theo Quy trình an toàn, người lao động có trách nhiệm gì đối với phương tiện bảo vệ cá nhân và dụng cụ an toàn?", "opts": {"A": "Phải tự bỏ chi phí để mua sắm và bảo dưỡng định kỳ.", "B": "Có quyền lựa chọn sử dụng hoặc không sử dụng tùy thuộc vào điều kiện thời tiết tại hiện trường", "C": "Phải bảo quản, kiểm tra, sử dụng đúng và đầy đủ các phương tiện bảo vệ cá nhân, dụng cụ an toàn phù hợp với công việc được giao.", "D": "Chỉ cần kiểm tra dụng cụ trước khi vào ca, việc bảo quản do kho phân xưởng chịu trách nhiệm."}, "ans": "C", "chuong": "CHƯƠNG I"}, {"stem": "Theo Quy trình an toàn, những công việc đặc thù nào sau đây được phép TẠM THỜI tháo gỡ dây nối đất trong thời gian tiến hành công tác?", "opts": {"A": "Đo, kiểm tra điện trở nối đất, đo các thông số của TBĐ, ĐD mà bắt buộc không được nối đất; Củng cố lại nối đất của ĐD, TBĐ hoặc của hệ thống nối đất toàn trạm.", "B": "Công việc vệ sinh công nghiệp hoặc thay thế sứ cách điện trên cột thép.", "C": "Thay thế các máy biến áp đo lường (TU, TI) hư hỏng tại ngăn tủ phân phối.", "D": "Đấu nối các lèo dây dẫn mới từ nhánh rẽ vào trục chính đường dây."}, "ans": "A", "chuong": "CHƯƠNG IV. BIỆN PHÁP"}, {"stem": "Theo Quy trình an toàn, các công việc cho phép làm việc khi thiết bị điện trên 01 kV vẫn có điện chỉ được tiến hành khi đáp ứng điều kiện về vị trí của các bộ phận mang điện như thế nào?", "opts": {"A": "Chỉ được tiến hành khi các bộ phận mang điện ở phía sau lưng hoặc ở dưới chân người làm việc.", "B": "Chỉ được tiến hành khi các bộ phận mang điện ở phía trước mặt hay ở phía trên đầu, người làm việc phải đứng trên nền nhà hoặc giá đỡ chắc chắn, cấm người làm việc đứng lom khom.", "C": "Chỉ được tiến hành khi các bộ phận mang điện đã được bọc một lớp vỏ nhựa cách điện kín.", "D": "Chỉ được tiến hành ngoài ranh giới vùng làm việc an toàn và cách rào chắn tạm thời dưới 0,35 m."}, "ans": "B", "chuong": "CHƯƠNG V. CHỈ DẪN BẢ"}, {"stem": "Thời gian kiểm tra định kỳ công tác PCCC đối với cấp đơn vị, phân xưởng sản xuất được quy định thế nào?", "opts": {"A": "Ít nhất 1 tháng 1 lần.", "B": "Ít nhất 3 tháng 1 lần.", "C": "Ít nhất 6 tháng 1 lần.", "D": "Ít "A": "Chỉ các cơ quan thông tin, truyền thông đại chúng.", "B": "Chỉ cơ quan công an địa phương.", "C": "Chỉ ban lãnh đạo các doanh nghiệp nhà nước.", "D": "Cơ quan thông tin truyền thông thường xuyên tổ chức rộng rãi; đồng thời cơ quan, tổ chức, hộ gia đình tổ chức giáo dục trong phạm vi quản lý của mình."}, "ans": "D", "chuong": "PHẦN 11. PHÒNG CHÁY "}, {"stem": "Những lưu ý trong thực hành cấp cứu hồi sinh tổng hợp là gì?", "opts": {"A": "Đối với một người cấp cứu nạn nhân ban đầu phải tuân thủ đúng trình tự 5 bước. Sau đó duy trì bước 3 rồi đến bước 5 theo nhịp 30/2 (nghĩa là cứ 30 lần ấn tim thì hô hấp nhân tạo 2 lần). Trong trường hợp có 2 người cấp cứu, sau khi tiến hành các bước 1, 2 thì một người thực hiện ấn tim ngay 30 lần, người thứ hai tiến hành bước 4, rồi bước 5. Sau đó duy trì chu kỳ: một người tiến hành bước 3, người còn lại tiến hành bước 5 theo nhịp 30/2.", "B": "Việc cấp cứu hồi sinh yêu cầu người cứu phải tranh thủ từng giây, khẩn trương tránh gián đoạn giữa các lần ấn tim hoặc hô hấp nhân tạo hoặc giữa ấn tim và hô hấp nhân tạo. Trong trường hợp chưa có điều kiện thuận lợi để ấn tim (nạn nhân còn đang ở trên cao hoặc dưới nước …) thì có thể vỗ vào vùng tim của nạn nhân 3 đến 5 cái nhằm kích thích tim đập trở lại. Mọi trường hợp cần phải nhanh chóng và phải ưu tiên cho việc ấn tim ngoài nồng ngực ngay.", "C": "Nhanh chóng gọi sực hỗ trợ của các bộ phận y tế (trung tâm cấp cứu 115, cơ sở y tế địa phương và y tế cơ quan…). Kiên trì cấp cứu nạn nhân và không vận chuyển nạn nhân khi nạn nhân chưa tự thở được hoặc chưa có ý kiến của nhân viên y tế.", "D": "Phải thực hiện tất cả các đáp án A, B và C."}, "ans": "D", "chuong": "PHẦN 10. SƠ CẤP CỨU "}, {"stem": "Theo Quy trình an toàn, việc xả hết môi chất, hạ nhiệt độ đối với những thiết bị đưa ra sửa chữa do ai chịu trách nhiệm xác định tùy theo điều kiện cụ thể và tính chất công việc?", "opts": {"A": "Người cấp phiếu và Người CHTT.", "B": "Người cấp phiếu và Người cho phép.", "C": "Người cho phép và Người CHTT chịu trách nhiệm.", "D": "Cán bộ an toàn của Đơn vị công tác và Đơn vị QLVH."}, "ans": "C", "chuong": "CHƯƠNG VIII. BIỆN PH"}]};

document.addEventListener('DOMContentLoaded', function(){
  const $ = id => document.getElementById(id);
  const sel = $('testSelect');
  let questions=[], answers=[], idx=0, endAt=0, timerInt=null;
  function show(id){['home','quiz','result'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==id);}); document.getElementById('nav').classList.toggle('hidden',id!=='quiz');}
  function start(){
    const testName=sel.value;
    if(!testName){alert('Vui lòng chọn mã đề'); return;}
    if(!DATA || !DATA[testName]){alert('Không tìm thấy đề '+testName); return;}
    questions=DATA[testName]; answers=Array(questions.length).fill(null); idx=0;
    endAt=Date.now()+45*60*1000; clearInterval(timerInt); timerInt=setInterval(tick,1000); tick(); render(); show('quiz'); window.scrollTo(0,0);
  }
  function tick(){let s=Math.max(0,Math.ceil((endAt-Date.now())/1000)); $('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); if(s===0){clearInterval(timerInt); finish(true)}}
  let audioCtx=null;
  function getAudioCtx(){
    if(!audioCtx){try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}}
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }
  function playCorrectSound(){
    const ctx=getAudioCtx(); if(!ctx) return;
    const now=ctx.currentTime;
    [0,0.12].forEach((d,i)=>{
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(i===0?680:960, now+d);
      o.frequency.exponentialRampToValueAtTime(i===0?880:1150, now+d+0.15);
      g.gain.setValueAtTime(0.22, now+d); g.gain.exponentialRampToValueAtTime(0.01, now+d+0.25);
      o.connect(g); g.connect(ctx.destination); o.start(now+d); o.stop(now+d+0.3);
    });
  }
  function playWrongSound(){
    const ctx=getAudioCtx(); if(!ctx) return;
    const now=ctx.currentTime;
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(180, now);
    o.frequency.linearRampToValueAtTime(110, now+0.35);
    g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now+0.4);
    o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now+0.45);
  }
  function playVictorySound(){
    const ctx=getAudioCtx(); if(!ctx) return;
    const now=ctx.currentTime;
    [523,659,784,1046].forEach((f,i)=>{
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0, now+i*0.15); g.gain.linearRampToValueAtTime(0.32, now+i*0.15+0.05); g.gain.exponentialRampToValueAtTime(0.01, now+i*0.15+0.6);
      o.connect(g); g.connect(ctx.destination); o.start(now+i*0.15); o.stop(now+i*0.15+0.7);
    });
  }
  function playFailSound(){
    const ctx=getAudioCtx(); if(!ctx) return;
    const now=ctx.currentTime;
    [280,200,150].forEach((f,i)=>{
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.25, now+i*0.25); g.gain.exponentialRampToValueAtTime(0.01, now+i*0.25+0.4);
      o.connect(g); g.connect(ctx.destination); o.start(now+i*0.25); o.stop(now+i*0.25+0.5);
    });
  }
  function render(){
    const old=document.getElementById('instantFeedback'); if(old) old.remove();
    const q=questions[idx];
    if(!q) return;
    $('qnum').textContent='Câu '+(idx+1);
    $('progressText').textContent=(idx+1)+'/'+questions.length;
    $('question').textContent=q.stem;
    $('options').innerHTML='';
    ['A','B','C','D'].forEach(l=>{
      const b=document.createElement('button');
      let cls='opt';
      if(answers[idx]===l) cls+=' selected';
      if(answers[idx]){
        const correct=q.ans;
        if(l===answers[idx]){
          if(l===correct) cls+=' correct-border';
          else cls+=' wrong-border';
        } else if(l===correct && answers[idx]!==correct){
          cls+=' correct-border';
        }
      }
      b.className=cls;
      b.innerHTML='<span class="letter">'+l+'</span><span class="opt-text">'+(q.opts[l]||'')+'</span>';
      b.onclick=()=>{
        const prev=answers[idx];
        const isNew = prev!==l;
        answers[idx]=l; 
        if(isNew){ if(l===q.ans) playCorrectSound(); else playWrongSound(); }
        render();
      };
      $('options').appendChild(b);
    });
    if(answers[idx]) checkImmediate(idx,answers[idx]);
    $('bar').style.width=((idx+1)/questions.length*100)+'%';
    const done=answers.filter(Boolean).length;
    $('doneCount').textContent='Đã làm '+done+'/'+questions.length;
    $('prev').disabled=idx===0;
    $('next').classList.toggle('hidden', idx===questions.length-1);
    buildGrid();
  }
  function checkImmediate(i, chosen){
    const q=questions[i];
    const correct=q.ans;
    let msg=document.getElementById('instantFeedback');
    if(!msg){msg=document.createElement('div'); msg.id='instantFeedback'; $('options').parentNode.insertBefore(msg, $('options').nextSibling);}
    if(chosen===correct){
      msg.className='instant-feedback correct';
      msg.innerHTML='✅ ĐÚNG! Đáp án '+correct;
    } else {
      msg.className='instant-feedback wrong';
      msg.innerHTML='❌ SAI! Bạn chọn '+chosen+' - Đúng là '+correct+' - '+(q.opts[correct]||'');
    }
  }
  function buildGrid(){$('qgrid').innerHTML=''; questions.forEach((q,i)=>{let b=document.createElement('button'); b.textContent=i+1; if(answers[i]) b.classList.add('done'); if(i===idx) b.classList.add('current'); b.onclick=()=>{idx=i; render(); window.scrollTo({top:0,behavior:'smooth'});}; $('qgrid').appendChild(b);});}
  function launchFireworks(){
    const canvas=$('fireworks'); const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    canvas.classList.add('active');
    let particles=[];
    function createBurst(x,y){
      const colors=['#ff8a65','#81c784','#64b5f6','#ffd54f','#ba68c8','#4dd0e1'];
      for(let i=0;i<38;i++) particles.push({x,y,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12-2.5,r:Math.random()*3+2,color:colors[Math.floor(Math.random()*colors.length)],life:1,decay:0.014+Math.random()*0.02});
    }
    let bursts=0;
    const interval=setInterval(()=>{createBurst(Math.random()*canvas.width, Math.random()*canvas.height*0.55+30); bursts++; if(bursts>9) clearInterval(interval);}, 320);
    function animate(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles=particles.filter(p=>p.life>0);
      particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=p.decay; ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();});
      ctx.globalAlpha=1;
      if(particles.length>0 || bursts<=9) requestAnimationFrame(animate);
      else {canvas.classList.remove('active'); ctx.clearRect(0,0,canvas.width,canvas.height);}
    }
    animate();
  }
  function finish(auto=false){ 
    clearInterval(timerInt); 
    let correct=answers.filter((a,i)=>a===questions[i].ans).length; 
    let score=correct*2;
    $('score').textContent=score+' / 100'; 
    const resultBox=$('resultBox');
    resultBox.classList.remove('result-card','pass','fail');
    if(score>=80){
      $('summary').innerHTML='<div style="font-size:21px;font-weight:700;color:#15803d;margin:12px 0">🎉 XUẤT SẮC! '+score+' ĐIỂM!</div><div>Đúng '+correct+'/50 câu - Đủ điều kiện an toàn</div>';
      resultBox.classList.add('result-card','pass');
      launchFireworks(); playVictorySound();
      if(navigator.vibrate) navigator.vibrate([80,40,80,40,150]);
    } else {
      $('summary').innerHTML='<div style="font-size:21px;font-weight:800;color:#dc2626;margin:12px 0">⚠️ CHƯA ĐẠT - '+score+' ĐIỂM</div><div style="color:#7f1d1d">Đúng '+correct+'/50 câu</div><div style="margin-top:10px;font-size:14px;color:#991b1b;background:#fee2e2;padding:12px;border-radius:12px;border:1.5px solid #fecaca">Cần 80 điểm để đạt. Bạn còn thiếu '+(80-score)+' điểm. Hãy ôn lại nhé!</div>';
      resultBox.classList.add('result-card','fail');
      playFailSound();
      if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]);
    }
    $('review').innerHTML=questions.map((q,i)=>{let ok=answers[i]===q.ans; return '<div class="card" style="border-color:'+(ok?'#86efac':'#fca5a5')+';border-width:1.5px"><b>Câu '+(i+1)+'</b> - Bạn chọn '+(answers[i]||'chưa làm')+' - Đúng: '+q.ans+'<div style="margin-top:8px;line-height:1.6">'+(q.opts[q.ans]||'')+'</div></div>'}).join(''); 
    show('result'); window.scrollTo(0,0);
  }
  const btnNormal=$('btnNormal'), btnWarm=$('btnWarm'), btnLarge=$('btnLarge');
  function setEye(mode){
    document.body.classList.remove('warm','large');
    document.querySelectorAll('.eye-btn').forEach(b=>b.classList.remove('active'));
    if(mode==='warm'){document.body.classList.add('warm'); btnWarm.classList.add('active');}
    else if(mode==='large'){document.body.classList.add('large'); btnLarge.classList.add('active');}
    else {btnNormal.classList.add('active');}
    localStorage.setItem('eyeMode',mode);
  }
  btnNormal.onclick=()=>setEye('normal');
  btnWarm.onclick=()=>setEye('warm');
  btnLarge.onclick=()=>setEye('large');
  setEye(localStorage.getItem('eyeMode')||'normal');
  document.getElementById('start').addEventListener('click', start);
  $('prev').onclick=()=>{if(idx>0){idx--; render(); window.scrollTo({top:0,behavior:'smooth'});}};
  $('next').onclick=()=>{if(idx<questions.length-1){idx++; render(); window.scrollTo({top:0,behavior:'smooth'});}};
  $('submit').onclick=()=>{ finish(false); };
  $('again').onclick=start;
  $('choose').onclick=()=>{clearInterval(timerInt); show('home');};
  $('homeBtn').onclick=()=>{clearInterval(timerInt); show('home');};
});
</script></body></html>
