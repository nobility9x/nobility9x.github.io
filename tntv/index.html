<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trạng Nguyên Tiếng Việt – Chọn đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1f2937;background-color:#f7f1de;background-image:radial-gradient(rgba(37,99,235,.10) 1.6px,transparent 1.8px),radial-gradient(rgba(245,158,11,.13) 1.6px,transparent 1.8px);background-size:26px 26px,34px 34px;background-position:0 0,13px 17px}
.wrap{max-width:700px;margin:0 auto;padding:20px 14px 34px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#312e81 0%,#2563eb 52%,#0ea5e9 100%);border-radius:24px;padding:30px 18px 26px;text-align:center;box-shadow:0 16px 34px rgba(37,99,235,.35)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1.6px,transparent 1.9px);background-size:22px 22px;opacity:.45}
.crown{position:relative;display:inline-flex;align-items:center;justify-content:center;width:82px;height:82px;font-size:44px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);border-radius:50%;box-shadow:0 0 0 8px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.18);animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero h1{position:relative;font-family:'Baloo 2',cursive;font-size:31px;margin:10px 0 4px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero p{position:relative;margin:0;color:#dbeafe;font-weight:600;font-size:16.5px}
.pick{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:22px;padding:20px 18px;margin-top:16px;text-decoration:none;color:#fff;box-shadow:0 14px 28px rgba(31,41,55,.22)}
.pick::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.30) 1.6px,transparent 1.9px);background-size:20px 20px;opacity:.35}
.pick:active{transform:scale(.985)}
.p1{background:linear-gradient(120deg,#2563eb,#0ea5e9)}
.p2{background:linear-gradient(120deg,#6d28d9,#a855f7)}
.p3{background:linear-gradient(120deg,#059669,#22c55e)}
.pnum{position:relative;font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;color:#fff;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4);border-radius:14px;padding:12px 10px;min-width:74px;text-align:center;line-height:1.1}
.ptext{position:relative}
.pick h2{font-size:20px;margin:0 0 3px;color:#fff;font-family:'Baloo 2',cursive}
.pick p{margin:0;color:rgba(255,255,255,.88);font-weight:600;font-size:13.5px}
.wm{position:absolute;right:2px;top:50%;transform:translateY(-52%);font-family:'Baloo 2',cursive;font-size:118px;font-weight:800;color:rgba(255,255,255,.15);line-height:1}
.go{position:relative;margin-left:auto;flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff}
.ribbon{position:absolute;top:12px;right:14px;background:#facc15;color:#713f12;font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:999px;transform:rotate(3deg);box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:2}
.foot{text-align:center;color:#78716c;font-weight:600;margin-top:24px;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="crown">🏯</div>
    <h1>Trạng Nguyên Tiếng Việt</h1>
    <p>Chọn một đề để làm bài nhé!</p>
  </div>
  <a class="pick p1" href="./de-1/"><span class="wm">1</span><span class="pnum">ĐỀ 1</span><span class="ptext"><h2>Trạng Nguyên Tiếng Việt · Lớp 4</h2><p>Thi Hương · Mã đề 01 · Câu 1–15</p></span><span class="go">›</span></a><a class="pick p2" href="./de-2/"><span class="wm">2</span><span class="pnum">ĐỀ 2</span><span class="ptext"><h2>Trạng Nguyên Tiếng Việt · Lớp 4</h2><p>Thi Hương · Mã đề 01 · Câu 16–30</p></span><span class="go">›</span></a><a class="pick p3" href="./de-3/"><span class="wm">3</span><span class="ribbon">MỚI ⭐</span><span class="pnum">ĐỀ 3</span><span class="ptext"><h2>Trạng Nguyên Tiếng Việt · Lớp 1</h2><p>Thi Hương · 20 câu</p></span><span class="go">›</span></a>
  <div class="foot">Chúc bé thi thật tốt! 🌟</div>
</div>
</body>
</html>
