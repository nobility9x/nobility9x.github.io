<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />

    <title>IOE Lớp 4 – Practice Test 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f3eb;
        --card: #fffdf7;
        --card2: #ffffff;
        --ink: #2b2b2b;
        --heading: #1e293b;
        --muted: #6b7280;
        --muted2: #5b6472;
        --blue: #1d8a4e;
        --blue-dark: #146c3c;
        --orange: #1d8a4e;
        --green: #1d8a4e;
        --pink: #e84393;
        --tint: #e6f7ec;
        --brd-green: #a9dcbc;
        --line: #e8e2d6;
        --chip: #e6f7ec;
        --shadow: 0 4px 14px rgba(43, 43, 43, .08);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .wrap { max-width: 880px; margin: 0 auto; padding: 16px 14px 40px; background: var(--card); }
      h1, h2 { font-family: "Be Vietnam Pro", sans-serif; color: var(--heading); }
      /* ---------- Home ---------- */
      .home-head { text-align: center; padding: 10px 4px 4px; }
      .home-head h1 { font-size: clamp(26px, 6vw, 40px); margin: 0 0 4px; color: var(--heading); }
      .home-head p { margin: 0; color: var(--muted); font-weight: 700; font-size: 16px; }
      .stars { font-size: 20px; letter-spacing: 6px; margin-bottom: 2px; }
      .test-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 18px; }
      @media (min-width: 640px) { .test-list { grid-template-columns: 1fr 1fr; } }
      .test-card {
        display: flex; align-items: center; gap: 12px; text-align: left;
        background: linear-gradient(120deg, var(--tint) 0%, #ffffff 62%); border: 2px solid var(--brd-green); border-radius: 18px;
        padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow);
        font: inherit; color: inherit; width: 100%;
      }
      .test-card:active { transform: scale(.99); }
      .test-num {
        flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: "Be Vietnam Pro", sans-serif; font-weight: 800; font-size: 20px; color: #fff;
      }
      .test-card .t-name { font-weight: 800; font-size: 16px; line-height: 1.25; }
      .test-card .t-sub { color: var(--muted2); font-weight: 700; font-size: 13px; margin-top: 2px; }
      .test-card .t-best { margin-left: auto; flex: 0 0 auto; text-align: right; font-weight: 800; font-size: 13px; color: var(--green); }
      .test-card .t-best small { display: block; color: var(--muted); font-size: 11px; }
      /* ---------- Test view ---------- */
      .bar {
        position: sticky; top: 0; z-index: 40; background: rgba(255, 253, 247, .94);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        padding: 8px 0 10px; margin: 0 -2px;
      }
      .bar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .btn {
        font: inherit; font-weight: 800; border: 0; border-radius: 999px;
        padding: 9px 16px; cursor: pointer; font-size: 15px;
      }
      .btn-blue { background: var(--blue); color: #fff; }
      .btn-blue:active { background: var(--blue-dark); }
      .btn-ghost { background: var(--blue); color: #fff; }
      .btn-ghost:active { background: var(--blue-dark); }
      .btn-orange { background: var(--orange); color: #fff; }
      .bar h2 { font-size: 19px; margin: 0; flex: 1 1 auto; min-width: 140px; }
      .progress { font-weight: 800; color: var(--muted); font-size: 14px; white-space: nowrap; }
      .progress b { color: var(--blue); }
      .note {
        background: #fff3d6; color: #7a5410; border: 1.5px dashed #e8b93e;
        border-radius: 12px; padding: 9px 12px; font-weight: 700; font-size: 14.5px; margin: 4px 0 10px;
      }
      .score-banner {
        display: none; border-radius: 14px; padding: 12px 14px; margin: 4px 0 12px;
        font-weight: 800; font-size: 17px; text-align: center;
        background: #e5f7ec; color: #146c39; border: 2px solid #9adbb4;
      }
      .score-banner.show { display: block; }
      .score-banner.pass { background: linear-gradient(135deg, #ecfdf5, #d1fae5); color: #146c39; border: 2px solid #16a34a; padding: 18px 14px; }
      .score-banner.fail { background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #991b1b; border: 2px solid #dc2626; padding: 18px 14px; }
      .score-banner .big-score { display: block; font-weight: 800; font-size: 48px; line-height: 1.05; margin: 4px 0; }
      .score-banner .result-title { display: block; font-size: 22px; font-weight: 800; }
      .score-banner .subline { display: block; font-size: 15px; font-weight: 700; opacity: .96; margin-top: 2px; }
      @keyframes softBlink { 0%,100%{opacity:1} 50%{opacity:.7} }
      @media (prefers-reduced-motion: reduce){ .ring.bad,.txt.bad,.mlabel.bad{animation:none !important} }
      #fwCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; display: none; }
      /* ---------- Stage (book page + overlays) ---------- */
      .stage {
        position: relative; width: 100%; border-radius: 10px; overflow: hidden;
        box-shadow: var(--shadow); background: #fff; container-type: inline-size;
        touch-action: manipulation;
      }
      .stage img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
      .tap {
        position: absolute; background: transparent; border: 0; margin: 0; padding: 0;
        cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 5;
      }
      .ring {
        position: absolute; border-radius: 50%; pointer-events: none;
        transform: translate(-50%, -50%); z-index: 6; display: none;
        border: 1px solid var(--blue);
      }
      .ring.sel { display: block; border-color: var(--blue); }
      .ring.ok { display: block; border-color: #16a34a; border-width: 1px; box-shadow: 0 0 0 4px rgba(22,163,74,.12), 0 0 10px 3px rgba(22,163,74,.35); }
      .ring.bad { display: block; border-color: #dc2626; border-width: 1px; box-shadow: 0 0 0 4px rgba(220,38,38,.10), 0 0 10px 3px rgba(220,38,38,.30); animation: softBlink .5s ease 3; }
      .mark {
        position: absolute; transform: translate(-50%, -50%); z-index: 8;
        font-weight: 900; font-size: 3.4cqw; pointer-events: none; display: none;
        text-shadow: 0 0 4px #fff, 0 0 4px #fff;
      }
      .mark.ok { color: #16a34a; display: block; }
      .mark.bad { color: #dc2626; display: block; }
      .txt {
        position: absolute; z-index: 7; border: 1px solid rgba(43, 43, 43, .35);
        background: rgba(255, 255, 255, .55); border-radius: 3px;
        font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: #2b2b2b;
        padding: 0 4px; outline: none;
      }
      .txt:focus { background: rgba(255, 255, 255, .88); border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,138,78,.18); }
      .txt.ok { border: 2px solid #16a34a; background: rgba(236, 253, 245, .85); }
      .txt.bad { border: 2px solid #dc2626; background: rgba(254, 242, 242, .85); animation: softBlink .5s ease 3; }
      .txt.line { font-size: 2.75cqw; }
      .txt.blank { font-size: 3.1cqw; text-align: center; }
      .ans-tag {
        position: absolute; z-index: 8; display: none; pointer-events: none;
        font-size: 2.55cqw; font-weight: 800; color: #146c39;
        background: rgba(255, 255, 255, .92); border: 1px solid #9adbb4; border-radius: 4px;
        padding: 0 5px; white-space: nowrap; transform: translateY(-10%);
      }
      .ans-tag.show { display: block; }
      .card-hit { position: absolute; z-index: 5; background: transparent; border: 0; margin: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 8px; }
      .card-hit.picked { box-shadow: inset 0 0 0 3px var(--orange), 0 0 0 2px rgba(29, 138, 78, .5); }
      .card-hit.ok { box-shadow: inset 0 0 0 3px #16a34a; }
      .card-hit.bad { box-shadow: inset 0 0 0 3px #dc2626; }
      .word-hit { position: absolute; z-index: 5; background: transparent; border: 0; margin: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 6px; }
      .word-hit.armed { box-shadow: inset 0 0 0 2px rgba(29, 138, 78, .55); background: rgba(29, 138, 78, .08); }
      .word-hit.used { box-shadow: inset 0 0 0 2px rgba(120, 130, 150, .5); background: rgba(120, 130, 150, .13); }
      .mlabel {
        position: absolute; z-index: 8; transform: translate(-50%, -50%);
        min-width: 7.5%; height: 3.1%; display: none; align-items: center; justify-content: center;
        font-weight: 900; font-size: 3.6cqw; color: var(--blue-dark);
        background: rgba(255, 255, 255, .85); border-radius: 4px; pointer-events: none;
      }
      .mlabel.show { display: flex; }
      .mlabel.ok { color: #16a34a; box-shadow: inset 0 0 0 2px #16a34a; }
      .mlabel.bad { color: #dc2626; box-shadow: inset 0 0 0 2px #dc2626; animation: softBlink .5s ease 3; }
      .mcorrect {
        position: absolute; z-index: 8; transform: translate(-50%, -50%); display: none;
        font-weight: 900; font-size: 2.5cqw; color: #146c39; background: rgba(255,255,255,.92);
        border: 1px solid #9adbb4; border-radius: 4px; padding: 0 4px; pointer-events: none; white-space: nowrap;
      }
      .mcorrect.show { display: block; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
      .actions .btn { font-size: 16px; padding: 11px 20px; }
      .locked .tap, .locked .txt, .locked .card-hit, .locked .word-hit { pointer-events: none; }
      .hidden { display: none !important; }
    </style>
  </head>

          b.innerHTML = "<span class='test-num' style='background:" + CARD_COLORS[i] + "'>" + (i + 1) + "</span>" +
            "<span><span class='t-name'>Đề " + (i + 1) + " · " + t.name + "</span><br>" +
            "<span class='t-sub'>" + t.range + " · " + total + " câu</span></span>" + bestHtml;
          b.addEventListener("click", function () { openTest(i); });
          list.appendChild(b);
        });
      }

      /* =============== TEST VIEW =============== */
      function openTest(i) {
        cur = i; sel = {}; matchSel = {}; pickedPic = null; submitted = false; var _fw = $("fwCanvas"); if (_fw) _fw.style.display = "none";
        var t = TESTS[i];
        $("testTitle").textContent = "Đề " + (i + 1) + " · " + t.name;
        var note = $("testNote");
        if (t.note) { note.textContent = t.note; note.classList.remove("hidden"); } else { note.classList.add("hidden"); }
        $("scoreBanner").className = "score-banner";
        $("btnNext").classList.toggle("hidden", i >= TESTS.length - 1);
        $("pageImg").src = t.page;
        buildOverlay();
        homeEl.classList.add("hidden");
        testEl.classList.remove("hidden");
        stageEl.classList.remove("locked");
        window.scrollTo(0, 0);
        updateProgress();
      }
      function goHome() {
        testEl.classList.add("hidden");
        homeEl.classList.remove("hidden");
        renderHome();
        window.scrollTo(0, 0);
      }
      function buildOverlay() {
        overlayEl.innerHTML = "";
        var t = TESTS[cur];
        if (t.match) { buildMatch(t); return; }
        t.qs.forEach(function (q) { if (q.k === "mc") buildMc(q, t); else buildText(q); });
      }
      function ringEl(q, li, t) {
        var r = document.createElement("span");
        r.className = "ring";
        var ring = q.ring || t.ring || [3.4, 2.4];
        r.style.width = ring[0] + "%"; r.style.height = ring[1] + "%";
        r.style.left = q.pts[li][0] + "%"; r.style.top = q.pts[li][1] + "%";
        r.id = "ring-" + q.n + "-" + LET[li];
        return r;
      }
      function buildMc(q, t) {
        q.pts.forEach(function (p, li) {
          var tw = q.tw || t.tw || 13, th = q.th || t.th || 2.3;
          var btn = document.createElement("button");
          btn.className = "tap"; btn.type = "button";
          btn.setAttribute("aria-label", "Câu " + q.n + " đáp án " + LET[li]);
          btn.style.left = (p[0] - 1.6) + "%"; btn.style.top = (p[1] - th / 2) + "%";
          btn.style.width = tw + "%"; btn.style.height = th + "%";
          btn.addEventListener("click", function () { chooseMc(q, li); });
          overlayEl.appendChild(btn);
          overlayEl.appendChild(ringEl(q, li, t));
        });
        var m = document.createElement("span");
        m.className = "mark"; m.id = "mark-" + q.n;
        var fp = q.pts[LET.indexOf(q.ans)];
        m.style.left = (fp[0] + ((q.ring || t.ring || [3.4, 2.4])[0] / 2 + 1.6)) + "%";
        m.style.top = fp[1] + "%";
        overlayEl.appendChild(m);
      }
      function buildText(q) {
        var inp = document.createElement("input");
        inp.className = "txt " + q.mode; inp.type = "text"; inp.id = "txt-" + q.n;
        inp.setAttribute("aria-label", "Câu " + q.n);
        inp.autocomplete = "off"; inp.spellcheck = false;
        inp.style.left = q.x + "%"; inp.style.width = q.w + "%";
        if (q.mode === "line") { inp.style.top = (q.y - 2.05) + "%"; inp.style.height = "2.05%"; }
        else { inp.style.top = (q.y - 1.15) + "%"; inp.style.height = "2.3%"; }
        inp.addEventListener("input", updateProgress);
        overlayEl.appendChild(inp);
        var tag = document.createElement("span");
        tag.className = "ans-tag"; tag.id = "tag-" + q.n;
        tag.style.left = q.x + "%";
        tag.style.top = (q.mode === "line" ? q.y + 0.25 : q.y + 1.35) + "%";
        tag.textContent = "Đáp án: " + q.ans[0];
        overlayEl.appendChild(tag);
      }
      /* ----- matching (Đề 5) ----- */
      function buildMatch(t) {
        t.match.groups.forEach(function (g, gi) {
          g.words.forEach(function (w) {
            var b = document.createElement("button");
            b.className = "word-hit"; b.type = "button"; b.id = "word-" + gi + "-" + w.L;
            b.setAttribute("aria-label", "Từ " + w.L);
            b.style.left = w.r[0] + "%"; b.style.top = w.r[1] + "%";
            b.style.width = w.r[2] + "%"; b.style.height = w.r[3] + "%";
            b.addEventListener("click", function () { chooseWord(gi, w.L); });
            overlayEl.appendChild(b);
          });
        });
        t.match.pics.forEach(function (p) {
          var b = document.createElement("button");
          b.className = "card-hit"; b.type = "button"; b.id = "pic-" + p.n;
          b.setAttribute("aria-label", "Hình câu " + p.n);
          b.style.left = p.card[0] + "%"; b.style.top = p.card[1] + "%";
          b.style.width = p.card[2] + "%"; b.style.height = p.card[3] + "%";
          b.addEventListener("click", function () { pickPic(p.n); });
          overlayEl.appendChild(b);
          var lab = document.createElement("span");
          lab.className = "mlabel"; lab.id = "mlab-" + p.n;
          lab.style.left = p.tab[0] + "%"; lab.style.top = p.tab[1] + "%";
          overlayEl.appendChild(lab);
          var cor = document.createElement("span");
          cor.className = "mcorrect"; cor.id = "mcor-" + p.n;
          cor.style.left = p.tab[0] + "%"; cor.style.top = (p.tab[1] + 2.6) + "%";
          cor.textContent = "Đúng là: " + p.ans;
          overlayEl.appendChild(cor);
        });
      }
      function refreshMatchUI() {
        var t = TESTS[cur];
        t.match.pics.forEach(function (p) {
          var lab = $("mlab-" + p.n), card = $("pic-" + p.n);
          var v = matchSel[p.n];
          lab.textContent = v || "";
          lab.classList.toggle("show", !!v);
          card.classList.toggle("picked", pickedPic === p.n);
        });
        t.match.groups.forEach(function (g, gi) {
          g.words.forEach(function (w) {
            var used = t.match.pics.some(function (p) { return p.g === gi && matchSel[p.n] === w.L; });
            var el = $("word-" + gi + "-" + w.L);
            el.classList.toggle("used", used);
            el.classList.toggle("armed", pickedPic !== null && TESTS[cur].match.pics[pickedPic - FIRST_Q[cur]].g === gi);
          });
        });
      }
      function pickPic(n) {
        if (submitted) return;
        pickedPic = (pickedPic === n) ? null : n;
        refreshMatchUI();
      }
      function chooseWord(gi, L) {
        if (submitted || pickedPic === null) return;
        var t = TESTS[cur];
        var pic = t.match.pics[pickedPic - FIRST_Q[cur]];
        if (!pic || pic.g !== gi) return;
        /* each word used once per group: steal it back from the other picture */
        t.match.pics.forEach(function (p) { if (p.g === gi && matchSel[p.n] === L) delete matchSel[p.n]; });
        matchSel[pickedPic] = L;
        pickedPic = null;
        refreshMatchUI();
        updateProgress();
      }
      /* ----- interaction ----- */
      function chooseMc(q, li) {
        if (submitted) return;
        sel[q.n] = LET[li];
        q.pts.forEach(function (p, i2) {
          $("ring-" + q.n + "-" + LET[i2]).className = "ring" + (i2 === li ? " sel" : "");
        });
        updateProgress();
      }
      function answeredCount() {
        var t = TESTS[cur], c = 0;
        if (t.match) { t.match.pics.forEach(function (p) { if (matchSel[p.n]) c++; }); return c; }
        t.qs.forEach(function (q) {
          if (q.k === "mc") { if (sel[q.n]) c++; }
          else { var el = $("txt-" + q.n); if (el && el.value.trim() !== "") c++; }
        });
        return c;
      }
      function updateProgress() {
        var t = TESTS[cur], total = allQuestions(t).length;
        $("progress").innerHTML = "Đã làm <b>" + answeredCount() + "/" + total + "</b> câu";
      }
      /* ----- grading ----- */
      function norm(s) {
        return (s || "").toLowerCase()
          .replace(/[\u2018\u2019\u02BC]/g, "'")
          .replace(/\s+/g, " ")
          .replace(/[\s.!?,;:]+$/, "")
          .trim();
      }
      function grade() {
        if (submitted) return;
        submitted = true;
        var t = TESTS[cur], total = allQuestions(t).length, score = 0;
        if (t.match) {
          t.match.pics.forEach(function (p) {
            var v = matchSel[p.n], ok = v === p.ans;
            if (ok) score++;
            var lab = $("mlab-" + p.n), card = $("pic-" + p.n);
            lab.classList.add("show");
            if (!v) lab.textContent = "–";
            lab.classList.add(ok ? "ok" : "bad");
            card.classList.add(ok ? "ok" : "bad");
            if (!ok) $("mcor-" + p.n).classList.add("show");
          });
        } else {
          t.qs.forEach(function (q) {
            if (q.k === "mc") {
              var v = sel[q.n], ok = v === q.ans;
              if (ok) score++;
              q.pts.forEach(function (p, li) {
                var r = $("ring-" + q.n + "-" + LET[li]);
                r.className = "ring";
                if (LET[li] === q.ans) r.classList.add("ok");
                else if (LET[li] === v) r.classList.add("bad");
              });
              var m = $("mark-" + q.n);
              m.textContent = ok ? "✓" : "✗";
              m.className = "mark " + (ok ? "ok" : "bad");
            } else {
              var el = $("txt-" + q.n);
              var ok2 = q.ans.some(function (a) { return norm(el.value) === norm(a); });
              if (ok2) score++;
              el.classList.add(ok2 ? "ok" : "bad");
              if (!ok2) $("tag-" + q.n).classList.add("show");
            }
          });
        }
        var pct = Math.round(score / total * 100);
        var passed = score / total >= 0.9;
        var needMore = Math.ceil(total * 0.9) - score;
        var banner = $("scoreBanner");
        banner.className = "score-banner show " + (passed ? "pass" : "fail");
        banner.innerHTML = passed
          ? "<span class='result-title'>🎉 XUẤT SẮC!</span><span class='big-score'>" + score + "/" + total + "</span><span class='subline'>Đạt " + pct + "% — giỏi lắm!</span>"
          : "<span class='result-title'>💪 CỐ LÊN NHÉ!</span><span class='big-score'>" + score + "/" + total + "</span><span class='subline'>Đạt " + pct + "%. Cần đúng thêm " + needMore + " câu nữa để đạt 90%.</span>";
        if (passed) { sfxWin(); vibrate([80, 40, 80, 40, 150]); launchFireworks(); }
        else { sfxLose(); vibrate([200, 80, 200, 80, 300]); }
        stageEl.classList.add("locked");
        if (!best[cur] || score > best[cur].score) best[cur] = { score: score, total: total };
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      /* ----- buttons ----- */
      $("btnSubmit").addEventListener("click", grade);
      $("btnRetry").addEventListener("click", function () { if (cur >= 0) openTest(cur); });
      $("btnBack").addEventListener("click", goHome);
      $("btnNext").addEventListener("click", function () { if (cur < TESTS.length - 1) openTest(cur + 1); });
      renderHome();
    </script>
  </body>
</html>
